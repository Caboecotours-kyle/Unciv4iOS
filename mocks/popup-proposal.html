<!doctype html>
<!--
PROPOSAL, not approved. Popup and unit-action design for the portrait Unciv fork.
Built on the approved portrait-hud.html language: navy panels, white discs, yellow primary, bold rounded type, 48px targets.
Map backdrops are snapshots of the approved portrait-hud.html map with its HUD hidden. Icons are Unciv's own, inlined.
Four popup shapes only: Card (1 to 2 choices), Sheet (a list), Moment (full-bleed story), Toast (no choice).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unciv Portrait: popup proposal</title>
<style>
:root{
  --navy:#132435; --navy2:#1c3249; --panel:rgba(16,31,47,.9); --line:rgba(255,255,255,.12);
  --ink:#fff; --ink2:#b7cde0; --ink3:#7f9ab2;
  --yellow:#ffc93c; --yellow-ink:#3a2a00; --red:#e0524a; --red-d:#a8322c;
  --bab:#2f7fe0; --gre:#e0524a;
  --food:#6fd05a; --prod:#ff9a3c; --gold:#ffc93c; --sci:#5cc8ff; --cul:#d38bff; --fai:#f3ecd2; --hap:#b8e35a;
  --r:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b1622;color:var(--ink);font-family:var(--r);-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;align-items:center;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}

/* canvas chrome (same as the other mocks) */
.chrome{width:100%;display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;align-items:center;padding:10px 10px 6px;flex:none}
.seg{display:flex;background:#16283a;border-radius:14px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{min-height:40px;padding:8px 12px;border-radius:11px;font-weight:800;font-size:15px;color:var(--ink2);white-space:nowrap}
.seg.small button{min-height:36px;padding:6px 10px;font-size:13.5px}
.seg button[aria-pressed=true]{background:#fff;color:var(--navy)}
.thesis{width:100%;text-align:center;font-size:13px;color:var(--ink2);font-weight:600;min-height:18px;padding:0 8px}
.stagewrap{flex:1;width:100%;display:flex;align-items:flex-start;justify-content:center;min-height:0;overflow:hidden}
.device{position:relative;transform-origin:top center;border-radius:54px;overflow:hidden;flex:none;
  box-shadow:0 0 0 10px #05090e,0 0 0 11px #2a3b4d,0 30px 60px rgba(0,0,0,.5);background:#e4edf4}
.device.bare{border-radius:0;box-shadow:none}
.screen{position:absolute;inset:0;overflow:hidden}

/* shared HUD pieces, values copied from portrait-hud.html */
.mapbg{position:absolute;left:0;top:0;width:393px;height:852px;background-size:393px 852px;transform-origin:0 0}
.sbar{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 42px;font-weight:700;font-size:16px;z-index:5}
.sbar .bat{width:26px;height:12px;border:1.5px solid #fff;border-radius:4px;position:relative}
.sbar .bat::after{content:"";position:absolute;inset:1.5px;right:5px;background:#fff;border-radius:1.5px}
.scrim-t{position:absolute;top:0;left:0;right:0;height:130px;background:linear-gradient(rgba(10,22,34,.62),rgba(10,22,34,0));z-index:3;pointer-events:none}
.scrim-b{position:absolute;bottom:0;left:0;right:0;height:420px;background:linear-gradient(to top,rgba(10,22,34,.66),rgba(10,22,34,0));z-index:3;pointer-events:none}
.ic{display:inline-block;width:22px;height:22px;background:currentColor;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;flex:none}
svg.st{width:18px;height:18px;flex:none}
.stats{position:absolute;top:54px;left:10px;right:10px;height:50px;background:var(--panel);border-radius:16px;display:flex;align-items:center;padding:0 5px 0 8px;z-index:4;box-shadow:0 4px 14px rgba(0,0,0,.22);overflow:hidden}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;font-size:16.5px;padding:0 5px;height:44px;white-space:nowrap}
.stat small{font-size:12.5px;font-weight:700;color:var(--ink2)}
.stats .turn{margin-left:auto;height:40px;background:rgba(255,255,255,.1);border-radius:12px;padding:0 10px;font-size:15px;font-weight:900;display:flex;align-items:center;gap:6px;flex:none}
.stats .turn .ic{width:16px;height:16px;color:var(--ink2)}
.disc{width:66px;height:66px;border-radius:50%;background:#eef5fb;color:var(--navy);display:grid;place-items:center;box-shadow:0 5px 0 #b9cadb,0 9px 18px rgba(0,0,0,.25);position:relative;flex:none}
.disc .ic{width:32px;height:32px}
.disc.y{background:var(--yellow);color:var(--yellow-ink);box-shadow:0 5px 0 #c9951c,0 9px 18px rgba(0,0,0,.25)}
.disc.navy{background:var(--navy2);color:#fff;box-shadow:0 5px 0 #0b1826,0 9px 18px rgba(0,0,0,.3)}
.disc.off{opacity:.45}
.badge{position:absolute;top:-5px;right:-5px;min-width:28px;height:28px;border-radius:14px;background:var(--navy);color:#fff;font-size:14px;font-weight:900;display:grid;place-items:center;padding:0 7px;box-shadow:0 0 0 2.5px var(--yellow)}
.utag{position:absolute;left:10px;right:10px;top:112px;background:var(--panel);border-radius:18px;padding:10px 4px 10px 10px;display:flex;align-items:center;gap:12px;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.uport{width:46px;height:46px;border-radius:50%;background:var(--bab);display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);flex:none;overflow:hidden}
.uport img{width:44px;height:44px;object-fit:contain;margin-top:6px}
.uname{font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uline{display:flex;gap:10px;margin-top:1px;font-size:14px;font-weight:800;color:var(--ink2)}
.uline span{display:flex;align-items:center;gap:4px}
.qmini{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:13px;font-weight:800;color:var(--ink2);flex:none;white-space:nowrap}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2)}
.dots i.on{background:var(--yellow);width:20px;border-radius:4px}
.x{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none}
.x .ic{width:18px;height:18px;color:var(--ink2)}
.zdisc{position:absolute;left:10px;top:196px;z-index:5;width:56px;height:56px;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11.5px;font-weight:900;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.zdisc .ic{width:22px;height:22px}

/* PROPOSAL: the approved thumb arc (radius 182, 26deg apart), icons only. A name shows on press-and-hold or keyboard focus. */
.arc{position:absolute;inset:0;z-index:5;pointer-events:none}
.arc>*{pointer-events:auto}
.abtn{position:absolute;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;outline:none}
.abtn .disc{transition:transform .08s}
.abtn.down .disc{transform:translateY(3px) scale(.96)}
.abtn:focus-visible .disc{outline:3px solid var(--yellow);outline-offset:4px}
.abtn.fired .disc{animation:fired .45s ease-out}
@keyframes fired{0%{box-shadow:0 0 0 0 rgba(255,201,60,.9),0 5px 0 #b9cadb}100%{box-shadow:0 0 0 18px rgba(255,201,60,0),0 5px 0 #b9cadb}}
.tip{position:absolute;z-index:8;background:var(--navy);border-radius:12px;padding:7px 11px;font-size:15px;font-weight:800;line-height:1.2;box-shadow:0 6px 16px rgba(0,0,0,.35);pointer-events:none;white-space:nowrap;animation:tipIn .12s ease-out both}
.tip .tnote{display:flex;align-items:center;gap:4px;margin-top:3px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.tip .tnote svg{width:13px;height:13px;flex:none}
@keyframes tipIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.tip,.abtn.fired .disc{animation:none}}
.anchor{position:absolute;width:96px;height:96px;border-radius:50%;background:var(--yellow);color:var(--yellow-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:15px;box-shadow:0 5px 0 #c9951c,0 12px 24px rgba(0,0,0,.35);gap:2px;text-align:center;line-height:1.1;padding:0 5px}
.anchor .ic{width:34px;height:34px}
.anchor span.t{max-width:86px;white-space:nowrap}
.anchor span.t.wrap{white-space:normal;hyphens:auto;-webkit-hyphens:auto}

/* popups */
.scrim{position:absolute;inset:0;background:rgba(10,22,34,.5);z-index:6}
.card{position:absolute;left:10px;right:10px;bottom:30px;background:var(--panel);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:28px;padding:18px 16px 16px;z-index:7;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.chead{display:flex;gap:14px;align-items:flex-start}
.cq{font-size:20px;font-weight:900;line-height:1.25;flex:1;min-width:0;overflow-wrap:anywhere}
.cq small{display:block;font-size:14.5px;font-weight:700;color:var(--ink2);margin-top:6px;line-height:1.35}
.cart{width:56px;height:56px;border-radius:50%;flex:none;background-size:cover;background-position:center 20%;display:grid;place-items:center;overflow:hidden}
.cart img{width:54px;height:54px;object-fit:contain;margin-top:8px}
.cart.warn{background:rgba(224,82,74,.2);color:#ffb1aa}
.cart.warn .ic{width:28px;height:28px}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.btns.row{flex-direction:row}
.btns.row>*{flex:1}
.b{min-height:56px;border-radius:18px;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 14px;text-align:center;line-height:1.2}
.b.y{background:var(--yellow);color:var(--yellow-ink);box-shadow:0 4px 0 #c9951c}
.b.red{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-d)}
.b.g{min-height:52px;background:rgba(255,255,255,.09);color:#fff;font-weight:800;font-size:16.5px}
.b[disabled]{opacity:.4;cursor:default}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#122536;border-radius:28px 28px 0 0;z-index:7;box-shadow:0 -10px 30px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden}
.grab{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:8px auto 0;flex:none}
.shead{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;flex:none}
.stitle{font-size:21px;font-weight:900;flex:1;min-width:0}
.slist{flex:1;overflow:auto;padding:0 12px;scrollbar-width:none;min-height:0}
.slist::-webkit-scrollbar{display:none}
.arow{width:100%;display:flex;align-items:center;gap:14px;min-height:64px;padding:8px 6px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow .disc{width:48px;height:48px;box-shadow:0 3px 0 #b9cadb}
.arow .disc.y{box-shadow:0 3px 0 #c9951c}
.arow .disc .ic{width:26px;height:26px}
.arow .disc.danger{background:rgba(224,82,74,.2);color:#ffb1aa;box-shadow:none}
.aname{font-size:17px;font-weight:800;line-height:1.2}
.arow.danger .aname{color:#ffb1aa}
.chip{display:inline-flex;align-items:center;gap:5px;margin-top:5px;background:rgba(255,255,255,.08);border-radius:10px;padding:4px 9px 4px 7px;font-size:13px;font-weight:800;color:var(--ink2)}
.chip svg{width:14px;height:14px}
.sfoot{flex:none;padding:10px 14px 34px;border-top:1px solid var(--line)}

/* moment: leader intro */
.moment{position:absolute;inset:0;background:#2f7fe0;overflow:hidden}
.mart{position:absolute;left:0;right:0;top:0;height:62%;background-size:cover;background-position:center 18%;animation:mIn 1.8s cubic-bezier(.16,1,.3,1) both}
@keyframes mIn{from{transform:scale(1.12);filter:blur(6px) brightness(1.3)}to{transform:none;filter:none}}
.mcard{position:absolute;left:10px;right:10px;bottom:30px;top:46%;background:rgba(16,31,47,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:28px;padding:20px 18px 16px;box-shadow:0 14px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;animation:rise .7s .4s cubic-bezier(.16,1,.3,1) both}
.mtitle{font-size:30px;font-weight:900;letter-spacing:-.02em;color:#ffd97a;text-shadow:0 2px 0 #7a5410;line-height:1.1}
.msub{font-size:15px;font-weight:800;color:var(--ink2);margin-top:4px}
.mtext{flex:1;min-height:0;overflow:auto;margin:14px -4px 0;padding:0 4px 18px;font-size:15.5px;font-weight:700;line-height:1.45;color:#e8f0f7;scrollbar-width:none;-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
.mtext::-webkit-scrollbar{display:none}
.mtext p+p{margin-top:12px}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

/* number input over the trade sheet */
.tsheet{position:absolute;left:0;right:0;top:50px;bottom:0;background:#122536;border-radius:28px 28px 0 0;padding:14px 16px}
.tpile{border-radius:18px;background:rgba(255,255,255,.05);padding:12px;margin-top:10px;font-weight:800;color:var(--ink2);font-size:15px;height:120px}
.tpile.on{box-shadow:inset 0 0 0 2.5px var(--bab)}
.field{margin-top:14px;height:64px;border-radius:18px;background:#0b1826;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:30px;font-weight:900;box-shadow:inset 0 0 0 2.5px var(--yellow)}
.field.bad{box-shadow:inset 0 0 0 2.5px var(--red)}
.field .caret{width:3px;height:32px;background:var(--yellow);animation:blink 1s steps(1) infinite;margin-left:-6px}
@keyframes blink{50%{opacity:0}}
.field small{margin-left:auto;font-size:14px;font-weight:800;color:var(--ink3)}
.err{margin-top:8px;font-size:14px;font-weight:800;color:#ffb1aa;line-height:1.3}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.steps button{min-height:48px;border-radius:14px;background:rgba(255,255,255,.09);font-weight:900;font-size:16px;text-align:center}
.kb{position:absolute;left:0;right:0;bottom:0;height:291px;background:#cfd3da;padding:6px 6px 0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:46px;gap:7px;z-index:8;color:#000}
.kb button{background:#fff;border-radius:6px;font-family:system-ui,-apple-system,sans-serif;font-size:25px;font-weight:400;text-align:center;box-shadow:0 1px 0 #898a8d}
.kb button.fn{background:transparent;box-shadow:none}
.kb button small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.14em;margin-top:-4px}
.card.kbd{bottom:303px}

/* toast */
.toast{position:absolute;left:10px;right:10px;top:112px;z-index:7;background:var(--panel);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center;font-size:15.5px;font-weight:800;line-height:1.3;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:drop .5s cubic-bezier(.16,1,.3,1) both}
.toast .cart{width:40px;height:40px}
.toast .cart .ic{width:22px;height:22px}
@keyframes drop{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}
.fade-in{animation:rise .38s cubic-bezier(.16,1,.3,1) both}
@media (prefers-reduced-motion:reduce){.fade-in,.mart,.mcard,.toast{animation:none}.field .caret{animation:none}}

/* ===== Extension: Civ, City, Overview, Tutorial. Approved-sheet pieces copied from portrait-hud.html ===== */
.sh-head{display:flex;align-items:center;gap:12px;padding:10px 16px 6px;flex:none}
.sh-title{font-size:23px;font-weight:900;display:flex;align-items:center;gap:6px}
.sh-sub{font-size:14px;font-weight:700;color:var(--ink2);margin-top:1px}
.sh-head .x{margin-left:auto;background:rgba(255,255,255,.09)}
.pop{width:48px;height:48px;border-radius:50%;background:var(--bab);display:grid;place-items:center;font-weight:900;font-size:21px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);flex:none}
.yields{display:flex;justify-content:space-between;padding:8px 16px 12px;flex:none}
.y1{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;font-size:16px;min-width:48px;min-height:48px;justify-content:center}
.y1 svg.st{width:22px;height:22px}
.scroll{flex:1;overflow:auto;padding:12px 14px 40px;scrollbar-width:none;min-height:0;touch-action:pan-y;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.curbuild{background:var(--navy2);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center}
.cicon{width:52px;height:52px;border-radius:15px;background:#2a4866;display:grid;place-items:center;flex:none;overflow:hidden;position:relative}
.cicon .ic{width:32px;height:32px;color:#fff}
.cicon img{width:100%;height:100%;object-fit:contain}
.cname{font-weight:900;font-size:18px}
.bar{height:9px;border-radius:5px;background:rgba(255,255,255,.1);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--prod);border-radius:5px}
.buy{margin-left:auto;min-height:48px;background:var(--yellow);color:var(--yellow-ink);border-radius:14px;padding:0 12px;font-weight:900;font-size:16px;display:flex;align-items:center;gap:5px;box-shadow:0 3px 0 #c9951c;flex:none}
.buy.off{background:rgba(255,255,255,.08);color:var(--ink3);box-shadow:none}
.buy.fai{background:#f3ecd2;color:#4a3f1c;box-shadow:0 3px 0 #b8ad8a}
.h3{font-size:14px;font-weight:800;color:var(--ink3);margin:18px 2px 6px;display:flex;align-items:center;gap:8px}
.h3:first-child{margin-top:4px}
.row{width:100%;display:flex;align-items:center;gap:12px;min-height:66px;padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
.row .cicon{width:46px;height:46px;border-radius:13px}
.row .cicon .ic{width:28px;height:28px}
.row.sel{background:rgba(255,201,60,.08);border-radius:14px;border-bottom-color:transparent}
.row.dim .cicon{opacity:.45}
.rname{font-weight:800;font-size:16.5px;display:flex;align-items:center;gap:5px}
.rname .ic{width:17px;height:17px}
.rsub{font-size:13.5px;font-weight:700;color:var(--ink2);display:flex;gap:8px;margin-top:3px;align-items:center;flex-wrap:wrap}
.rsub span{display:flex;gap:3px;align-items:center}
.rsub svg.st,.rsub .ic{width:15px;height:15px}
.turns{margin-left:auto;font-weight:900;font-size:17px;display:flex;align-items:center;gap:4px;color:#fff;flex:none;text-align:right}
.turns small{font-size:13px;color:var(--ink3);font-weight:700}
.turns.neg{color:#ff8f86}
.acts{display:flex;gap:8px;padding:2px 0 12px;flex-wrap:wrap}
.acts .b{flex:1;min-height:48px;font-size:15px;border-radius:14px;padding:4px 10px;min-width:0}
.acts .b.y{box-shadow:0 3px 0 #c9951c}
.mini{min-width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-weight:900;font-size:20px;flex:none}
.mini .ic{width:20px;height:20px;color:var(--ink2)}
.btabs{display:flex;gap:6px;padding:8px 10px 36px;background:#0f2030;border-top:1px solid var(--line);flex:none}
.btabs button{flex:1;min-height:60px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:800;color:var(--ink3);text-align:center}
.btabs button .ic{width:26px;height:26px}
.btabs button.on{background:rgba(255,255,255,.1);color:#fff}
/* overview: approved .btabs look, but nine tabs, so the rail scrolls sideways like the approved tech era rail */
.rail{display:flex;gap:6px;padding:8px 10px 34px;background:#0f2030;border-top:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:none;width:78px;min-height:60px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;font-weight:800;color:var(--ink3);text-align:center}
.rail button .ic,.rail button svg.st{width:24px;height:24px}
.rail button.on{background:rgba(255,255,255,.1);color:#fff}
.rail button[disabled]{opacity:.3;cursor:default}
.gtabs{display:flex;gap:6px;margin-bottom:10px}
.gtabs button{flex:1;min-height:48px;border-radius:14px;font-size:15px;font-weight:800;color:var(--ink3);background:rgba(255,255,255,.05);text-align:center}
.gtabs button.on{background:#fff;color:var(--navy)}
.fchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 14px 8px;flex:none}
.fchips.wrap{flex-wrap:wrap;padding:0;overflow:visible}
.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:none;min-height:48px;padding:0 13px;border-radius:13px;background:rgba(255,255,255,.06);font-size:14px;font-weight:800;color:var(--ink2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.fchips button .ic,.fchips button svg.st{width:18px;height:18px}
.fchips button.on{background:#fff;color:var(--navy)}
.leadcard{display:flex;gap:14px;align-items:center;background:var(--navy2);border-radius:20px;padding:12px}
.lport{width:112px;height:112px;border-radius:18px;flex:none}
.disc.leader,.lport,.lmini{background-size:cover;background-position:center 20%}
.disc.leader{box-shadow:0 0 0 3px var(--bab),0 5px 0 3px #0b1826,0 9px 18px rgba(0,0,0,.3)}
.lmeta{min-width:0}
.mood{color:var(--gold)}
.lquote{margin-top:8px;font-size:14.5px;font-weight:700;line-height:1.35;color:#fff}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.qb{min-height:76px;border-radius:18px;background:rgba(255,255,255,.09);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:14.5px;font-weight:800}
.dgrid .qb.war{background:rgba(224,82,74,.18);color:#ffb1aa}
.lmini{width:46px;height:46px;border-radius:50%;flex:none}
.col{display:flex;flex-direction:column;align-items:center}
.lbl{font-size:13.5px;font-weight:800;text-align:center;margin-top:9px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap}
.civdisc{position:absolute;left:18px;bottom:46px;z-index:5}
.notes{position:absolute;right:14px;display:flex;flex-direction:column;gap:12px;z-index:4}
.note{position:relative;width:54px;height:54px;border-radius:50%;background:var(--panel);display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.note .ic{width:26px;height:26px}
.stats .stat[data-go]{cursor:pointer}
/* new pieces (proposal) */
.empty{background:var(--navy2);border-radius:20px;padding:18px 16px;display:flex;gap:14px;align-items:center}
.empty .cicon{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.08)}
.etext{font-size:14.5px;font-weight:700;color:var(--ink2);line-height:1.35;margin-top:4px}
.brow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;border-bottom:1px solid var(--line);font-size:16px;font-weight:800;padding:0 4px}
.brow b{font-weight:900}
.brow.tot{border-bottom:0;font-size:17px}
.brow .pos{color:#9ff08a}.brow .neg{color:#ff8f86}
.card2{background:var(--navy2);border-radius:18px;padding:12px 14px;margin-top:10px}
.card2 .brow:last-child{border-bottom:0}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:9px;padding:3px 8px;font-size:12.5px;font-weight:900;background:rgba(255,255,255,.08);color:var(--ink2);white-space:nowrap}
.tag.w{background:rgba(111,208,90,.16);color:#9ff08a}
.tag.g{background:rgba(255,201,60,.15);color:var(--yellow)}
.tag.r{background:rgba(224,82,74,.2);color:#ffb1aa}
.tag.p{background:rgba(154,91,214,.25);color:#e1c6ff}
.tag .ic{width:14px;height:14px}
.tgl{width:56px;height:32px;border-radius:16px;background:rgba(255,255,255,.14);position:relative;flex:none}
.tgl::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.tgl.on{background:var(--yellow)}.tgl.on::after{left:28px}
.stepper{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none;font-weight:900;font-size:16px}
.slider{width:100%;accent-color:var(--yellow);height:48px}
.nic{width:48px;height:48px;border-radius:50%;background:#eef5fb;color:var(--navy);display:grid;place-items:center;position:relative;flex:none;box-shadow:inset 0 -4px 0 #b9cadb}
.nic .ic{width:28px;height:28px}
.nic.port{background-size:cover;background-position:center 20%}
.nic .cat{position:absolute;right:-5px;bottom:-5px;width:26px;height:26px;border-radius:50%;background:#132435;display:grid;place-items:center;box-shadow:0 0 0 2px #122536}
.nic .cat svg.st,.nic .cat .ic{width:15px;height:15px}
.ntx{flex:1;min-width:0;font-size:15.5px;font-weight:700;line-height:1.3;color:var(--ink2)}
.ntx b{color:#fff;font-weight:900}
.go{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:none}
.go .ic{width:18px;height:18px;color:var(--ink2)}
.yarn{display:block;margin:6px auto 0}
/* swipe-to-dismiss annotation (mock-only overlay, not UI) */
.anno{position:absolute;left:8px;right:8px;border:2px dashed var(--yellow);border-radius:18px;pointer-events:none;z-index:3}
.anno span{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);background:var(--yellow);color:var(--yellow-ink);font-size:13px;font-weight:900;border-radius:10px;padding:5px 9px;white-space:nowrap}
.finger{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 6px rgba(255,255,255,.2);z-index:9;pointer-events:none;animation:pull 1.6s ease-in-out infinite}
@keyframes pull{0%{transform:translateY(-40px);opacity:0}20%{opacity:1}80%{transform:translateY(40px);opacity:1}100%{transform:translateY(40px);opacity:0}}
.sheet.snap{transition:transform .25s cubic-bezier(.16,1,.3,1)}
/* tutorial task: sits where the native one does, under the top bar */
.tut{position:absolute;left:10px;right:10px;z-index:6;background:var(--panel);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:20px;padding:12px 6px 12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.35);display:flex;gap:12px;align-items:flex-start}
.tut .ttl{font-size:17px;font-weight:900;line-height:1.25}
.tsteps{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.tsteps div{display:flex;gap:9px;align-items:center;font-size:15px;font-weight:800;color:#fff;line-height:1.25}
.tsteps i{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.12);font-style:normal;font-size:13px;font-weight:900;display:grid;place-items:center;flex:none;color:var(--ink2)}
.tsteps .done{color:var(--ink3);text-decoration:line-through}
.tsteps .done i{background:var(--food);color:#123}
.tsteps .now i{background:var(--yellow);color:var(--yellow-ink)}
.tut .b{min-height:48px;font-size:16px;margin-top:10px}
.tmin{position:absolute;left:10px;z-index:6;width:48px;height:48px;border-radius:50%;background:var(--panel);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.tmin .ic{width:26px;height:26px;color:var(--yellow)}
.ring{position:absolute;border-radius:50%;box-shadow:0 0 0 4px var(--yellow);z-index:6;pointer-events:none;animation:ring 1.4s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 3px var(--yellow),0 0 0 3px rgba(255,201,60,.6)}100%{box-shadow:0 0 0 3px var(--yellow),0 0 0 18px rgba(255,201,60,0)}}
@media (prefers-reduced-motion:reduce){.finger,.ring{animation:none}}
</style>
</head>

  <div class="seg small" id="oseg"></div>

  <div class="thesis" id="thesis"></div>
</div>

/* the approved arc: four discs on radius 182 around the Skip anchor, 200deg to 278deg. No captions until held or focused. */
const arcPos=(w,h,k)=>{ const ax=w-20-48, ay=h-40-48, a=(200+k*26)*Math.PI/180; return [ax+182*Math.cos(a), ay+182*Math.sin(a)] };
function arc(t,w,h){
  const ax=w-20-48, ay=h-40-48;
  const acts=[['FoundCity',t.found,1,t.uses],['Sleep',t.sleep],['Escort',t.escort],['ShowMore',t.more,0,0,'More']];
  const out=acts.map(([i,label,primary,note,go],k)=>{ const [cx,cy]=arcPos(w,h,k);
    return `<button class="abtn" data-act="${label}" ${note?`data-note="${note}"`:''} ${go?`data-to="${go}"`:''} aria-label="${label}${note?', '+note:''}" style="left:${cx}px;top:${cy}px"><div class="disc ${primary?'y':''}">${ic(i)}</div></button>`;
  }).join('');
  return `<div class="arc fade-in">${out}<button class="anchor" style="left:${ax-48}px;top:${ay-48}px">${ic('Skip')}<span class="t">${t.skip}</span><span class="badge">2</span></button></div>`;
}

    <div class="mcard"><div class="mtitle">${name}</div><div class="msub">Babylon</div>
      <div class="mtext"><p>May the gods bless you, great Nebuchadnezzar, ruler of ancient Babylon! Built 5000 years ago, Babylon emerged as an empire in 1800 BC, thanks to godlike Hammurabi, The Giver of Law. Falling under the Kassites assaults then the Assyrian domination, Babylon was reborn from its ashes, gaining back its independance, and became the beacon for Arts and Learning in the ancient world. O Nebuchadnezzar, after your death, Babylon quickly fell, conquered by the mighty Persians, and then by the Greeks, until the great city disappeared forever in 141 BC.</p>
      <p>Great Nebuchadnezzar, Babylon's glory still lives through you and your people. Will you create a spark to enlighten the world again? Will your new empire shine through the ages of history?</p></div>
      <button class="b y" data-v="HUD">${de?'Los geht\'s!':'Let\'s begin!'}</button></div></div>`;
  }
  if(S.v==='Confirm'){
    const base=hudBase(L.EN,w,h)+'<div class="scrim"></div>';
    if(o==='Promise') return base+`<div class="card fade-in"><div class="chead"><div class="cart" style="background-image:url(art/p_Alexander.png)"></div><div class="cq">Do you want to break your promise to Alexander?</div></div>
      <div class="btns"><button class="b red" data-v="HUD">Break promise</button><button class="b g" data-v="HUD">Cancel</button></div></div>`;
    if(o==='Disband') return base+`<div class="card fade-in"><div class="chead"><div class="cart" style="background:var(--bab)"><img src="art/k_settler.png" alt=""></div><div class="cq">Do you really want to disband this unit?</div></div>
      <div class="btns"><button class="b red" data-v="HUD">Disband unit</button><button class="b g" data-v="More">Cancel</button></div></div>`;
    return base+`<div class="card fade-in"><div class="cq">Do you want to exit the game?</div>
      <div class="btns"><button class="b y" data-v="HUD">Exit</button><button class="b g" data-v="HUD">Cancel</button></div></div>`;
  }
  if(S.v==='Gold'){
    if(o==='Too much') gold=Math.max(gold,500); else if(gold>142) gold=120;
    const bad=gold>142;
    return map('plain',w,h)+sbar+`<div class="tsheet"><div style="display:flex;align-items:center;gap:12px"><div class="cart" style="width:48px;height:48px;background-image:url(art/p_Alexander.png)"></div><div class="stitle">Alexander</div></div>

      ${bad?`<div class="err">Invalid input! Please enter a valid number.</div>`:''}
      <div class="steps">${[-500,-50,50,500].map(d=>`<button data-step="${d}">${d>0?'+':'−'}${Math.abs(d)}</button>`).join('')}</div>

      <div class="kb">${[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ']].map(([n,s])=>`<button data-key="${n}">${n}${s?`<small>${s}</small>`:''}</button>`).join('')}<button class="fn"></button><button data-key="0">0</button><button class="fn" data-key="del">⌫</button></div>`;
  }
  if(S.v==='Errors'){
    if(o==='Toast') return hudBase(L.EN,w,h)+arc(L.EN,w,h)+`<div class="toast" style="top:190px"><div class="cart warn">${ic('ExclamationMark')}</div>Not enough memory on phone to load game!</div>`;

      <div class="btns"><button class="b y" data-v="HUD">OK</button></div></div>`;
  }
  if(S.v==='Civ') return civView(w,h);
  if(S.v==='City') return cityView(w,h);
  if(S.v==='Overview') return overView(w,h);
  if(S.v==='Tutorial') return tutView(w,h);
}

const SK={Food:'food',Production:'prod',Gold:'gold',Science:'sci',Culture:'cul',Happiness:'hap',Faith:'fai'};
function ovCities(){
  const s=E_.csort||'Population', dir=E_.cdir||-1;
  const val=c=>s==='Population'?c.pop:s==='Construction'?c.b[1]:s==='We Love The King Day'?(c.wltk?1:0):c[s];
  const L=[...CITIES].sort((a,b)=>{const x=val(a),y=val(b);return (typeof x==='number'?x-y:String(x).localeCompare(String(y)))*dir});

  const [w,h]=SIZES[S.w]; const d=document.getElementById('device'), wrap=document.getElementById('stagewrap');
  const narrow=innerWidth<520; d.classList.toggle('bare',narrow);
  const pad=narrow?0:28; const sc=Math.min((wrap.clientWidth-pad)/w,(wrap.clientHeight-pad)/h,1.25);
  d.style.transform=`scale(${sc})`; d.style.marginTop=narrow?'0':'12px';
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-view]'); if(g){S.v=g.dataset.view;draw();return}
  const op=e.target.closest('[data-opt]'); if(op){S.o[S.v]=op.dataset.opt;if(S.v==='Gold')gold=op.dataset.opt==='Too much'?500:120;draw();return}
  const ww=e.target.closest('[data-w]'); if(ww){S.w=ww.dataset.w;draw();return}
  const sp=e.target.closest('[data-step]'); if(sp){gold=Math.max(0,gold+ +sp.dataset.step);S.o.Gold=gold>142?'Too much':'Typing';draw();return}
  const k=e.target.closest('[data-key]'); if(k){const v=String(gold);gold=k.dataset.key==='del'?(+v.slice(0,-1)||0):Math.min(99999,+(v==='0'?'':v)+k.dataset.key||0);S.o.Gold=gold>142?'Too much':'Typing';draw();return}
  if(dragged){dragged=false;return}
  const X1=(a,fn)=>{const el=e.target.closest('['+a+']'); if(el){fn(el.getAttribute(a));draw();return true}};
  if(X1('data-csel',v=>E_.csel=E_.csel===v?null:v)||X1('data-tsel',v=>E_.tsel=+v)||X1('data-focus',v=>E_.focus=v)||X1('data-tog',v=>E_[v]=v==='cs'?E_.cs===false:!E_[v])||
     X1('data-csort',v=>{E_.cdir=E_.csort===v?-(E_.cdir||-1):-1;E_.csort=v})||X1('data-stat',v=>E_.stat=v)||X1('data-usort',v=>E_.usort=v)||X1('data-usel',v=>E_.usel=E_.usel===+v?null:+v)||
     X1('data-pol',v=>E_.pol=v)||X1('data-rel',v=>E_.rel=v)||X1('data-nturn',v=>{E_.nturn=v;E_.nf='All'})||X1('data-nf',v=>E_.nf=v)) return;
  const go=e.target.closest('[data-go]'); if(go){const[v,o]=go.dataset.go.split('|');S.v=v;S.o[v]=o;draw();return}
  const b=e.target.closest('[data-v]'); if(b){S.v=b.dataset.v;draw();return}
});
document.addEventListener('input',e=>{if(e.target.matches('[data-conv]')){E_.conv=+e.target.value;e.target.previousElementSibling.querySelector('b').textContent=E_.conv+'%';localStorage.setItem('pp1',JSON.stringify(S))}});

/* Swipe to dismiss. Handle, header and tabs drag the sheet at once. Inside the list, the list scrolls;
   the sheet only follows once the list is at its top and the finger keeps pulling down. Past a quarter of the sheet, it closes. */
let drag=null, dragged=false;
function dStart(y,t){ const sh=t.closest('[data-drag]'); if(!sh||t.closest('input')) return; const sc=sh.querySelector('.scroll');
  drag={sh,sc,inList:!!(sc&&sc.contains(t)),y0:y,dy:0,on:false,k:document.getElementById('device').getBoundingClientRect().height/SIZES[S.w][1],base:new DOMMatrix(getComputedStyle(sh).transform).f}; }
function dMove(y){ if(!drag) return false; const d=(y-drag.y0)/drag.k;
  if(!drag.on){ if(Math.abs(d)<6) return false; if(d<0||(drag.inList&&drag.sc.scrollTop>0)){ if(drag.inList) drag=null; return false } drag.on=true; drag.y0=y; drag.sh.classList.remove('snap','fade-in'); return true }
  drag.dy=Math.max(-drag.base,d); drag.sh.style.transform=`translateY(${drag.base+drag.dy}px)`; return true; }
function dEnd(){ if(!drag) return; const {sh,on,dy,base}=drag; drag=null; if(!on) return; dragged=true; setTimeout(()=>dragged=false,50);
  if(base+dy>sh.offsetHeight/4){ sh.classList.add('snap'); sh.style.transform=`translateY(${sh.offsetHeight}px)`; setTimeout(()=>{S.v='Tutorial';S.o.Tutorial='No task';draw()},220) }
  else { sh.classList.add('snap'); sh.style.transform=base?`translateY(${base}px)`:''; } }
addEventListener('touchstart',e=>dStart(e.touches[0].clientY,e.target),{passive:true});
addEventListener('touchmove',e=>{ if(dMove(e.touches[0].clientY)) e.preventDefault() },{passive:false});
addEventListener('touchend',dEnd); addEventListener('touchcancel',dEnd);
addEventListener('mousedown',e=>dStart(e.clientY,e.target)); addEventListener('mousemove',e=>{ if(drag&&e.buttons) dMove(e.clientY) }); addEventListener('mouseup',dEnd);
addEventListener('resize',fit);

/* Arc actions: tap fires, press-and-hold shows one name callout and never fires.
   Release after the callout, moving more than 10px, leaving the disc, or a system cancel all end with no action.
   Keyboard: focusing a disc shows its callout, Enter or Space fires, Escape hides the callout. */
const HOLD_MS=400, SLOP=10;
let press=null;
window.__acts=[];   // mock-only log of fired actions, for verification
function showTip(b){ hideTip(); const scr=document.getElementById('screen'), [w]=SIZES[S.w];
  const t=document.createElement('div'); t.className='tip'; t.id='arctip'; t.setAttribute('role','tooltip');
  t.innerHTML=b.dataset.act+(b.dataset.note?`<div class="tnote">${sk}${b.dataset.note}</div>`:''); scr.appendChild(t);
  const cx=parseFloat(b.style.left), cy=parseFloat(b.style.top), tw=t.offsetWidth, th=t.offsetHeight;
  t.style.left=Math.max(10,Math.min(w-10-tw,cx-tw/2))+'px'; t.style.top=(cy-33-12-th)+'px';   // above the disc, clear of the thumb
  b.setAttribute('aria-describedby','arctip'); }
function hideTip(){ const t=document.getElementById('arctip'); if(t) t.remove(); document.querySelectorAll('[aria-describedby=arctip]').forEach(b=>b.removeAttribute('aria-describedby')); }
function fire(b){ window.__acts.push(b.dataset.act); if(b.dataset.to){ S.v=b.dataset.to; draw(); return }
  b.classList.remove('fired'); void b.offsetWidth; b.classList.add('fired'); }
function endPress(ok){ if(!press) return; const {b,held,timer}=press; press=null; clearTimeout(timer); b.classList.remove('down'); hideTip(); if(ok&&!held) fire(b); }
document.addEventListener('pointerdown',e=>{ const b=e.target.closest('.abtn'); if(!b||press||e.button!==0) return;
  press={b,id:e.pointerId,x:e.clientX,y:e.clientY,held:false,timer:setTimeout(()=>{ if(press&&press.b===b){ press.held=true; showTip(b) } },HOLD_MS)};
  b.classList.add('down'); });
document.addEventListener('pointermove',e=>{ if(press&&e.pointerId===press.id&&Math.hypot(e.clientX-press.x,e.clientY-press.y)>SLOP) endPress(false) });
document.addEventListener('pointerup',e=>{ if(press&&e.pointerId===press.id) endPress(e.target.closest('.abtn')===press.b) });
document.addEventListener('pointercancel',e=>{ if(press&&e.pointerId===press.id) endPress(false) });
document.addEventListener('pointerout',e=>{ if(press&&e.pointerId===press.id&&!press.b.contains(e.relatedTarget)) endPress(false) });
document.addEventListener('contextmenu',e=>{ if(e.target.closest('.abtn')) e.preventDefault() });
// pointer taps are handled above; only keyboard activation (click with detail 0) reaches fire() here
document.addEventListener('click',e=>{ const b=e.target.closest('.abtn'); if(b&&e.detail===0) fire(b) });
document.addEventListener('focusin',e=>{ const b=e.target.closest('.abtn'); if(b&&b.matches(':focus-visible')) showTip(b) });
document.addEventListener('focusout',e=>{ if(e.target.closest('.abtn')&&!press) hideTip() });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&document.getElementById('arctip')) hideTip() });
draw();
</script>
</body>
