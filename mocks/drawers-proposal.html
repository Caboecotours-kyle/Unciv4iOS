<!doctype html>
<!-- Drawer / sheet system redesign. Iterates polish-proposal.html: same palette, hex map, sprite recolor, soft-sphere buttons. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unciv portrait: drawers</title>
<style>
:root{
  --navy:#132435;--navy2:#1c3249;--navy3:#29465d;--panel:rgba(16,31,47,.92);
  --yellow:#ffc93c;--yellow-ink:#3a2a00;--red:#e0483e;
  --gre:#418dfe;--ott:#1f6b35;--food:#6fd05a;--prod:#f08a2c;
  --r:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0b1622;color:#fff;font-family:var(--r);-webkit-font-smoothing:antialiased}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center}
button,select{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:none;padding:0}
button:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

/* Mock chrome (not product UI). */
.chrome{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 14px 6px;flex:none}
.scenes{display:flex;max-width:100%;overflow-x:auto;scrollbar-width:none;background:#16283a;border-radius:14px;padding:3px}
.scenes::-webkit-scrollbar{display:none}
.scenes button{color:#b7cde0;min-height:40px;padding:8px 11px;border-radius:11px;font-size:13.5px;font-weight:900;white-space:nowrap}
.scenes button[aria-selected=true]{background:#fff;color:var(--navy)}
.scenes .sep{width:1px;background:#33495e;margin:8px 4px;flex:none}
.scenes .grp{align-self:center;color:#6f89a0;font-size:11.5px;font-weight:900;padding:0 6px 0 8px;white-space:nowrap}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.tool,.variant{height:40px;background:#1c3249;color:#fff;border-radius:12px;padding:0 13px;font-size:13.5px;font-weight:800}
.tool[aria-pressed=true]{background:#fff;color:var(--navy)}
.tool[hidden]{display:none}
.caption{max-width:1240px;text-align:center;color:#b7cde0;font-size:13.5px;font-weight:700;line-height:1.35;min-height:18px}
.caption b{color:#fff}
.workspace{width:100%;flex:1;display:flex;align-items:flex-start;justify-content:center;gap:26px;padding:10px 12px 28px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}
.thesis{width:calc(393px * var(--scale,1));height:56px;overflow:hidden;text-align:center;font-size:13px;font-weight:800;color:#b7cde0;line-height:1.3;min-height:34px}
.thesis b{display:block;color:#fff;font-size:15px}
.viewport{position:relative;flex:none;width:calc(393px * var(--scale,1));height:calc(852px * var(--scale,1))}
.phone{position:absolute;top:0;left:0;width:393px;height:852px;overflow:hidden;border-radius:54px;background:#e4edf4;transform:scale(var(--scale,1));transform-origin:top left;box-shadow:0 0 0 10px #05090e,0 0 0 11px #2a3b4d,0 30px 60px rgba(0,0,0,.5)}
.screen{position:absolute;inset:0;overflow:hidden}
.phone.bare{border-radius:0;box-shadow:none}
.workspace.narrow{padding:6px 0 24px}
.aside{width:300px;background:#12212f;border-radius:18px;padding:16px 18px;font-size:13.5px;font-weight:700;color:#b7cde0;line-height:1.4;align-self:flex-start}
.aside h3{margin:0 0 8px;color:#fff;font-size:15px}
.aside ol,.aside ul{margin:0;padding-left:20px}
.aside li{margin:0 0 6px}
.aside li b{color:#fff}
.aside[hidden]{display:none}

/* World and HUD behind the sheets. */
.world{position:absolute;inset:0;width:393px;height:852px}
.status-bar{position:absolute;top:0;left:0;right:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:7px 34px 0 42px;font-size:16px;font-weight:800;z-index:9;color:#fff}
.status-right{display:flex;align-items:center;gap:9px}
.signal{display:flex;gap:3px;align-items:end}.signal i{width:4px;background:currentColor;border-radius:2px}
.signal i:nth-child(1){height:6px}.signal i:nth-child(2){height:9px}.signal i:nth-child(3){height:12px}
.battery{width:26px;height:12px;border:1.5px solid currentColor;border-radius:4px;position:relative}
.battery::before{content:"";position:absolute;left:2px;top:2px;bottom:2px;right:5px;border-radius:1px;background:currentColor}
.hud{position:absolute;z-index:3;top:54px;left:10px;right:10px;height:52px;background:var(--panel);border-radius:18px;display:flex;align-items:center;gap:12px;padding:0 12px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.hud .s{display:flex;align-items:center;gap:4px;font-size:16px;font-weight:900}
.hud .s small{font-size:11.5px;color:#b7cde0;font-weight:800}
.hud svg{width:18px;height:18px}
.hud .t{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:900}
.hud .t svg{stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}
.scrim{position:absolute;inset:0;background:rgb(5,12,20);opacity:.35;z-index:6}
.home-ind{position:absolute;left:50%;bottom:8px;width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.88);transform:translateX(-50%);z-index:30}

/* ============ Sheet anatomy (shared structure) ============ */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:8;display:flex;flex-direction:column;overflow:hidden;background:var(--sheet);border-radius:var(--rad) var(--rad) 0 0;color:var(--ink);box-shadow:0 -10px 30px rgba(0,0,0,.28);max-height:calc(100% - 58px)}
.sheet.tall{top:var(--top,60px)}
.grab{flex:none;width:40px;height:5px;border-radius:3px;background:var(--grab);margin:8px auto 0}
.head{flex:none;display:flex;align-items:center;gap:12px;min-height:72px;padding:6px 16px 8px 20px}
.head .lead{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;overflow:hidden}
.head .ttl{min-width:0;flex:1}
.head h2{margin:0;font-size:var(--h,23px);font-weight:900;line-height:1.1;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head p{margin:3px 0 0;color:var(--ink2);font-size:14.5px;font-weight:800}
.x,.backbtn{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--xbg);color:var(--xink)}
.x svg,.backbtn svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.body{flex:1 1 auto;min-height:0;overflow:hidden;padding-bottom:12px}
.sheet:not(.has-foot) .body{padding-bottom:40px}
.foot{flex:none;display:flex;align-items:center;gap:10px;padding:12px 16px 34px;background:var(--footbg)}
.sec{display:flex;align-items:baseline;gap:8px;padding:16px 20px 8px;font-size:var(--sec-size,14.5px);font-weight:900;color:var(--sec)}
.sec span{color:var(--ink2);font-weight:800;font-size:13.5px}
.group{margin:0 var(--gm,0)}
.row{position:relative;width:100%;min-height:64px;display:flex;align-items:center;gap:14px;padding:9px var(--rp,20px);text-align:left;color:var(--ink)}
.row+.row::before{content:"";position:absolute;top:0;right:var(--rp,20px);left:calc(var(--rp,20px) + 58px);height:1px;background:var(--line)}
.row .rt{flex:1;min-width:0}
.row b{display:block;font-size:17px;font-weight:900;line-height:1.15}
.row small{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--ink2);font-size:13.5px;font-weight:800;margin-top:3px}
.row small svg{width:15px;height:15px}
.row .end{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:14.5px;font-weight:900;white-space:nowrap}
.row .chev{width:16px;height:16px;stroke:var(--chev);stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row.dis b{color:var(--ink2)}
.row.dis .disc{opacity:.5}
.row .why{color:#ff9d8f}
.row.sel{background:var(--selbg)}
.row.sel .end .check{width:26px;height:26px;border-radius:50%;background:var(--yellow);display:grid;place-items:center}
.row.sel .end .check svg{width:15px;height:15px;stroke:var(--yellow-ink);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.row.danger b{color:var(--dangerink)}
.disc{flex:none;width:44px;height:44px;border-radius:50%;background:var(--disc);color:#132435;display:grid;place-items:center;overflow:hidden}
.disc svg{width:24px;height:24px}
.disc img{width:40px;height:40px;object-fit:contain}
.disc.yellow{background:var(--yellow)}
.disc.hexd{background:var(--disc2);color:var(--ink)}
.g{stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.gf{fill:currentColor;stroke:none}
.mini{display:inline-flex;align-items:center;gap:4px;font-weight:900;color:var(--ink)}
.mini .md{width:22px;height:22px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 1.5px rgba(19,36,53,.35)}
.mini .md svg{width:14px;height:14px}
.mini>svg{width:16px;height:16px}
.mini .md{color:#132435}.mini .md.or{color:#fff}
.disc .em{width:44px;height:44px}
.mini .md.or{background:#e36a12;color:#fff}
.wonder{color:var(--wonder)}
.pill{height:30px;padding:0 11px;border-radius:15px;display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:900;white-space:nowrap}
.pill svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round}
.pill.lock{background:var(--lockbg);color:var(--lockink)}
.pill.good{background:var(--goodbg);color:var(--goodink)}
.pill.plain{background:var(--fill);color:var(--ink)}
.pill.gold{color:var(--turnink);background:none;padding:0}
/* Switch */
.sw{width:51px;height:31px;border-radius:16px;background:var(--swoff);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.sw.on{background:var(--yellow)}.sw.on::after{left:22px}
/* Stat chips */
.stats{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:8px;padding:4px var(--sp,20px) 4px}
.stat{min-height:48px;border-radius:var(--chiprad,14px);background:var(--chip);display:flex;align-items:center;justify-content:center;gap:6px;font-size:18px;font-weight:900;color:var(--ink);box-shadow:var(--chipsh,none)}
.stat svg{width:21px;height:21px}
.stats.boxes .stat{flex-direction:column;align-items:flex-start;justify-content:center;gap:0;padding:8px 14px;min-height:66px}
.stats.boxes .stat b{font-size:22px}
.stats.boxes .stat span{font-size:13px;color:var(--ink2);font-weight:800}
.stats.strip .stat{flex-direction:column;gap:2px;min-height:58px;font-size:16px}
/* Segmented control and filter chips */
.seg{display:flex;margin:6px var(--sp,20px) 4px;padding:3px;border-radius:var(--segrad,14px);background:var(--segtrack);gap:2px}
.seg button{flex:1;height:42px;border-radius:calc(var(--segrad,14px) - 3px);font-size:15px;font-weight:900;color:var(--ink2)}
.seg button.on{background:var(--segon);color:var(--segonink);box-shadow:var(--segsh,none)}
.chips{display:flex;gap:8px;padding:4px var(--sp,20px);flex-wrap:wrap}
.chipf{height:44px;padding:0 18px;border-radius:22px;background:var(--fill);color:var(--ink2);font-size:15px;font-weight:900;display:flex;align-items:center;gap:6px}
.chipf.on{background:var(--segon);color:var(--segonink);box-shadow:var(--segsh,none)}
/* Buttons */
.btn{height:56px;border-radius:var(--btnrad,18px);font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;white-space:nowrap}
.btn svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:radial-gradient(130% 190% at 28% 0%,#ffe58f 0,#ffc93c 46%,#eaa916 100%);color:var(--yellow-ink);box-shadow:0 4px 12px rgba(7,17,28,.28)}
.btn.secondary{background:var(--secbg);color:var(--secink)}
.btn.danger{background:var(--dangerbg);color:var(--dangerink)}
.btn.grow{flex:1}
.btn[disabled]{opacity:.45}
.btn .badge{min-width:26px;height:26px;border-radius:13px;background:var(--navy);color:#fff;font-size:14px;display:grid;place-items:center;padding:0 7px}
.stack{display:flex;flex-direction:column;gap:10px;padding:8px var(--sp,20px) 4px}
/* Current slot (empty research / production) */
.slot{margin:8px var(--sp,20px) 4px;min-height:64px;border-radius:var(--slotrad,18px);border:2px dashed var(--slotline);display:flex;align-items:center;gap:14px;padding:8px 14px;color:var(--ink2);font-size:16px;font-weight:900}
.slot .ring{width:40px;height:40px;border-radius:50%;border:2px dashed var(--slotline);flex:none;display:grid;place-items:center}
.slot .ring svg{width:18px;height:18px;stroke:var(--ink2);stroke-width:2.6;fill:none;stroke-linecap:round}
.slot small{display:block;font-size:13.5px;font-weight:800;margin-top:2px}
/* Empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:44px 20px 30px;color:var(--ink2);font-size:16px;font-weight:900;text-align:center}
.empty .eico{width:72px;height:72px;border-radius:50%;background:var(--fill);display:grid;place-items:center}
.empty .eico svg{width:32px;height:32px;stroke:var(--ink2);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* Tab bar footer (city) */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;flex:1}
.tabs span{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:16px;font-size:12px;font-weight:900;color:var(--ink2)}
.tabs svg{width:24px;height:24px}
.tabs span.on{background:var(--tabon);color:var(--tabonink)}
/* Pedia */
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:2px var(--sp,20px)}
.card{border-radius:var(--cardrad,18px);background:var(--card);box-shadow:var(--chipsh,none);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;padding:8px 6px 10px;height:118px;text-align:center}
.card img{height:58px;width:64px;object-fit:contain;margin-bottom:auto}
.card .em{margin-bottom:auto;margin-top:4px}
.card b{font-size:15px;font-weight:900;line-height:1.1}
.card span{font-size:12px;font-weight:800;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:2px var(--sp,20px)}
.cat{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 10px;border-radius:var(--cardrad,16px);background:var(--card);box-shadow:var(--chipsh,none)}
.cat .disc{width:40px;height:40px}.cat .disc svg{width:22px;height:22px}
.cat .ct{display:block;font-size:15.5px;font-weight:900;line-height:1.1;color:var(--ink)}
.cat .cn{display:block;font-size:13px;font-weight:800;color:var(--ink2)}
.more{display:block;margin:10px auto 0;height:44px;padding:0 16px;font-size:15px;font-weight:900;color:var(--ink2)}
.search{flex:1;height:52px;border-radius:26px;background:var(--fill);display:flex;align-items:center;gap:10px;padding:0 18px;color:var(--ink2);font-size:16.5px;font-weight:800}
.search svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
/* Unit health */
.hpbar{height:10px;border-radius:5px;background:var(--track);overflow:hidden;margin:6px 20px 0}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#6fd05a,#a6ea6b);border-radius:5px}
.hpcap{display:flex;justify-content:space-between;padding:6px 20px 6px;color:var(--ink2);font-size:13.5px;font-weight:800}
.quote{margin:0 20px 6px;padding:10px 14px;border-radius:16px;background:var(--fill);font-size:15px;font-weight:800;color:var(--ink);display:inline-block}
.note{display:flex;align-items:center;gap:8px;padding:6px 20px;font-size:14px;font-weight:800;color:var(--goodink2)}
.note svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
.hint{padding:6px 20px 0;color:var(--ink2);font-size:14px;font-weight:800}
.tilehero{display:flex;align-items:center;gap:14px;padding:6px 20px 4px}
.tilehero b{font-size:20px;font-weight:900;display:block}
.tilehero .mini{margin-right:8px}
.peek-chev{flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--ink2)}
.peek-chev svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.8;fill:none;stroke-linecap:round}

/* ============ Direction A: Slab ============ */
.dir-a{--sheet:#132435;--rad:28px;--ink:#fff;--ink2:#a9c0d4;--sec:#8fa9bf;--line:rgba(255,255,255,.1);--fill:#1f364d;--disc:#f2f6fa;--disc2:#1f364d;--grab:rgba(255,255,255,.32);
  --xbg:#22394f;--xink:#fff;--chev:#6f89a0;--selbg:rgba(255,201,60,.1);--chip:#1f364d;--segtrack:#0d1b28;--segon:#fff;--segonink:#132435;
  --secbg:#22394f;--secink:#fff;--dangerbg:rgba(224,72,62,.14);--dangerink:#ff8b80;--lockbg:rgba(255,201,60,.14);--lockink:#ffe28b;--goodbg:rgba(111,208,90,.15);--goodink:#aff2a5;--goodink2:#8ff07e;
  --turnink:#ffc93c;--wonder:#ffd35c;--swoff:#3a546d;--slotline:#3b566f;--footbg:#132435;--track:#0b1824;--tabon:transparent;--tabonink:#fff;--card:#1f364d}
.dir-a .foot{box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.dir-a .tabs span.on{position:relative}
.dir-a .tabs span.on::after{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:2px;background:var(--yellow)}
.dir-a .tabs span.on svg{color:var(--yellow)}

/* ============ Direction B: Tray ============ */
.dir-b{--sheet:#0c1925;--rad:24px;--ink:#fff;--ink2:#a2b9cd;--sec:#7f98ae;--line:rgba(255,255,255,.08);--fill:#1a2e43;--disc:#eef4f9;--disc2:#253f58;--grab:rgba(255,255,255,.28);
  --xbg:#1a2e43;--xink:#dce9f4;--chev:#6a8399;--selbg:rgba(255,201,60,.1);--chip:#1a2e43;--segtrack:#1a2e43;--fill:#253f58;--segon:#34506b;--segonink:#fff;
  --secbg:#1a2e43;--secink:#fff;--dangerbg:rgba(224,72,62,.14);--dangerink:#ff8b80;--lockbg:rgba(255,201,60,.14);--lockink:#ffe28b;--goodbg:rgba(111,208,90,.15);--goodink:#aff2a5;--goodink2:#8ff07e;
  --turnink:#ffc93c;--wonder:#ffd35c;--swoff:#324d67;--slotline:#34506b;--footbg:#16293d;--track:#050d15;--tabon:#2b4761;--tabonink:#fff;--card:#1a2e43;
  --gm:12px;--rp:14px;--sp:12px;--chiprad:16px;--cardrad:18px}
.dir-b .group{background:#1a2e43;border-radius:18px;overflow:hidden}
.dir-b .group .row.sel{background:rgba(255,201,60,.1)}
.dir-b .sec{padding:18px 28px 8px;font-size:13.5px}
.dir-b .foot{border-radius:22px 22px 0 0;box-shadow:0 -6px 18px rgba(0,0,0,.35);margin-top:4px}
.dir-b .head,.dir-c .head{padding-left:26px}
.dir-c .sec{padding-left:26px}
.dir-b .hint,.dir-b .note,.dir-b .hpcap{padding-left:28px;padding-right:28px}
.dir-b .hpbar{margin:6px 28px 0}
.dir-b .quote{margin-left:12px}
.dir-b .tilehero{margin:0 12px;padding:12px 14px;background:#1a2e43;border-radius:18px}
.dir-b .stats .stat{background:#1a2e43}

/* ============ Direction C: Paper ============ */
.dir-c{--sheet:#f1f5f9;--rad:30px;--ink:#132435;--ink2:#5b7187;--sec:#132435;--line:rgba(19,36,53,.08);--fill:#e2e9f0;--disc:#e7eef5;--disc2:#e7eef5;--grab:rgba(19,36,53,.22);
  --xbg:#e2e9f0;--xink:#132435;--chev:#8aa0b4;--selbg:#fff6da;--chip:#fff;--segtrack:#e2e9f0;--segon:#fff;--segonink:#132435;--segsh:0 1px 3px rgba(19,36,53,.18);
  --secbg:#132435;--secink:#fff;--dangerbg:#fde6e3;--dangerink:#c42e24;--lockbg:#fff0c2;--lockink:#7a5800;--goodbg:#dff5d9;--goodink:#2d7a1f;--goodink2:#2d7a1f;
  --turnink:#b07800;--wonder:#b07800;--swoff:#cdd8e2;--slotline:#b9c8d6;--footbg:#fff;--track:#dce5ed;--tabon:#132435;--tabonink:#fff;--card:#fff;

const dist=(a,b)=>{const [q,r]=cube(...a),[s,t]=cube(...b);return Math.max(Math.abs(q-s),Math.abs(r-t),Math.abs(q-s+r-t))};
const NB=[[1,-1],[1,0],[0,1],[-1,1],[-1,0],[0,-1]];
const nbr=(c,r,i)=>{const [q,rr]=cube(c,r),[dq,dr]=NB[i];const nr=rr+dr;return [q+dq+(nr-(nr&1))/2,nr]};
function terrain(c,r){

  if(c===5&&r===2||c===-1&&r===5)return 'mountain';
  if(c===2&&r===3||c===3&&r===4)return 'desert';
  if((c+r*2)%7===1||c===4&&r===5)return 'plains';
  if(c>=5&&r<=5)return 'desert';
  return 'grass';
}
function slab(c,r){
  const [x,y]=center(c,r),cs=corners(x,y),[lit,shade,side]=TERRA[terrain(c,r)],low=p=>[p[0],p[1]+4];

}

const DECO={'3,5':['f_forest1',-23,-34,46,46],'5,7':['f_forest2',-20,-31,42,42],'0,6':['f_forest1',-23,-34,46,46],'4,9':['f_forest2',-20,-31,42,42],'1,5':['f_hill1',-24,-26,48,40],'2,3':['f_hill1',-24,-26,48,40],'5,2':['f_mountain1',-25,-34,50,50],'-1,5':['f_mountain1',-25,-34,50,50],'4,4':['f_forest2',-20,-31,42,42],'1,1':['f_jungle1',-22,-32,44,44]};
const RES={'2,3':['r_Sheep',6,-12,24,24],'3,6':['r_Stone',-12,-14,26,26],'1,1':['r_Bananas',6,-10,22,22]};
function tileArt(c,r){const k=`${c},${r}`,[x,y]=center(c,r);let s='';if(DECO[k]){const [h,dx,dy,w,hh]=DECO[k];s+=art(h,x+dx,y+dy,w,hh)}if(RES[k]){const [h,dx,dy,w,hh]=RES[k];s+=art(h,x+dx,y+dy,w,hh)}return s}
function borderPath(cc,cr,rad=1){
  const own=(c,r)=>dist([c,r],[cc,cr])<=rad,out=[];
  for(let r=cr-rad-1;r<=cr+rad+1;r++)for(let c=cc-rad-1;c<=cc+rad+1;c++){if(!own(c,r))continue;const cs=corners(...center(c,r),.99);
    NB.forEach((_,i)=>{if(!own(...nbr(c,r,i)))out.push(`M${cs[i][0].toFixed(1)} ${cs[i][1].toFixed(1)}L${cs[(i+1)%6][0].toFixed(1)} ${cs[(i+1)%6][1].toFixed(1)}`)})}
  return out.join('');
}
function tint(cc,cr,rad=1){let s='';for(let r=cr-rad;r<=cr+rad;r++)for(let c=cc-rad-1;c<=cc+rad+1;c++)if(dist([c,r],[cc,cr])<=rad)s+=`<polygon points="${pts(corners(...center(c,r),.97))}" fill="rgba(65,141,254,.13)"/>`;return s}
const sprites={};
const loadImage=src=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=src});
async function prep(name,col=[65,141,254]){
  const im=await loadImage(`art/${name}.png`),cv=document.createElement('canvas');cv.width=im.width;cv.height=im.height;
  const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0);const raw=ctx.getImageData(0,0,cv.width,cv.height).data;
  let x0=cv.width,y0=cv.height,x1=0,y1=0;
  for(let y=0;y<cv.height;y+=2)for(let x=0;x<cv.width;x+=2)if(raw[(y*cv.width+x)*4+3]>24){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}
  const w=x1-x0+1,h=y1-y0+1,out=ctx.createImageData(w,h),d=out.data;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const s=((y+y0)*cv.width+x+x0)*4,o=(y*w+x)*4;let r=raw[s],g=raw[s+1],b=raw[s+2];
    if(g>60&&g>r*1.45&&g>b*1.45){const f=Math.min(1.15,g/255*1.08);r=col[0]*f;g=col[1]*f;b=col[2]*f}d[o]=r;d[o+1]=g;d[o+2]=b;d[o+3]=raw[s+3]}
  const c2=document.createElement('canvas');c2.width=w;c2.height=h;c2.getContext('2d').putImageData(out,0,0);sprites[name]={src:c2.toDataURL(),ratio:w/h};
}
const spr=n=>sprites[n]?.src||`art/${n}.png`;
function unitOn(name,c,r,h=50){const [x,y]=center(c,r),w=Math.round(h*(sprites[name]?.ratio||.8));return `<ellipse cx="${x}" cy="${y+2}" rx="14" ry="5" fill="rgba(0,0,0,.25)"/><ellipse cx="${x}" cy="${y+1}" rx="13" ry="4.8" fill="none" stroke="#418dfe" stroke-width="2.6"/><image href="${spr(name)}" x="${x-w/2}" y="${y-h}" width="${w}" height="${h}"/>`}
function world(extra='',cam='',hideOver=0){
  const t=[],d=[];
  for(let r=-1;r<=16;r++)for(let c=-1;c<=6;c++){const [x,y]=center(c,r);if(x<-70||x>455||y<-65||y>900)continue;t.push(slab(c,r));d.push(tileArt(c,r))}
  return `<svg class="world" viewBox="0 0 393 852"><g transform="${cam}"><rect x="-200" y="-200" width="800" height="1250" fill="#e4edf4"/>${t.join('')}${d.join('')}${extra}</g></svg>`;
}

      <div class="hpbar"><i style="width:100%"></i></div><div class="hpcap"><span>Health</span><span>100 / 100</span></div>
      ${stats(['<b>0</b><span>Strength</span>','<b>2/2</b><span>Movement</span>','<b>0/10</b><span>XP</span>'],'boxes')}
      ${group([row({disc:`<span class="disc">${sv('shieldS').replace('<svg','<svg style="fill:#dfe8f0;stroke:#132435;stroke-width:2"')}</span>`,title:'Promotions',meta:'Available at 10 XP'}),
        row({disc:`<span class="disc" style="background:#88cd50"><img src="art/f_hill1.png" alt=""></span>`,title:'On Grassland, Hill',meta:`<span class="mini">${sv('shieldS').replace('<svg','<svg style="fill:none;stroke:currentColor;stroke-width:2.4"')}+25% defense</span>`})])}</div>`)}},
  motion:{grp:'Motion',label:'Motion',caption:'Open, swipe down, and the city peek. Use the buttons above; the tile sheet opens on load.',
    bg:()=>mapBg('k_settler',2,5),motion:true,html(){return `<div class="scrim" style="opacity:0"></div>`+SCENES.tile.html().replace('role="dialog"','role="dialog" id="msheet" style="transform:translateY(110%)"')+`<div class="finger"></div>`}}
};
const LEGEND=['Grab handle, 40x5, same on every sheet','Header: lead, title, optional subtitle, close. 72pt tall','Stat chips','Segmented control','Section label','List row: disc, title, meta, trailing value, chevron','Selectable row','Disabled row with the reason in red','Toggle row','Filter chips','Primary: yellow soft sphere, 56pt','Secondary','Destructive','Footer action bar, runs under the home bar','Empty state'];

/* ---------- Motion ---------- */
/* Spring: response 0.42s, damping 0.82 (iOS-style parameters). */
const SPR={w:2*Math.PI/.42,z:.82};SPR.wd=SPR.w*Math.sqrt(1-SPR.z*SPR.z);
const springAt=t=>t>=.6?1:1-Math.exp(-SPR.z*SPR.w*t)*(Math.cos(SPR.wd*t)+SPR.z*SPR.w/SPR.wd*Math.sin(SPR.wd*t));
const easeIn=p=>p*p*p,easeOut=p=>1-Math.pow(1-p,3),easeIO=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,seg2=(p,a,b)=>Math.min(1,Math.max(0,(p-a)/(b-a)));
let motionRAF=0;
function play(dur,step){cancelAnimationFrame(motionRAF);const t0=performance.now();const f=now=>{const ms=Math.min(dur,now-t0);step(ms/dur,ms);if(ms<dur)motionRAF=requestAnimationFrame(f)};motionRAF=requestAnimationFrame(f)}
const MOTION_NOTES=`<h3>Motion spec</h3><ul>
<li><b>Open:</b> rises from the bottom edge on a spring (response 0.42s, damping 0.82: settles, no visible bounce). Scrim fades 0 to 35% over 240ms, starting together.</li>
<li><b>Close:</b> X, scrim tap, or swipe. 200ms ease-in down past the edge; scrim fades with it.</li>
<li><b>Swipe down:</b> the sheet tracks the finger 1:1 from the handle or header (from the body only when it is scrolled to the top). Release past 72pt or faster than 800pt/s closes; otherwise it springs back. Scrim thins as the sheet drops.</li>
<li><b>City sheet:</b> the only snap point. Full height or a 64pt peek (header only, map free). Swipe down collapses, swipe up or tap the header expands, X leaves the city.</li>
<li><b>Everything else:</b> no detents. Sheets hug their content up to the status bar.</li>
<li><b>Reduce Motion:</b> 150ms crossfade, no rise.</li></ul>`;
const parts=()=>[...document.querySelectorAll('.screen')].map(sc=>({sc,s:sc.querySelector('#msheet'),scrim:sc.querySelector('.scrim'),f:sc.querySelector('.finger')})).filter(o=>o.s);
function motionRun(kind){
  const P=parts();
  if(kind==='open')play(600,(p,ms)=>P.forEach(({s,scrim})=>{s.style.transform=`translateY(${((1-springAt(ms/1000))*100).toFixed(2)}%)`;scrim.style.opacity=(.35*Math.min(1,ms/240)).toFixed(3)}));
  if(kind==='swipe')play(1600,p=>P.forEach(({s,scrim,f})=>{
    const h=s.offsetHeight,top=852-h,drag=110*easeIO(seg2(p,.25,.65)),rel=easeIn(seg2(p,.65,.78)),y=drag+(h+10-drag)*rel;
    s.style.transform=`translateY(${y.toFixed(1)}px)`;scrim.style.opacity=(.35*Math.max(0,1-y/h)).toFixed(3);
    f.style.left='196px';f.style.top=`${top+14+drag}px`;f.style.opacity=p<.12?0:p<.25?(p-.12)/.13:p<.65?1:Math.max(0,1-(p-.65)/.08);}));
}
function peekRun(){
  document.querySelectorAll('.screen').forEach(sc=>{
    sc.innerHTML=cityBg()+SCENES.cityBuild.html().replace('role="dialog"','role="dialog" id="csheet"')+'<div class="finger"></div><div class="home-ind"></div>';
    sc.querySelector('.head .x').insertAdjacentHTML('beforebegin',`<span class="peek-chev">${sv('up')}</span>`);
  });
  const P=[...document.querySelectorAll('.screen')].map(sc=>({s:sc.querySelector('#csheet'),b:sc.querySelector('#csheet .body'),ft:sc.querySelector('#csheet .foot'),c:sc.querySelector('.peek-chev'),f:sc.querySelector('.finger')}));
  const dy=(852-238)-(13+72+34);
  play(1600,p=>P.forEach(({s,b,ft,c,f})=>{
    const drag=dy*.5*easeIO(seg2(p,.2,.55)),y=drag+(dy-drag)*easeOut(seg2(p,.55,.75)),k=y/dy;
    s.style.transform=`translateY(${y.toFixed(1)}px)`;b.style.opacity=ft.style.opacity=(1-k).toFixed(3);c.style.opacity=k.toFixed(3);
    f.style.left='196px';f.style.top=`${252+drag}px`;f.style.opacity=p<.08?0:p<.2?(p-.08)/.12:p<.55?1:Math.max(0,1-(p-.55)/.08);}));
}

/* ---------- Render ---------- */
const state={scene:'parts',variant:'a',compare:innerWidth>=1240,labels:true};
const ORDER=Object.keys(SCENES);
function buildTabs(){
  let html='',last='';
  for(const k of ORDER){const s=SCENES[k];if(s.grp!==last){if(last)html+='<span class="sep"></span>';html+=`<span class="grp">${s.grp}</span>`;last=s.grp}
    html+=`<button type="button" role="tab" data-scene="${k}">${s.label}</button>`}
  document.getElementById('scenes').innerHTML=html;
}
function placePins(sc){
  sc.querySelectorAll('.pin,.edge-tag').forEach(p=>p.remove());
  if(!state.labels||SCENES[state.scene].grp!=='System')return;
  const box=sc.getBoundingClientRect(),k=box.width/393;
  sc.querySelectorAll('[data-pin]').forEach(el=>{const r=el.getBoundingClientRect();if(!r.height)return;
    const p=document.createElement('span');p.className='pin';p.textContent=el.dataset.pin;
    const n=+el.dataset.pin,x=n===1?(r.right-box.left)/k+6:Math.max(1,(r.left-box.left)/k-9),y=(r.top-box.top)/k+(n===1?-6:n===2?4:r.height/k/2-9);
    p.style.left=x+'px';p.style.top=y+'px';sc.appendChild(p)});
  const t=document.createElement('span');t.className='edge-tag';t.textContent='16  square edge, fill under home bar';sc.appendChild(t);
}
function render(){
  const S=SCENES[state.scene],ws=document.getElementById('workspace');
  const dirs=state.compare?['a','b','c']:[state.variant];
  ws.innerHTML=dirs.map(v=>`<div class="col"><div class="thesis"><b>${DIRS[v].name}</b>${DIRS[v].thesis}</div><div class="viewport"><div class="phone dir-${v}"><div class="screen">${S.bg()}${S.scrim?'<div class="scrim"></div>':''}${S.html()}<div class="home-ind"></div></div></div></div></div>`).join('')
    +(S.grp==='System'&&state.labels?`<aside class="aside"><h3>Anatomy</h3><ol>${LEGEND.map(l=>`<li>${l}</li>`).join('')}<li>Square bottom edge; the sheet color fills behind the home indicator</li></ol></aside>`:'')
    +(S.motion?`<aside class="aside">${MOTION_NOTES}</aside>`:'');
  document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.scene===state.scene)));
  document.getElementById('caption').innerHTML=S.caption;
  document.getElementById('variant').value=state.variant;document.getElementById('variant').disabled=state.compare;
  document.getElementById('compare').setAttribute('aria-pressed',String(state.compare));
  document.getElementById('labels').setAttribute('aria-pressed',String(state.labels));
  document.getElementById('labels').hidden=S.grp!=='System';
  ['m-open','m-swipe','m-peek'].forEach(id=>document.getElementById(id).hidden=!S.motion);
  fit();
  requestAnimationFrame(()=>{document.querySelectorAll('.screen').forEach(placePins);if(S.motion){const act=new URLSearchParams(location.search).get('act');setTimeout(()=>act==='peek'?peekRun():act==='swipe'?motionRun('swipe'):motionRun('open'),250)}});
  history.replaceState(null,'',`?scene=${state.scene}&v=${state.variant}${state.compare?'&cmp=1':''}${S.motion&&q.get('act')?'&act='+q.get('act'):''}`);
}
function fit(){
  const ch=document.querySelector('.chrome'),n=state.compare?3:1,aside=document.querySelector('.aside')?1:0;
  const h=Math.max(360,innerHeight-ch.getBoundingClientRect().height-90);
  const w=innerWidth-40-(n-1)*26-(aside&&innerWidth>=900?326:0);
  const narrow=innerWidth<450&&n===1,s=narrow?Math.min(1,innerWidth/393):Math.min(1,h/852,w/n/393);document.querySelectorAll('.col').forEach(c=>c.style.setProperty('--scale',s.toFixed(4)));
  document.querySelectorAll('.phone').forEach(p=>p.classList.toggle('bare',narrow));document.getElementById('workspace').classList.toggle('narrow',narrow);
}
document.getElementById('scenes').addEventListener('click',e=>{const b=e.target.closest('[data-scene]');if(!b)return;state.scene=b.dataset.scene;render()});
document.getElementById('variant').addEventListener('change',e=>{state.variant=e.target.value;render()});
document.getElementById('compare').addEventListener('click',()=>{state.compare=!state.compare;render()});
document.getElementById('labels').addEventListener('click',()=>{state.labels=!state.labels;render()});
document.getElementById('m-open').addEventListener('click',()=>{render()});
document.getElementById('m-swipe').addEventListener('click',()=>motionRun('swipe'));
document.getElementById('m-peek').addEventListener('click',peekRun);
addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='l'||e.key==='L'){state.labels=!state.labels;render()}
  if(['1','2','3'].includes(e.key)){state.variant='abc'[+e.key-1];state.compare=false;render()}});
addEventListener('resize',()=>{fit();document.querySelectorAll('.screen').forEach(placePins)});
const q=new URLSearchParams(location.search);
if(SCENES[q.get('scene')])state.scene=q.get('scene');if(DIRS[q.get('v')])state.variant=q.get('v');if(q.has('cmp'))state.compare=q.get('cmp')==='1';if(q.get('labels')==='0')state.labels=false;
buildTabs();
Promise.allSettled(['k_warrior','k_settler','k_hoplite','k_companion cavalry','c_Ancient_medium'].map(n=>prep(n))).then(()=>render());
</script>
</body>
</html>
