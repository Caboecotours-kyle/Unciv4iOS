<!doctype html>
<!--
THESIS: Trade, notifications and the Civilopedia for the portrait one-handed fork, in the approved thumb-arc system.
DATA: Gods & Kings ruleset (Units, Buildings, Techs, TileResources, Terrains, TileImprovements, Nations, Policies, Beliefs, Religions).
  Trade items follow core TradeLogic.getAvailableOffers; Alexander's valuation follows TradeEvaluation and TradeAutomation.getCounteroffer.
  Notification strings and categories are Unciv's own. Game state: Babylon, turn 58.
MOCK STATE (not in the brief): Greece holds 188 gold, +6 per turn, Silver x2, Marble x1; Akkad has 1 built building; history turn numbers.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unciv Portrait: trade, notifications, civilopedia</title>
<style>
:root{
  --navy:#132435; --navy2:#1c3249; --panel:rgba(16,31,47,.9); --line:rgba(255,255,255,.12);
  --ink:#fff; --ink2:#b7cde0; --ink3:#7f9ab2;
  --yellow:#ffc93c; --yellow-ink:#3a2a00;
  --bab:#2f7fe0; --gre:#e0524a; --kab:#9a5bd6;
  --food:#6fd05a; --prod:#ff9a3c; --gold:#ffc93c; --sci:#5cc8ff; --cul:#d38bff; --fai:#f3ecd2; --hap:#b8e35a;
  --r:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b1622;color:var(--ink);font-family:var(--r);-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;align-items:center;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* canvas chrome */
.chrome{width:100%;display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;align-items:center;padding:10px 10px 8px;flex:none}
.seg{display:flex;background:#16283a;border-radius:14px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{min-height:40px;padding:8px 13px;border-radius:11px;font-weight:800;font-size:15px;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed=true]{background:#fff;color:var(--navy)}
.thesis{width:100%;text-align:center;font-size:13px;color:var(--ink2);font-weight:600;min-height:18px;padding:0 8px}
.stagewrap{flex:1;width:100%;display:flex;align-items:flex-start;justify-content:center;min-height:0;overflow:hidden}
.device{width:393px;height:852px;position:relative;transform-origin:top center;border-radius:54px;overflow:hidden;flex:none;
  box-shadow:0 0 0 10px #05090e,0 0 0 11px #2a3b4d,0 30px 60px rgba(0,0,0,.5);background:#e4edf4}
.device.bare{border-radius:0;box-shadow:none}

/* phone content */
.screen{position:absolute;inset:0;overflow:hidden}
.map{position:absolute;inset:0;transform-origin:196px 470px;transition:transform .12s ease-out}
.map svg{position:absolute;left:-260px;top:-320px;display:block}
.sbar{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 42px;font-weight:700;font-size:16px;z-index:5}
.sbar .bat{width:26px;height:12px;border:1.5px solid #fff;border-radius:4px;position:relative}
.sbar .bat::after{content:"";position:absolute;inset:1.5px;right:5px;background:#fff;border-radius:1.5px}
.scrim-t{position:absolute;top:0;left:0;right:0;height:130px;background:linear-gradient(rgba(10,22,34,.62),rgba(10,22,34,0));z-index:3;pointer-events:none}
.scrim-b{position:absolute;bottom:0;left:0;right:0;height:250px;background:linear-gradient(to top,rgba(10,22,34,.66),rgba(10,22,34,0));z-index:3;pointer-events:none}

/* icons */
.ic{display:inline-block;width:22px;height:22px;background:currentColor;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;flex:none}
svg.st{width:18px;height:18px;flex:none}

/* stat strip */
.stats{position:absolute;top:54px;left:10px;right:10px;height:50px;background:var(--panel);border-radius:16px;display:flex;align-items:center;padding:0 5px 0 8px;z-index:4;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;font-size:16.5px;padding:0 5px;height:44px;white-space:nowrap}
.stat small{font-size:12.5px;font-weight:700;color:var(--ink2)}
.stats .turn{margin-left:auto;height:40px;background:rgba(255,255,255,.1);border-radius:12px;padding:0 10px;font-size:15px;font-weight:900;display:flex;align-items:center;gap:6px}
.stats .turn .ic{width:16px;height:16px;color:var(--ink2)}

/* discs */
.disc{width:66px;height:66px;border-radius:50%;background:#eef5fb;color:var(--navy);display:grid;place-items:center;box-shadow:0 5px 0 #b9cadb,0 9px 18px rgba(0,0,0,.25);position:relative;flex:none}
.disc .ic{width:32px;height:32px}
.disc.y{background:var(--yellow);color:var(--yellow-ink);box-shadow:0 5px 0 #c9951c,0 9px 18px rgba(0,0,0,.25)}
.disc.navy{background:var(--navy2);color:#fff;box-shadow:0 5px 0 #0b1826,0 9px 18px rgba(0,0,0,.3)}
.lbl{font-size:13.5px;font-weight:800;text-align:center;margin-top:9px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap}
.badge{position:absolute;top:-5px;right:-5px;min-width:24px;height:24px;border-radius:12px;background:var(--gre);color:#fff;font-size:13px;font-weight:900;display:grid;place-items:center;padding:0 6px;box-shadow:0 0 0 2.5px var(--navy)}
.col{display:flex;flex-direction:column;align-items:center}

/* zoom rail */
.zoom{position:absolute;left:10px;z-index:5;width:56px;background:var(--panel);border-radius:28px;display:flex;flex-direction:column;align-items:center;padding:4px 0;box-shadow:0 6px 18px rgba(0,0,0,.3);touch-action:none;user-select:none;-webkit-user-select:none}
.zb{width:48px;height:48px;border-radius:50%;font-size:28px;font-weight:900;line-height:1;display:grid;place-items:center;color:#fff}
.zb:active{background:rgba(255,255,255,.12)}
.ztrack{position:relative;width:48px;height:150px;cursor:grab}
.ztrack::before{content:"";position:absolute;left:50%;top:10px;bottom:10px;width:6px;margin-left:-3px;border-radius:3px;background:rgba(255,255,255,.14)}
.zfill{position:absolute;left:50%;bottom:10px;width:6px;margin-left:-3px;border-radius:3px;background:var(--sci)}
.zknob{position:absolute;left:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:#fff;box-shadow:0 3px 0 #b9cadb,0 4px 10px rgba(0,0,0,.35)}
.zval{font-size:12px;font-weight:900;color:var(--ink2);padding:2px 0 4px}
.zrail{display:flex;flex-direction:column;align-items:center;animation:zin .22s cubic-bezier(.16,1,.3,1)}
@keyframes zin{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.ztoggle{width:56px;height:56px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#fff;font-size:11.5px;font-weight:900}
.ztoggle .ic{width:22px;height:22px}
.zoom:not(.open) .zrail,.zoom.open .ztoggle{display:none}
.zoom:not(.open){padding:0}

/* dock A */
.dock{position:absolute;left:0;right:0;bottom:0;padding:0 14px 40px;display:flex;align-items:flex-end;gap:14px;z-index:4}
.turnbtn{margin-left:auto;height:74px;padding:0 18px 0 24px;border-radius:37px;background:var(--yellow);color:var(--yellow-ink);display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;white-space:nowrap;box-shadow:0 5px 0 #c9951c,0 10px 20px rgba(0,0,0,.3);margin-bottom:24px}
.turnbtn .n{background:var(--yellow-ink);color:var(--yellow);border-radius:12px;font-size:15px;padding:3px 9px}
.notes{position:absolute;right:14px;display:flex;flex-direction:column;gap:12px;z-index:4}
.note{position:relative;width:54px;height:54px;border-radius:50%;background:var(--panel);display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.note .ic{width:26px;height:26px}

/* panels & sheets */
.panel{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-radius:26px 26px 0 0;z-index:6;box-shadow:0 -8px 24px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.grab{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:8px auto 0;flex:none}
.unithead{display:flex;align-items:center;gap:14px;padding:16px 18px 0}
.uport{width:58px;height:58px;border-radius:50%;background:var(--bab);display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);flex:none}
.uport .ic{width:34px;height:34px;color:#fff}
.uname{font-size:21px;font-weight:900}
.uline{display:flex;gap:12px;margin-top:4px;font-size:15px;font-weight:800;color:var(--ink2)}
.uline span{display:flex;align-items:center;gap:4px}
.hp{margin-left:auto;align-self:flex-start;font-size:14px;font-weight:900;background:rgba(111,208,90,.18);color:#9ff08a;border-radius:9px;padding:5px 9px}
.actions{display:flex;justify-content:space-between;padding:18px 12px 40px}
.act{display:flex;flex-direction:column;align-items:center;width:72px}
.act .lbl{text-shadow:none;color:var(--ink2);font-weight:800}
.act.primary .lbl{color:#fff}

.sheet{position:absolute;left:0;right:0;bottom:0;background:#122536;border-radius:28px 28px 0 0;z-index:6;box-shadow:0 -10px 30px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden}
.sh-head{display:flex;align-items:center;gap:12px;padding:10px 16px 6px;flex:none}
.pop{width:48px;height:48px;border-radius:50%;background:var(--bab);display:grid;place-items:center;font-weight:900;font-size:21px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);flex:none}
.sh-title{font-size:23px;font-weight:900;display:flex;align-items:center;gap:6px}
.sh-sub{font-size:14px;font-weight:700;color:var(--ink2);margin-top:1px}
.x{margin-left:auto;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.09);display:grid;place-items:center;flex:none}
.x .ic{width:18px;height:18px;color:var(--ink2)}
.yields{display:flex;justify-content:space-between;padding:8px 16px 12px;flex:none}
.y1{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;font-size:16px;min-width:48px;min-height:48px;justify-content:center}
.y1 svg.st{width:22px;height:22px}
.tabs{display:flex;padding:0 8px;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;min-height:52px;font-weight:800;font-size:16px;color:var(--ink3);position:relative}
.tabs button.on{color:#fff}
.tabs button.on::after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:3px;border-radius:2px;background:var(--yellow)}
.scroll{flex:1;overflow:auto;padding:12px 14px 40px;scrollbar-width:none;min-height:0}
.scroll::-webkit-scrollbar{display:none}
.curbuild{background:var(--navy2);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center}
.cicon{width:52px;height:52px;border-radius:15px;background:#2a4866;display:grid;place-items:center;flex:none}
.cicon .ic{width:32px;height:32px;color:#fff}
.cname{font-weight:900;font-size:18px}
.bar{height:9px;border-radius:5px;background:rgba(255,255,255,.1);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--prod);border-radius:5px}
.buy{margin-left:auto;min-height:48px;background:var(--yellow);color:var(--yellow-ink);border-radius:14px;padding:0 12px;font-weight:900;font-size:16px;display:flex;align-items:center;gap:5px;box-shadow:0 3px 0 #c9951c;flex:none}
.h3{font-size:14px;font-weight:800;color:var(--ink3);margin:18px 2px 6px}
.row{display:flex;align-items:center;gap:12px;min-height:66px;padding:8px 4px;border-bottom:1px solid var(--line)}
.row .cicon{width:46px;height:46px;border-radius:13px}
.row .cicon .ic{width:28px;height:28px}
.rname{font-weight:800;font-size:16.5px}
.rsub{font-size:13.5px;font-weight:700;color:var(--ink2);display:flex;gap:8px;margin-top:3px;align-items:center;flex-wrap:wrap}
.rsub span{display:flex;gap:3px;align-items:center}
.rsub svg.st{width:15px;height:15px}
.turns{margin-left:auto;font-weight:900;font-size:17px;display:flex;align-items:center;gap:4px;color:#fff;flex:none}
.turns small{font-size:13px;color:var(--ink3);font-weight:700}
.wonder .cicon{background:#5a3f13}
.wonder .cicon .ic{color:var(--yellow)}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border-radius:12px;padding:6px 10px 6px 7px;font-size:13.5px;font-weight:800;white-space:nowrap}
.chip .ic{width:20px;height:20px}
.chip.w{background:rgba(255,201,60,.15);color:var(--yellow)}
.big{min-height:60px;border-radius:18px;background:var(--yellow);color:var(--yellow-ink);font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 0 #c9951c;width:100%}
.ghost{min-height:54px;border-radius:16px;background:rgba(255,255,255,.08);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}

/* tech tree */
.tt{position:relative;flex:1;min-height:0}
.ttscroll{position:absolute;inset:0;overflow:auto;scrollbar-width:none;overscroll-behavior:contain}
.ttscroll::-webkit-scrollbar{display:none}
.canvas{position:relative;width:393px;margin:0 auto}
.band{position:relative;border-top:1px solid rgba(255,255,255,.06)}
.band.odd{background:rgba(255,255,255,.028)}
.band h4{position:sticky;left:0;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;font-size:15px;font-weight:900;color:var(--ink2);white-space:nowrap}
.band h4 small{font-size:12.5px;color:var(--ink3);font-weight:800}
.links{position:absolute;left:0;top:0;pointer-events:none}
.tn{position:absolute;width:92px;margin-left:-46px;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.tn .d{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;position:relative;transition:box-shadow .15s}
.tn .d .ic{width:38px;height:38px}
.tn .nm{font-size:13px;font-weight:800;line-height:1.15;max-width:92px;text-shadow:0 0 3px #122536,0 0 3px #122536,0 0 6px #122536}
.tn.done .d{background:var(--bab);color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2)}
.tn.done .nm{color:var(--ink2)}
.tn.now .d{background:#fff;color:var(--navy);box-shadow:0 0 0 5px var(--yellow)}
.tn.av .d{background:#eef5fb;color:var(--navy);box-shadow:inset 0 -5px 0 #b9cadb}
.tn.lock .d{background:#1f3850;color:#6f8ba4}
.tn.lock .nm{color:var(--ink3)}
.tn.onpath .d{box-shadow:0 0 0 4px var(--yellow)}
.tn.onpath .nm{color:#fff}
.tn.sel .d{box-shadow:0 0 0 5px #fff,0 0 0 11px rgba(255,201,60,.55)}
.tn .t{position:absolute;bottom:-5px;right:-8px;background:var(--navy);color:#fff;font-size:12px;font-weight:900;border-radius:9px;padding:2px 7px;box-shadow:0 0 0 2px #122536}
.tn .q{position:absolute;top:-6px;left:-6px;width:26px;height:26px;border-radius:50%;background:var(--yellow);color:var(--yellow-ink);font-size:13.5px;font-weight:900;display:grid;place-items:center;box-shadow:0 0 0 2.5px #122536}
.tfoot{flex:none;background:var(--navy2);border-radius:22px 22px 0 0;padding:12px 16px 14px;display:flex;flex-direction:column;gap:11px;box-shadow:0 -8px 24px rgba(0,0,0,.3);position:relative;z-index:2}
.tf1{display:flex;align-items:center;gap:12px}
.tf1 .d{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;flex:none}
.tf1 .d .ic{width:32px;height:32px}
.hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.hscroll::-webkit-scrollbar{display:none}
.pathline{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:800;color:var(--ink2)}
.pathline .pi{display:flex;align-items:center;gap:5px;color:#fff;white-space:nowrap}
.pathline .pi i.n{width:22px;height:22px;border-radius:50%;background:var(--yellow);color:var(--yellow-ink);font-style:normal;font-size:12px;display:grid;place-items:center}
.pathline .arrow{color:var(--ink3)}

/* B: decision queue */
.queue{position:absolute;left:10px;right:10px;bottom:30px;background:var(--panel);border-radius:28px;z-index:6;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.qtop{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--ink2);padding:0 4px 10px}
.dots{display:flex;gap:6px;margin-left:auto}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2)}
.dots i.on{background:var(--yellow);width:20px;border-radius:4px}
.qhead{display:flex;align-items:center;gap:12px;padding:0 4px}
.qbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:14px}
.qb{min-height:76px;border-radius:18px;background:rgba(255,255,255,.09);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:14.5px;font-weight:800}
.qb .ic{width:28px;height:28px}
.qb.p{grid-column:1/-1;flex-direction:row;min-height:64px;background:var(--yellow);color:var(--yellow-ink);font-size:19px;gap:10px;box-shadow:0 4px 0 #c9951c}
.qb.alt{grid-column:1/-1;flex-direction:row;min-height:56px;font-size:16px}
.qcorner{position:absolute;right:14px;z-index:5;display:flex;gap:12px}
.odds{display:flex;gap:9px;margin-top:12px;padding:0 4px}
.odds div{flex:1;background:rgba(255,255,255,.06);border-radius:14px;padding:9px 12px;font-size:13.5px;font-weight:700;color:var(--ink2)}
.odds b{display:block;font-size:19px;color:#fff;font-weight:900}
.odds .good b{color:#9ff08a}

/* C: thumb arc */
.arcwrap{position:absolute;right:0;bottom:0;width:393px;height:440px;z-index:5;pointer-events:none}
.arcwrap>*{pointer-events:auto}
.anchor{position:absolute;right:20px;bottom:40px;width:96px;height:96px;border-radius:50%;background:var(--yellow);color:var(--yellow-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:15px;box-shadow:0 5px 0 #c9951c,0 12px 24px rgba(0,0,0,.35);gap:2px}
.anchor .ic{width:34px;height:34px}
.arcbtn{position:absolute;transform:translate(-33px,-33px)}
.arcbtn .lbl{margin:0;position:absolute;right:76px;top:50%;transform:translateY(-50%);background:var(--panel);padding:6px 11px;border-radius:11px;text-shadow:none;font-size:14.5px;line-height:1.2}
.arcbtn.below .lbl{right:auto;left:50%;top:auto;bottom:-40px;transform:translateX(-50%)}
.arcbtn .lbl b{display:block}
.civdisc{position:absolute;left:18px;bottom:46px;z-index:5}
.utag{position:absolute;left:10px;right:10px;top:112px;background:var(--panel);border-radius:18px;padding:10px 14px 10px 10px;display:flex;align-items:center;gap:12px;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.utag .uport{width:46px;height:46px}
.utag .uport .ic{width:28px;height:28px}
.utag .uname{font-size:18px}
.utag .uline{font-size:14px;gap:10px;margin-top:1px}
.pager{position:absolute;right:128px;bottom:66px;z-index:5;background:var(--panel);border-radius:26px;height:52px;display:flex;align-items:center;gap:8px;padding:0 16px 0 8px;font-weight:900;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.pager .mini{width:38px;height:38px;border-radius:50%;background:var(--bab);display:grid;place-items:center}
.pager .mini .ic{width:24px;height:24px;color:#fff}
.btabs{display:flex;gap:6px;padding:8px 10px 36px;background:#0f2030;border-top:1px solid var(--line);flex:none}
.btabs button{flex:1;min-height:60px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:800;color:var(--ink3)}
.btabs button .ic{width:26px;height:26px}
.btabs button.on{background:rgba(255,255,255,.1);color:#fff}

.eras{display:flex;gap:6px;padding:8px 10px 36px;background:#0f2030;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none;position:relative;z-index:2}
.eras::-webkit-scrollbar{display:none}
.eras button{flex:none;min-width:86px;min-height:50px;padding:0 12px;border-radius:14px;font-size:14.5px;font-weight:800;color:var(--ink3);background:rgba(255,255,255,.05)}
.eras button.on{background:#fff;color:var(--navy)}

/* ===== trade / notifications / civilopedia additions ===== */

/* trade B: balance */

uois","sub":"Hiawatha","g":"Civilizations","rows":[["Cities","Onondaga, Osininka, Grand River, Akwesasme"]],"l":[["Unique",[["Mohawk Warrior","Units"],["Longhouse","Buildings"]]]],"ab":["The Great Warpath: All units move through Forest and Jungle Tiles in friendly territory as if they have roads. These tiles can be used to establish City Connections upon researching the Wheel."],"q":"\"Greetings, stranger. I am Hiawatha, speaker for the Iroquois. We seek peace with all, but we do not shrink from war.\"","col":["#364848","#f6cd89"]},{"n":"Persia","sub":"Darius I","g":"Civilizations","rows":[["Cities","Persepolis, Parsagadae, Susa, Ecbatana"]],"l":[["Unique",[["Persian Immortal","Units"],["Satrap's Court","Buildings"]]]],"ab":["Achaemenid Legacy: +50% Golden Age length; +1 Movement, for All units, during a Golden Age; +10% Strength, for All units, during a Golden Age"],"q":"\"Peace be on you! I am Darius, the great and outstanding king of kings of great Persia... but I suppose you knew that.\"","col":["#990503","#f4e836"]},{"n":"Polynesia","sub":"Kamehameha I","g":"Civilizations","rows":[["Cities","Honolulu, Samoa, Tonga, Nuku Hiva"]],"l":[["Unique",[["Maori Warrior","Units"],["Moai","Improvements"]]]],"ab":["Wayfinding: Enables embarkation for land units, starting from the Ancient era, Suppress warning *contains a conditional on a unit movement unique*; Enables All units to enter ocean tiles, starting from the Ancient era; +1 Sight, for Embarked units; +10% Strength, within 2 tiles of a Moai"],"q":"\"Aloha! Greetings and blessings upon you, friend. I am Kamehameha, Great King of this strand of islands.\"","col":["#d95900","#ffff4b"]},{"n":"Siam","sub":"Ramkhamhaeng","g":"Civilizations","rows":[["Cities","Sukhothai, Si Satchanalai, Muang Saluang, Lampang"]],"l":[["Unique",[["Naresuan's Elephant","Units"],["Wat","Buildings"]]]],"ab":["Father Governs Children: +50% Food from City-States; +50% Culture from City-States; +50% Faith from City-States; Military Units gifted from City-States start with +10 XP"],"q":"\"I, Pho Kun Ramkhamhaeng, King of Siam, consider it a great honor that you have walked to visit my country of Siam.\"","col":["#f5e637","#b10803"]},{"n":"Spain","sub":"Isabella","g":"Civilizations","rows":[["Cities","Madrid, Barcelona, Seville, Cordoba"]],"l":[["Unique",[["Conquistador","Units"],["Tercio","Units"]]]],"ab":["Seven Cities of Gold: +100 Gold for discovering a Natural Wonder (bonus enhanced to +500 Gold if first to discover it); +1 Happiness for every known Natural Wonder; +100% Yield from every Natural Wonder"],"q":"\"God blesses those who deserve it. I am Isabel of Spain.\"","col":["#541a1a","#ffa8a8"]},{"n":"Songhai","sub":"Askia","g":"Civilizations","rows":[["Cities","Gao, Tombouctu, Jenne, Taghaza"]],"l":[["Unique",[["Mandekalu Cavalry","Units"],["Mud Pyramid Mosque","Buildings"]]]],"ab":["River Warlord: Receive +200% Gold from Barbarian encampments and pillaging Cities; +100% Strength, when defending, for Embarked units; Military Land units gain the Amphibious promotion"],"q":"\"I am Askia of the Songhai. We are a fair people - but those who cross us will find only destruction. You would do well to avoid repeating the mistakes others have made in the past.\"","col":["#d69113","#5a000a"]},{"n":"Mongolia","sub":"Genghis Khan","g":"Civilizations","rows":[["Cities","Karakorum, Beshbalik, Turfan, Hsia"]],"l":[["Unique",[["Keshik","Units"],["Khan","Units"]]]],"ab":["Mongol Terror: +30% Strength, vs City-States; +1 Movement, for Mounted units"],"q":"\"I am Temuujin, conqueror of cities and countries. Before me lie future Mongolian lands. Behind me is the only cavalry that matters.\"","col":["#510009","#ff7800"]},{"n":"Aztecs","sub":"Montezuma I","g":"Civilizations","rows":[["Cities","Tenochtitlan, Teotihuacan, Tlatelolco, Texcoco"]],"l":[["Unique",[["Jaguar","Units"],["Floating Gardens","Buildings"]]]],"ab":["Sacrificial Captives: Earn 100% of killed Military unit's Strength as Culture"],"q":"\"What do I see before me? Another beating heart for my sacrificial fire.\"","col":["#8b2017","#86eed6"]},{"n":"Inca","sub":"Pachacuti","g":"Civilizations","rows":[["Cities","Cuzco, Tiwanaku, Machu, Ollantaytambo"]],"l":[["Unique",[["Slinger","Units"],["Terrace farm","Improvements"]]]],"ab":["Great Andean Road: Units ignore terrain costs when moving into any tile with Hills; -50% maintenance on road & railroads; No Maintenance costs for improvements in Hill tiles"],"q":"\"How are you? You stand before Pachacuti Inca Yupanqui.\"","col":["#ffb821","#037356"]},{"n":"Denmark","sub":"Harald Bluetooth","g":"Civilizations","rows":[["Cities","Copenhagen, Aarhus, Kaupang, Ribe"]],"l":[["Unique",[["Berserker","Units"],["Norwegian Ski Infantry","Units"]]]],"ab":["Viking Fury: +1 Movement, for Embarked units; 1 Movement point cost to disembark, for All units; No movement cost to pillage, for Melee units"],"q":"\"Harald Bluetooth bids you welcome to his lands, a Viking unlike any the seas and lands have ever known! Hah, are you afraid?\"","col":["#331900","#ffff66"]},{"n":"The Huns","sub":"Attila the Hun","g":"Civilizations","rows":[["Cities","Attila's Court"]],"l":[["Unique",[["Horse Archer","Units"],["Battering Ram","Units"]]]],"ab":["Scourge of God: +1 Production from every Pasture; Cities are razed 2 times as fast; Starts with Animal Husbandry; \"Borrows\" city names from other civilizations in the game"],"q":"\"You are in the presence of Attila, scourge of Rome. Do not let hubris be your downfall as well.\"","col":["#b4b2a4","#460004"]},{"n":"The Netherlands","sub":"William of Orange","g":"Civilizations","rows":[["Cities","Amsterdam, Rotterdam, Utrecht, Groningen"]],"l":[["Unique",[["Sea Beggar","Units"],["Polder","Improvements"]]]],"ab":["Dutch East India Company: Retain 50% of the happiness from a luxury after the last copy has been traded away"],"q":"\"I am William of Orange, stadtholder of The Netherlands. Did you need anything? I still have a lot to do.\"","col":["#d87800","#ffffff"]},{"n       for(let i=0;i<6;i++){ const[nc,nr]=nb(c,r,i); if(WATER.has(T_(nc,nr))){ coastal=true; const ci=corners(x,y,.8); rowTop+=`<polygon points="${pts([cs[i],cs[(i+1)%6],ci[(i+1)%6],ci[i]])}" fill="${i>=4||i===0?'#f6e3b0':'#eed69c'}"/>`; } }
      const own=owner(c,r);
      if(own){ const[cc]=CIVC[own]; rowTop+=`<polygon points="${pts(cs)}" fill="${cc}" opacity=".12"/>`;
        for(let i=0;i<6;i++){const[nc,nr]=nb(c,r,i); if(owner(nc,nr)!==own){const ci=corners(x,y,.93);rowTop+=`<line x1="${ci[i][0]}" y1="${ci[i][1]}" x2="${ci[(i+1)%6][0]}" y2="${ci[(i+1)%6][1]}" stroke="${cc}" stroke-width="3.2" stroke-linecap="round"/>`}}}
      if(reach.has(key)) rowTop+=`<polygon points="${pts(corners(x,y,.9))}" fill="rgba(255,255,255,.32)" stroke="#fff" stroke-width="2" stroke-dasharray="4 3"/>`;
      // terrain features as sprites, with a few variants picked per tile so the map never looks stamped
      const pick=(base,n)=>base+(1+hs%n);
      const feat={f:[pick('f_forest',3),60,10],j:[pick('f_jungle',2),60,10],h:[pick('f_hill',2),54,12],m:[pick('f_mountain',3),62,12],w:['f_marsh',46,8],o:['i_Oasis',40,8]}[t];
      if(feat&&ART[feat[0]]) rowFeat+=prop(x,y+feat[2],feat[0],feat[1]);
      else if(t==='f') rowFeat+=tree(x-9,y+2,.9)+tree(x+8,y,.95)+tree(x,y+8,1);
      else if(t==='m') rowFeat+=mountain(x,y);
      else if(t==='o') rowFeat+=oasis(x,y);
      if(!busy){
        const decor={t:hs%2&&'f_tundra',s:hs%2&&'f_snow',d:hs%3===0&&(hs%2?'f_desert1':'f_desert2'),p:hs%4===0&&'f_plains',g:hs%6===0&&'f_grass'}[t];
        if(decor&&ART[decor]) rowFeat+=prop(x+(hs%3-1)*6,y+8,decor,t==='g'||t==='p'?24:30);
        if(coastal&&(t==='g'||t==='p')&&hs%4===1&&ART.s_palm) rowFeat+=prop(x+8,y+6,'s_palm',30);
      }
      if(FARMS.includes(key)&&!ART['i_Farm']) rowFeat+=farm(x,y);
      if(t==='n'){ rowFeat+=ART['nw_Grand Mesa']?prop(x,y+10,'nw_Grand Mesa',56):mesa(x,y); top+=wonderLabel(x,y,'Grand Mesa'); }
      if(MINES.includes(key)&&!ART['i_Mine']) rowFeat+=mine(x+4,y+1);
      const k=CITIES.find(k=>k.c==c&&k.r==r); if(k){ rowFeat+=city(k,x,y); top+=banner(k,x,y); }
      if(RES[key]||IMPS[key]) rowFeat+=(ART['r_'+RES[key]]||ART['i_'+IMPS[key]])?tileStuff(x,y,key,wat):(RES[key]?res(x,y,RES[key]):'');
      if(attack.has(key)) top+=`<ellipse cx="${x}" cy="${y+3}" rx="20" ry="${20*SQ}" fill="none" stroke="#ff4d4d" stroke-width="3.5"/><path d="M${x+14} ${y-30}l6 6m0-6l-6 6" stroke="#ff4d4d" stroke-width="3" stroke-linecap="round"/>`;
    }
    rowTop+=riverRow(r);
    for(const u of UNITS) if(u.r===r){const[x,y]=cen(u.c,r); rowFeat+=unit(u,x,u.k==='tri'?y+WOFF:y, sel&&u===sel);}
    land+=rowTop+rowFeat+rowFog;
  }
  return MAPCACHE[key]=`<svg width="913" height="1492" viewBox="-260 -320 913 1492" font-family="ui-rounded,system-ui,sans-serif"><defs>${CLOUD_DEFS}</defs><rect x="-260" y="-320" width="913" height="1492" fill="#e4edf4"/>${water}${land}${top}</svg>`;
}

const UNITART = /*UNITART*/{};
const SPR={};
const KIND_SPR={bow:'k_bowman',war:'k_warrior',hop:'k_hoplite',set:'k_settler',wrk:'k_worker'};
const hexRgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const loadImg=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src;});
async function prepSprites(){
  for(const [name,src] of Object.entries(UNITART)){
    const img=await loadImg(src), W0=img.width, H0=img.height, cv=document.createElement('canvas');
    cv.width=W0; cv.height=H0; const cx=cv.getContext('2d'); cx.drawImage(img,0,0);
    const d=cx.getImageData(0,0,W0,H0).data;
    let x0=W0,y0=H0,x1=0,y1=0;
    for(let y=0;y<H0;y++) for(let x=0;x<W0;x++) if(d[(y*W0+x)*4+3]>24){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
    const w=x1-x0+1, h=y1-y0+1; SPR[name]={w,h};
    for(const civ of [...Object.keys(CIVC),'white']){
      const out=cx.createImageData(w,h), o=out.data, tint=civ==='white'?null:hexRgb(CIVC[civ][0]);
      for(let y=0;y<h;y++) for(let x=0;x<w;x++){
        const si=((y+y0)*W0+(x+x0))*4, di=(y*w+x)*4; let r=d[si],g=d[si+1],b=d[si+2]; const a=d[si+3];
        if(!tint){ r=g=b=255; }
        else if(g>60 && g>r*1.45 && g>b*1.45){ const f=Math.min(1.15,g/255*1.08); r=tint[0]*f; g=tint[1]*f; b=tint[2]*f; }
        o[di]=r; o[di+1]=g; o[di+2]=b; o[di+3]=a;
      }
      const c2=document.createElement('canvas'); c2.width=w; c2.height=h; c2.getContext('2d').putImageData(out,0,0);
      SPR[name][civ]=c2.toDataURL();
    }
  }
}
// Feet sit at (0,0). Height is in map units; the base ring keeps the owner readable at a glance.

    <g class="kbody"><image class="kimg" href="${s[civ]}" x="${(-w/2).toFixed(1)}" y="${-height}" width="${w.toFixed(1)}" height="${height}"/><image class="kflash" href="${s.white}" x="${(-w/2).toFixed(1)}" y="${-height}" width="${w.toFixed(1)}" height="${height}" opacity="0"/></g><g class="khp"></g></g>`;

/* =====================================================================
   TRADE with Alexander. Tradable items follow TradeLogic.getAvailableOffers;
   Alexander's valuation follows TradeEvaluation (buy/sell cost, gold inflation) and
   TradeAutomation.getCounteroffer. Standard speed: deals last 30 turns.
   Greece's own inventory (gold, gold per turn, Silver x2, Marble x1) is mock state.
   ===================================================================== */
const DUR=30, GRE={gold:188,gpt:6};
const INFL=1000/(Math.pow(GRE.gpt,1.2)+1.66*1000)+.4;   // TradeEvaluation.getGoldInflation for Greece
const INV={
  us:[{id:'gold',t:'Gold',n:'Gold',max:142,step:10},{id:'gpt',t:'GPT',n:'Gold per turn',max:9,step:1},
      {id:'Wine',t:'Lux',n:'Wine',have:1},{id:'Pearls',t:'Lux',n:'Pearls',have:1},{id:'Cotton',t:'Lux',n:'Cotton',have:1},
      {id:'Horses',t:'Strat',n:'Horses',have:2},{id:'Iron',t:'Strat',n:'Iron',have:4},{id:'Akkad',t:'City',n:'Akkad',pop:4,bld:1}],
  them:[{id:'gold',t:'Gold',n:'Gold',max:GRE.gold,step:10},{id:'gpt',t:'GPT',n:'Gold per turn',max:GRE.gpt,step:1},
      {id:'Silver',t:'Lux',n:'Silver',have:2},{id:'Marble',t:'Lux',n:'Marble',have:1}]};
// every treaty Unciv can put on the table, with what is still missing on turn 58
const LOCKS=[
  {id:'Embassy',n:'Embassy',short:'Writing',why:'Needs <b>Writing</b>, 3 turns away',link:['Techs','Writing']},
  {id:'Open Borders',n:'Open Borders',short:'Civil Service',why:'Both sides need <b>Civil Service</b>',link:['Techs','Civil Service']},
  {id:'Research Agreement',n:'Research Agreement',short:'Education',why:'Needs <b>Education</b> and a Declaration of Friendship; 150 gold each',link:['Techs','Education']},
  {id:'Defensive Pact',n:'Defensive Pact',short:'Chivalry',why:'Needs <b>Chivalry</b> and a Declaration of Friendship',link:['Techs','Chivalry']}];
const item=(side,id)=>INV[side].find(i=>i.id===id);
// what Babylon's side is worth to Alexander (evaluateBuyCost), and what his side costs him (evaluateSellCost)
function worth(it,a){ switch(it.t){
  case 'Gold': return a; case 'GPT': return Math.floor(a*DUR*4/5);
  case 'Lux': return Math.floor(300/INFL);                       // he has none of ours: 300
  case 'Strat': return Math.floor(50*Math.min(2,a)/INFL);        // wants up to 2 of each
  case 'City': return Math.floor((it.pop*4+it.bld+4)*100/INFL); } }
function cost(it,a){ switch(it.t){
  case 'Gold': return a; case 'GPT': return Math.floor(a*DUR*4/5);
  case 'Lux': return Math.floor((it.have>1?250:600)/INFL); } }       // his last copy costs 600
const DEALS={A:{give:{Wine:1},get:{Silver:1}},B:{give:{Wine:1},get:{Marble:1}},C:{give:{},get:{Silver:1}}};
const SENT={}; let TSIDE='us', HINT=null, BSEL=null, CSTEP=2, COPT=0, CALT={}, CCUSTOM=false;
const D=()=>DEALS[cd];
function totals(d){let g=0,c=0; for(const[id,a] of Object.entries(d.give)) g+=worth(item('us',id),a); for(const[id,a] of Object.entries(d.get)) c+=cost(item('them',id),a); return {g,c,bal:g-c};}
function counter(d,bal){ // TradeAutomation.getCounteroffer: add his cheapest asks until the deal is acceptable
  const asks=[];
  for(const it of INV.us){ if(it.t==='City'||it.t==='Lux') continue;
    if((it.t==='Gold'||it.t==='GPT') && d.get[it.id]) continue;
    if(d.give[it.id]!=null) continue;
    const a=it.max||it.have, v=worth(it,a); if(v>0) asks.push({it,a,v}); }
  asks.sort((x,y)=>x.v-y.v); const pick=[]; let delta=bal;
  while(asks.length&&delta<0){const x=asks.shift(); delta+=x.v; pick.push(x);}
  if(delta<0) return null;
  while(delta>0){const c=pick.filter(p=>p.v<=delta).sort((x,y)=>y.v-x.v)[0]; if(!c) break; delta-=c.v; pick.splice(pick.indexOf(c),1);}
  for(const p of pick) if(p.it.t==='Strat') while(p.a>1&&worth(p.it,p.a-1)===p.v) p.a--;
  return pick;
}
function forecast(d){
  const n=Object.keys(d.give).length+Object.keys(d.get).length; const t=totals(d);
  if(!n) return {k:'empty',...t};
  if(t.bal>=0) return {k:'yes',...t};
  const co=counter(d,t.bal); return co?{k:'counter',adds:co,...t}:{k:'no',...t};
}
const label=(it,a)=>it.t==='Gold'?`${a} Gold`:it.t==='GPT'?`${a} Gold per turn`:it.t==='City'?it.n:`${it.n}${a>1?' '+a:''}`;
const addsText=adds=>adds.map(p=>label(p.it,p.a)).join(', ');

function tSub(side,it,a){

const tradeHead=()=>`<div class="lhead">${portrait('p_Alexander',52)}<div style="min-width:0"><div class="sh-title">Alexander</div><div class="rsub"><span>Greece</span><span class="mood" style="color:var(--gold)">Guarded</span></div></div><button class="x">${ic('Close')}</button></div>`;

/* C: ask first, then pick one of the payments he would take */
function payOptions(gap,d){
  const o=[]; if(gap<=0) return o;
  const lux=INV.us.filter(i=>i.t==='Lux'&&worth(i,1)>=gap);
  if(lux.length) o.push({k:'lux',title:'One luxury',alts:lux.map(i=>i.id)});
  if(!d.get.gold){const g=Math.min(142,gap), p=Math.ceil((gap-g)/24); if(p<=9) o.push({k:'gold',title:p?'Gold now and per turn':'Gold now',give:Object.assign({gold:g},p?{gpt:p}:{})});}
  if(!d.get.gpt){const p=Math.ceil(gap/24); if(p<=9) o.push({k:'gpt',title:'Gold per turn only',give:{gpt:p}});}
  const rest=gap-200; if(rest<=142&&!d.get.gold) o.push({k:'strat',title:'Horses and Iron',give:Object.assign({Horses:2,Iron:2},rest>0?{gold:rest}:{})});
  return o;
}
const optGive=o=>o.k==='lux'?{[CALT[o.k]||o.alts[0]]:1}:o.give;
function tradeC(){
  const d=D(), askCost=Object.entries(d.get).reduce((s,[id,a])=>s+cost(item('them',id),a),0);

  let body='', foot='', mid='';
  if(CSTEP===1){
    body=`<div class="h3" style="margin-top:4px">What do you want from Alexander?</div>`+INV.them.map(it=>{const a=d.get[it.id], on=a!=null;
      return `<div class="tcard ${on?'on':''}" style="cursor:pointer" data-cask="${it.id}"><div class="cicon">${tIcon(it)}</div><div class="tc-mid"><div class="rname">${on?label(it,a):it.n}</div><div class="rsub">${tSub('them',it,a||1)}</div></div>${on&&(it.t==='Gold'||it.t==='GPT')?stepper('them',it.id,a):`<div class="worth">Costs him<b>${cost(it,it.t==='Gold'?it.max:it.t==='GPT'?it.max:1)}</b></div>`}</div>`}).join('')

  } else if(CSTEP===2){

          :`<div class="tiw">${Object.entries(g).map(([id,a])=>`<span class="chip">${tIcon(item('us',id)).replace('class="pop" style="width:36px;height:36px','class="pop" style="width:22px;height:22px')}${label(item('us',id),a)}</span>`).join('')}</div>`}</button>`}).join('')
      :`<div class="empty">Nothing you own covers ${askCost}. Ask for less.</div>`;
    body+=`<button class="opt ${CCUSTOM?'on':''}" data-ccustom><div class="opt-h">Build your own<span style="color:var(--ink2)">${CCUSTOM?'':'Pick items'}</span></div></button>`;
    if(CCUSTOM) body+=INV.us.map(it=>{const a=d.give[it.id], on=a!=null;
      return `<div class="drow" style="cursor:pointer" data-cgive="${it.id}"><div class="cicon" style="${on?'box-shadow:inset 0 0 0 2.5px var(--yellow)':''}">${tIcon(it)}</div><div class="dmid"><div class="dname">${on?label(it,a):it.n}</div><div class="rsub">${tSub('us',it,a||1)}</div></div>${on&&it.t!=='Lux'&&it.t!=='City'?stepper('us',it.id,a):`<div class="worth">To him<b>${worth(it,on?a:it.t==='Gold'?it.max:it.t==='GPT'?it.max:it.t==='Strat'?Math.min(2,it.have):1)}</b></div>`}</div>`}).join('');

  } else {

    body=`<div style="margin-top:4px"></div>${col('them','You get','var(--gre)')}${col('us','You give','var(--bab)')}
      <div class="verdict v-${f.k}" style="border-radius:18px;border:0">${portrait('p_Alexander',44)}<div class="vtext"><b>${vt}</b><span>${vs}</span></div>${meter(f)}</div>`;
    foot=SENT[cd]?offerBlock(f,d):`<button class="big" data-tsend>Offer trade</button><div class="offer-sub">He decides on his turn</div>`;
  }
  return `<div class="sheet tsheet fade-in"><div class="grab"></div>${tradeHead()}${tabs}<div class="scroll tscroll" id="cscroll">${body}</div>${mid}<div class="cfoot">${foot}</div></div>`;
}

function natDisc(e,size){ const[o,i]=e.col||['#2a4866','#fff'];
  if(e.n==='Babylon') return `<div class="lmini" style="width:${size}px;height:${size}px;background-image:url(${ART.p_Nebuchadnezzar})"></div>`;

  return '';
}
const clearBg=c=>['Terrains','Civilizations','Resources','Improvements'].includes(c);
const avBg=c=>c==='Techs'?'background:#2a4866;box-shadow:none;color:#fff':c==='Wonders'?'background:#5a3f13;box-shadow:none;color:var(--yellow)':'';
const glyphs=e=>(e.st||[]).map(([k,v])=>`<span>${st(k)}${v}</span>`).join('');
function rsubFor(c,e){
  if(c==='Units') return `<span>${e.sub}</span>${glyphs(e)}`;
  if(c==='Techs') return `<span>${e.sub}</span><span>Cost ${e.cost}</span>`;
  if(c==='Buildings'||c==='Wonders') return `${glyphs(e)}${e.cost?`<span>Cost ${e.cost}</span>`:''}${!e.st&&!e.cost?`<span>${e.sub}</span>`:''}`;
  if(c==='Resources'||c==='Terrains'||c==='Improvements') return `<span>${e.sub}</span>${glyphs(e)}`;
  return `<span>${e.sub||''}</span>`;
}
const ST_LBL={str:'Strength',rng:'Ranged',mov:'Movement',food:'Food',prod:'Production',gold:'Gold',sci:'Science',cul:'Culture',fai:'Faith',hap:'Happiness'};
function linkChip(n,c){ const e=pfind(c,n);
  const stt=c==='Techs'?(DONE.has(n)?'done':n===NOW?'now':''):'';
  const icn=c==='Techs'?ic('t_'+n):c==='Resources'&&ART['r_'+n]?`<img class="ic art" src="${ART['r_'+n]}" alt="">`:c==='Units'||c==='Buildings'||c==='Wonders'?ic(n):c==='Terrains'?`<span style="display:grid;margin:-6px -2px">${hexSw(n,26)}</span>`:c==='Improvements'&&ART['i_'+n]?`<img class="ic art" src="${ART['i_'+n]}" alt="">`:c==='Civilizations'&&e?natDisc(e,22):'';
  return e?`<button class="chip lk ${stt}" data-pedia="${c}|${n}">${icn}${n}${stt==='done'?mk('Checkmark','width:14px;height:14px;color:#6fb3ff'):''}</button>`:`<span class="chip">${icn}${n}</span>`;
}
function entryBody(c,e){
  const tiles=[...(e.st||[]).map(([k,v])=>[k,v,ST_LBL[k]]), ...(e.cost?[[c==='Techs'?'sci':'prod',e.cost,'Cost']]:[])];
  const mine=MINE.find(m=>m[1]===e.n);
  let s=tiles.length?`<div class="ptiles">${tiles.map(([k,v,l])=>`<div class="ptile">${st(k)}${v}<small>${l}</small></div>`).join('')}</div>`:'';
  if(e.rows) s+=`<div class="psec">${e.rows.map(([k,v])=>`<div class="kv"><span>${k}</span>${v}</div>`).join('')}</div>`;
  for(const[t,ls] of (e.l||[])) s+=`<div class="psec"><div class="til">${t}</div><div class="tiw">${ls.map(([n,cc])=>linkChip(n,cc)).join('')}</div></div>`;
  if(e.ab&&e.ab.length) s+=`<div class="psec"><div class="til">Abilities</div>${e.ab.map(a=>`<div class="abil">${ic('Star')}${esc(a)}</div>`).join('')}</div>`;
  if(e.q) s+=`<div class="psec quote">${esc(e.q)}</div>`;
  return s;
}
function heroFor(c,e){
  if(e.n==='Stonehenge') return `<div class="hero scene" style="background-image:url(${ART.ws_Stonehenge})"><div class="hname"><b>${e.n}</b><span>${e.sub}, built in Babylon</span></div></div>`;
  const tint=c==='Terrains'?'linear-gradient(160deg,#6aa9d8,#2f6aa6)':c==='Civilizations'&&e.col?`linear-gradient(160deg,${e.col[0]},#132435)`:c==='Wonders'?'linear-gradient(160deg,#7a5a1e,#2a2410)':'';
  return `<div class="hero" style="${tint?`background:${tint}`:''}"><div class="hname"><b>${e.n}</b><span>${e.sub||c}</span></div><div class="hart">${eArt(c,e,150)}</div></div>`;
}
const groupsOf=c=>{const g=[]; for(const e of PEDIA[c]) if(!g.includes(e.g)) g.push(e.g); return g;};
const search=q=>{q=q.trim().toLowerCase(); if(!q) return []; const r=[]; for(const[c] of CATS) for(const e of PEDIA[c]) if(e.n.toLowerCase().includes(q)) r.push([c,e]); return r.slice(0,60);};
const searchBar=(q,ph)=>`<div class="search">${mk('Search')}<input id="pq" value="${esc(q)}" placeholder="${ph}" autocomplete="off" spellcheck="false">${q?`<button class="clr" data-pclear aria-label="Clear">${ic('Close')}</button>`:''}</div>`;
const pAv=(c,e,cls='cicon')=>`<div class="${cls} ${clearBg(c)?'clear':''}" style="${avBg(c)}">${eArt(c,e,cls==='cicon'?46:60)}</div>`;
const prow=(c,e)=>`<button class="row prow" data-pedia="${c}|${e.n}"><div class="cicon" style="${clearBg(c)?'background:none;box-shadow:none':avBg(c)}">${eArt(c,e,44)}</div><div style="min-width:0"><div class="rname">${e.n}</div><div class="rsub">${rsubFor(c,e)}</div></div></button>`;

/* A: library shelves, full-screen entries */
let PA={view:'home',c:null,n:null,q:'',g:null,from:[]};
function pediaA(){
  let head, body, foot;
  const x=`<button class="x">${ic('Close')}</button>`;
  if(PA.view==='entry'){
    const e=pfind(PA.c,PA.n), list=PEDIA[PA.c], i=list.indexOf(e);
    head=`<div class="phead"><button class="back" data-pback aria-label="Back">${mk('BackArrow')}</button><div class="sh-title">${PA.c}</div>${x}</div>`;
    body=`<div class="scroll" style="padding-top:2px">${heroFor(PA.c,e)}${entryBody(PA.c,e)}</div>`;
    foot=`<div class="pfoot"><button class="pdisc" data-pgo="${PA.c}|${list[Math.max(0,i-1)].n}" aria-label="Previous" ${i<=0?'style="opacity:.35"':''}>&lsaquo;</button><button class="ghost" data-pcat="${PA.c}">All ${PA.c.toLowerCase()}</button><button class="pdisc" data-pgo="${PA.c}|${list[Math.min(list.length-1,i+1)].n}" aria-label="Next" ${i>=list.length-1?'style="opacity:.35"':''}>&rsaquo;</button></div>`;
  } else if(PA.q){
    const r=search(PA.q);
    head=`<div class="phead"><div class="sh-title">Civilopedia</div>${x}</div>`;
    body=`<div class="scroll" id="pres" style="padding-top:0">${r.length?CATS.map(([c])=>r.filter(x=>x[0]===c)).filter(g=>g.length).map(g=>`<div class="h3">${g[0][0]}</div>`+g.map(([c,e])=>prow(c,e)).join('')).join(''):`<div class="empty">No entry named "${esc(PA.q)}"</div>`}</div>`;
    foot=`<div class="pbar">${searchBar(PA.q,'Search every entry')}</div>`;
  } else if(PA.view==='cat'){
    const gs=groupsOf(PA.c);
    head=`<div class="phead"><button class="back" data-phome aria-label="Back">${mk('BackArrow')}</button><div><div class="sh-title">${PA.c}</div><div class="sh-sub">${PEDIA[PA.c].length} entries</div></div>${x}</div>`;
    body=`<div class="scroll" id="plist" style="padding-top:0">${gs.map(g=>`<div class="h3" id="g-${slug(g)}">${g}</div>`+PEDIA[PA.c].filter(e=>e.g===g).map(e=>prow(PA.c,e)).join('')).join('')}</div>`;
    foot=`<div class="pbar">${gs.length>1?`<div class="grail">${gs.map(g=>`<button data-pgrp="${slug(g)}">${g}</button>`).join('')}</div>`:''}${searchBar('','Search every entry')}</div>`;
  } else {
    head=`<div class="phead"><div class="sh-title">Civilopedia</div>${x}</div>`;
    body=`<div class="scroll" style="padding-top:0"><div class="h3" style="margin-top:4px">From your game</div><div class="mine">${MINE.map(([c,n,why])=>{const e=pfind(c,n);return `<button class="mcard" data-pedia="${c}|${n}"><div class="art">${eArt(c,e,64)}</div><b>${n}</b><small>${why}</small></button>`}).join('')}</div>
      <div class="h3">Browse</div><div class="catgrid">${CATS.map(([c,i])=>`<button class="cattile" data-pcat="${c}"><div class="cd">${c==='Religions'?`<svg class="st" viewBox="0 0 16 16" style="width:26px;height:26px">${STAT.fai.replace(/var\(--fai\)/g,'#132435')}</svg>`:mk(i)}</div><div><b>${c}</b><small>${PEDIA[c].length}</small></div></button>`).join('')}</div></div>`;
    foot=`<div class="pbar">${searchBar('','Search every entry')}</div>`;
  }
  return `<div class="sheet psheet fade-in"><div class="grab"></div>${head}${body}${foot}</div>`;
}

/* B: search-first grid, entries rise as cards */
let PB={c:'Wonders',q:'',sel:'Stonehenge'};
function pediaB(){
  const x=`<button class="x">${ic('Close')}</button>`;
  let cells;
  const cell=(c,e)=>`<button class="pcell ${PB.sel===e.n?'on':''}" data-pbsel="${c}|${e.n}"><div class="pi ${clearBg(c)?'clear':''}" style="${avBg(c)}">${eArt(c,e,48)}</div><b>${e.n}</b></button>`;
  if(PB.q){ const r=search(PB.q); cells=r.length?r.map(([c,e])=>cell(c,e)).join(''):`<div class="empty" style="grid-column:1/-1">No entry named "${esc(PB.q)}"</div>`; }
  else if(PB.c==='All') cells=CATS.map(([c])=>`<div class="glbl">${c}</div>`+PEDIA[c].slice(0,8).map(e=>cell(c,e)).join('')).join('');
  else cells=groupsOf(PB.c).map(g=>`<div class="glbl">${g}</div>`+PEDIA[PB.c].filter(e=>e.g===g).map(e=>cell(PB.c,e)).join('')).join('');
  let card='', foot=`<div class="pbar"><div class="grail">${[['All','Search'],...CATS].map(([c,i])=>`<button data-pbcat="${c}" class="${PB.c===c&&!PB.q?'on':''}">${c==='Religions'?`<svg class="st" viewBox="0 0 16 16" style="width:20px;height:20px">${STAT.fai.replace(/var\(--fai\)/g,PB.c===c?'#132435':'#b7cde0')}</svg>`:c==='All'?'':mk(i)}${c}</button>`).join('')}</div>${searchBar(PB.q,'Search every entry')}</div>`;
  if(PB.sel){ const c=PB.selc||catOf(PB.sel), e=pfind(c,PB.sel), list=PB.q?search(PB.q).map(r=>r[1]).filter(x=>pfind(c,x.n)===x):PEDIA[c], i=list.indexOf(e);
    card=`<div class="pcard fade-in"><div class="grab"></div><div class="tf1">${pAv(c,e,'pav')}<div style="min-width:0;flex:1"><div class="cname" style="font-size:21px">${e.n}</div><div class="rsub"><span>${e.sub||c}</span></div></div><button class="x" data-pbclose>${ic('Close')}</button></div>
      <div class="tinfo">${entryBody(c,e)}</div>
      <div class="pfoot"><button class="pdisc" data-pbsel="${c}|${list[Math.max(0,i-1)].n}" aria-label="Previous" ${i<=0?'style="opacity:.35"':''}>&lsaquo;</button><span class="pcount" style="flex:1">${i+1} of ${list.length} ${c.toLowerCase()}</span><button class="pdisc" data-pbsel="${c}|${list[Math.min(list.length-1,i+1)].n}" aria-label="Next" ${i>=list.length-1?'style="opacity:.35"':''}>&rsaquo;</button></div></div>`;
    foot='';}
  return `<div class="sheet psheet fade-in"><div class="grab"></div><div class="phead"><div class="sh-title">Civilopedia</div>${x}</div>
    <div style="position:relative;flex:1;min-height:0;display:flex;flex-direction:column"><div class="scroll" id="pgrid" style="padding-top:0"><div class="pgrid">${cells}</div></div>${card}</div>${foot}</div>`;
}

/* ---------- canvas ---------- */
const S=['Trade','Notifications','Civilopedia'];
const DIRSET={Trade:['A','B','C'],Notifications:['A','B'],Civilopedia:['A','B']};
const THESIS={
  'Trade A':'Two stacked piles replace the two-column table: you give on top, he gives below, and one tray in thumb reach fills whichever pile is lit.',
  'Trade B':'A balance: tap tokens onto your pan or his. The beam tilts by Alexander\'s own valuation before you send; he answers on his turn.',
  'Trade C':'Ask first: pick what you want from Alexander, then choose one of the payments he would take, priced by the game\'s trade math.',
  'Notifications A':'Turn digest: the yellow Next keeps decisions, this sheet keeps what happened. Tap one and the map flies there; step through the rest.',
  'Notifications B':'A feed by the thumb: this turn\'s events stack above the Civ button and open into a chat-style history, newest at the bottom.',
  'Civilopedia A':'Library: your game first, ten shelves, search at the bottom. Entries open full screen and every link is tappable.',
  'Civilopedia B':'Search first: one grid filtered by a category rail in thumb reach. Entries rise as cards like the tech detail and step through neighbors.',
};
let cs=localStorage.getItem('tnp-s')||'Trade'; if(!S.includes(cs)) cs='Trade';
let cd=localStorage.getItem('tnp-d')||'A'; if(!DIRSET[cs].includes(cd)) cd='A';
function ui(){
  if(cs==='Trade') return sbar+({A:tradeA,B:tradeB,C:tradeC}[cd])();
  if(cs==='Notifications') return (cd==='A'?notesA:notesB)();
  return sbar+(cd==='A'?pediaA:pediaB)();
}
function drawUI(keep){
  const sc=keep&&document.querySelector('#ui .scroll'), top=sc?sc.scrollTop:0;
  document.getElementById('ui').innerHTML=ui();
  if(sc){const n=document.querySelector('#ui .scroll'); if(n) n.scrollTop=top;}
  const fs=document.getElementById('fscroll'); if(fs&&!keep) fs.scrollTop=fs.scrollHeight;
  B_DROP=null;
}
function draw(){
  if(cs!=='Notifications') PAN={x:0,y:0,at:null};
  document.getElementById('maplayer').innerHTML=mapHTML();
  drawUI();
  document.getElementById('sseg').innerHTML=S.map(s=>`<button aria-pressed="${s===cs}" data-s="${s}">${s}</button>`).join('');
  document.getElementById('dseg').innerHTML=DIRSET[cs].map(d=>`<button aria-pressed="${d===cd}" data-d="${d}">${d}</button>`).join('');
  document.getElementById('thesis').textContent=THESIS[cs+' '+cd];
  localStorage.setItem('tnp-s',cs); localStorage.setItem('tnp-d',cd);
  fit();
}
function fit(){
  const d=document.getElementById('device'), wrap=document.getElementById('stagewrap');
  const narrow=innerWidth<520; d.classList.toggle('bare',narrow);
  const pad=narrow?0:28; const sc=Math.min((wrap.clientWidth-pad)/393,(wrap.clientHeight-pad)/852,1.25);
  d.style.transform=`scale(${sc})`; d.style.marginTop=narrow?'0':'12px';
}
function openPedia(c,n){ cs='Civilopedia'; if(cd==='C'||!DIRSET.Civilopedia.includes(cd)) cd='A';
  if(cd==='A'){PA.view='entry';PA.c=c;PA.n=n;PA.q='';} else {PB.sel=n;PB.selc=c;PB.c=c;PB.q='';}
  draw(); }
function openNote(i){
  const n=NOTES[i];
  if(cd==='A'){NA.sel=i; drawUI(); panTo(n.at||null);}
  else { const now=NOTES.filter(x=>x.t===58);
    if(!NB.open&&NB.cur===i&&PAN.at===n.at&&now.includes(n)){const nx=now[(now.indexOf(n)+1)%now.length]; i=NOTES.indexOf(nx);}
    NB.open=false; NB.cur=i; drawUI(); panTo(NOTES[i].at||null,330);}
}
document.addEventListener('click',e=>{
  const g=(sel)=>e.target.closest(sel);
  let b;
  if(b=g('[data-s]')){cs=b.dataset.s; if(!DIRSET[cs].includes(cd)) cd='A'; draw(); return;}
  if(b=g('[data-d]')){cd=b.dataset.d; draw(); return;}
  // trade
  if(b=g('[data-tside]')){TSIDE=b.dataset.tside; HINT=null; BSEL=null; drawUI(true); return;}
  if(b=g('[data-tlock]')){HINT=HINT===b.dataset.tlock?null:b.dataset.tlock; drawUI(true); return;}
  if(b=g('[data-tadd]')){const[side,id]=b.dataset.tadd.split('|'), d=D(), bag=side==='us'?d.give:d.get; HINT=null; SENT[cd]=false;
    if(bag[id]!=null){delete bag[id]; if(BSEL&&BSEL[1]===id) BSEL=null;} else {bag[id]=initialAmt(side,item(side,id)); B_DROP=side+id; if(cd==='B'&&(item(side,id).t==='Gold'||item(side,id).t==='GPT'||item(side,id).t==='Strat')) BSEL=[side,id];}
    drawUI(true); return;}
  if(b=g('[data-tset]')){const[side,id,a]=b.dataset.tset.split('|'), d=D(), bag=side==='us'?d.give:d.get; SENT[cd]=false;
    if(+a<=0){delete bag[id]; BSEL=null;} else bag[id]=+a; drawUI(true); return;}
  if(b=g('[data-bsel]')){const[side,id]=b.dataset.bsel.split('|'); BSEL=BSEL&&BSEL[0]===side&&BSEL[1]===id?null:[side,id]; drawUI(true); return;}
  if(g('[data-tsend]')){SENT[cd]=true; drawUI(true); return;}
  if(g('[data-tretract]')){SENT[cd]=false; drawUI(true); return;}
  if(b=g('[data-cstep]')){if(b.disabled) return; CSTEP=+b.dataset.cstep; if(CSTEP===2&&!CCUSTOM) applyOpt(); drawUI(); return;}
  if(b=g('[data-calt]')){CALT.lux=b.dataset.calt; CCUSTOM=false; applyOpt(); drawUI(true); return;}
  if(b=g('[data-copt]')){COPT=+b.dataset.copt; CCUSTOM=false; applyOpt(); drawUI(true); return;}
  if(g('[data-ccustom]')){CCUSTOM=!CCUSTOM; drawUI(true); return;}
  if(b=g('[data-cgive]')){ if(g('.stepper')) return; const id=b.dataset.cgive, d=D(); if(d.give[id]!=null) delete d.give[id]; else d.give[id]=initialAmt('us',item('us',id)); drawUI(true); return;}
  if(b=g('[data-cask]')){ if(g('.stepper')) return; const id=b.dataset.cask, d=D(); if(d.get[id]!=null) delete d.get[id]; else d.get[id]=item('them',id).t==='Gold'?100:item('them',id).t==='GPT'?3:1; COPT=0; drawUI(true); return;}
  // notifications
  if(b=g('[data-note]')){openNote(+b.dataset.note); return;}
  if(b=g('[data-nstep]')){const list=notesFor(NA.turn,NA.f), i=list.indexOf(NOTES[NA.sel])+ +b.dataset.nstep; if(i>=0&&i<list.length) openNote(NOTES.indexOf(list[i])); return;}
  if(g('[data-nlist]')){NA.sel=null; drawUI(); panTo(null); return;}
  if(g('[data-nclose]')){NA.sel=null; NA.turn=58; NA.f='All'; drawUI(); return;}
  if(b=g('[data-nturn]')){NA.turn=+b.dataset.nturn; NA.f='All'; drawUI(); return;}
  if(b=g('[data-nf]')){NA.f=b.dataset.nf; drawUI(); return;}
  if(b=g('[data-nbf]')){NB.f=b.dataset.nbf; drawUI(); return;}
  if(g('[data-nbopen]')){NB.open=true; drawUI(); panTo(null); return;}
  if(g('[data-nbclose]')){NB.open=false; drawUI(); return;}
  if(b=g('[data-nact]')){const a=b.dataset.nact; if(a.startsWith('pedia:')){const[c,n]=a.slice(6).split('|'); openPedia(c,n);} return;}
  // civilopedia
  if(b=g('[data-pedia]')){const[c,n]=b.dataset.pedia.split('|'); if(cs!=='Civilopedia'){openPedia(c,n);return;}
    if(cd==='A'){if(PA.view==='entry') PA.from.push([PA.c,PA.n]); else PA.from=[]; PA.view='entry';PA.c=c;PA.n=n;PA.q='';} else {PB.sel=n;PB.selc=c;} drawUI(); return;}
  if(b=g('[data-pgo]')){const[c,n]=b.dataset.pgo.split('|'); PA.c=c; PA.n=n; drawUI(); return;}
  if(b=g('[data-pcat]')){PA.view='cat'; PA.c=b.dataset.pcat; PA.q=''; PA.from=[]; drawUI(); return;}
  if(g('[data-phome]')){PA.view='home'; PA.q=''; drawUI(); return;}
  if(g('[data-pback]')){const p=PA.from.pop(); if(p){PA.c=p[0];PA.n=p[1];} else PA.view='cat'; drawUI(); return;}
  if(b=g('[data-pgrp]')){const el=document.getElementById('g-'+b.dataset.pgrp); if(el) document.getElementById('plist').scrollTo({top:el.offsetTop-4,behavior:'smooth'}); return;}
  if(g('[data-pclear]')){if(cd==='A') PA.q=''; else PB.q=''; drawUI(); return;}
  if(b=g('[data-pbcat]')){PB.c=b.dataset.pbcat; PB.q=''; PB.sel=null; drawUI(); return;}
  if(b=g('[data-pbsel]')){const[c,n]=b.dataset.pbsel.split('|'); PB.sel=n; PB.selc=c; drawUI(true); return;}
  if(g('[data-pbclose]')){PB.sel=null; drawUI(true); return;}
});
function applyOpt(){ const d=DEALS.C, gap=Object.entries(d.get).reduce((s,[id,a])=>s+cost(item('them',id),a),0), o=payOptions(gap,d)[COPT]; if(o){ d.give=Object.assign({},optGive(o)); } else d.give={}; }
document.addEventListener('input',e=>{ if(e.target.id!=='pq') return; const v=e.target.value;
  if(cd==='A'){PA.q=v; if(v&&PA.view==='entry') PA.view='home';} else {PB.q=v; PB.sel=null;}
  drawUI(); const el=document.getElementById('pq'); if(el){el.focus(); el.setSelectionRange(v.length,v.length);} });
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') return; const i=S.indexOf(cs);
  if(e.key==='ArrowRight'){cs=S[(i+1)%S.length];cd='A';draw()} if(e.key==='ArrowLeft'){cs=S[(i+S.length-1)%S.length];cd='A';draw()} });
addEventListener('resize',fit);
applyOpt();
prepSprites().then(draw);

</script>
</body>
