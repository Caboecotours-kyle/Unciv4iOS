<!doctype html>
<!--
THESIS: New game, city-state, and victory screens in the approved portrait system. Every decision sits in the bottom third; depth opens as sheets.
DATA: Civ V Gods & Kings ruleset (Nations, CityStateTypes, Quests, VictoryTypes, Difficulties, Speeds, Eras) plus Unciv's GameParameters / MapParameters and CityStateFunctions math.
STATE: Babylon, turn 58, 142 gold (+9). Met Greece (Guarded) and Sidon (Militaristic, Friend, influence 48 = 18 of the 30 points from Friend to Ally).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unciv Portrait: setup, city-state, victory</title>
<style>
:root{
  --navy:#132435; --navy2:#1c3249; --panel:rgba(16,31,47,.9); --line:rgba(255,255,255,.12);
  --ink:#fff; --ink2:#b7cde0; --ink3:#7f9ab2;
  --yellow:#ffc93c; --yellow-ink:#3a2a00;
  --bab:#2f7fe0; --gre:#e0524a; --kab:#9a5bd6;
  --food:#6fd05a; --prod:#ff9a3c; --gold:#ffc93c; --sci:#5cc8ff; --cul:#d38bff; --fai:#f3ecd2; --hap:#b8e35a;
  --r:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b1622;color:var(--ink);font-family:var(--r);-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;align-items:center;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}

/* canvas chrome (same as portrait-hud) */
.chrome{width:100%;display:flex;flex-wrap:wrap;gap:8px 10px;justify-content:center;align-items:center;padding:10px 10px 8px;flex:none}
.seg{display:flex;background:#16283a;border-radius:14px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{min-height:40px;padding:8px 13px;border-radius:11px;font-weight:800;font-size:15px;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed=true]{background:#fff;color:var(--navy)}
.thesis{width:100%;text-align:center;font-size:13px;color:var(--ink2);font-weight:600;min-height:18px;padding:0 8px}
.stagewrap{flex:1;width:100%;display:flex;align-items:flex-start;justify-content:center;min-height:0;overflow:hidden}
.device{width:393px;height:852px;position:relative;transform-origin:top center;border-radius:54px;overflow:hidden;flex:none;
  box-shadow:0 0 0 10px #05090e,0 0 0 11px #2a3b4d,0 30px 60px rgba(0,0,0,.5);background:#122536}
.device.bare{border-radius:0;box-shadow:none}
.screen{position:absolute;inset:0;overflow:hidden}

/* shared system (copied from portrait-hud) */
.sbar{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 42px;font-weight:700;font-size:16px;z-index:9;pointer-events:none}
.sbar .bat{width:26px;height:12px;border:1.5px solid #fff;border-radius:4px;position:relative}
.sbar .bat::after{content:"";position:absolute;inset:1.5px;right:5px;background:#fff;border-radius:1.5px}
.scrim-t{position:absolute;top:0;left:0;right:0;height:130px;background:linear-gradient(rgba(10,22,34,.62),rgba(10,22,34,0));z-index:3;pointer-events:none}
.ic{display:inline-block;width:22px;height:22px;background:currentColor;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;flex:none}
.ic.art{background:none!important;-webkit-mask:none!important;mask:none!important;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
svg.st{width:18px;height:18px;flex:none}
.stats{position:absolute;top:54px;left:10px;right:10px;height:50px;background:var(--panel);border-radius:16px;display:flex;align-items:center;padding:0 5px 0 8px;z-index:4;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;font-size:16.5px;padding:0 5px;height:44px;white-space:nowrap}
.stat small{font-size:12.5px;font-weight:700;color:var(--ink2)}
.stats .turn{margin-left:auto;height:40px;background:rgba(255,255,255,.1);border-radius:12px;padding:0 10px;font-size:15px;font-weight:900;display:flex;align-items:center;gap:6px}
.stats .turn .ic{width:16px;height:16px;color:var(--ink2)}
.disc{width:66px;height:66px;border-radius:50%;background:#eef5fb;color:var(--navy);display:grid;place-items:center;box-shadow:0 5px 0 #b9cadb,0 9px 18px rgba(0,0,0,.25);position:relative;flex:none}
.disc .ic{width:32px;height:32px}
.disc.y{background:var(--yellow);color:var(--yellow-ink);box-shadow:0 5px 0 #c9951c,0 9px 18px rgba(0,0,0,.25)}
.disc.navy{background:var(--navy2);color:#fff;box-shadow:0 5px 0 #0b1826,0 9px 18px rgba(0,0,0,.3)}
.badge{position:absolute;top:-5px;right:-5px;min-width:24px;height:24px;border-radius:12px;background:var(--gre);color:#fff;font-size:13px;font-weight:900;display:grid;place-items:center;padding:0 6px;box-shadow:0 0 0 2.5px var(--navy)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#122536;border-radius:28px 28px 0 0;z-index:6;box-shadow:0 -10px 30px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden}
.grab{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:8px auto 0;flex:none}
.sh-head{display:flex;align-items:center;gap:12px;padding:10px 16px 6px;flex:none}
.sh-title{font-size:23px;font-weight:900;display:flex;align-items:center;gap:6px}
.sh-sub{font-size:14px;font-weight:700;color:var(--ink2);margin-top:1px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.x{margin-left:auto;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.09);display:grid;place-items:center;flex:none}
.x .ic{width:18px;height:18px;color:var(--ink2)}
.tabs{display:flex;padding:0 8px;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;min-height:52px;font-weight:800;font-size:16px;color:var(--ink3);position:relative;text-align:center}
.tabs button.on{color:#fff}
.tabs button.on::after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:3px;border-radius:2px;background:var(--yellow)}
.scroll{flex:1;overflow:auto;padding:12px 14px 24px;scrollbar-width:none;min-height:0}
.scroll::-webkit-scrollbar{display:none}
.cicon{width:52px;height:52px;border-radius:15px;background:#2a4866;display:grid;place-items:center;flex:none}
.cicon .ic{width:32px;height:32px;color:#fff}
.cicon svg.st{width:28px;height:28px}
.cname{font-weight:900;font-size:18px}
.bar{height:9px;border-radius:5px;background:rgba(255,255,255,.1);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--prod);border-radius:5px}
.h3{font-size:14px;font-weight:800;color:var(--ink3);margin:18px 2px 6px;display:flex;align-items:center;gap:8px}
.h3:first-child{margin-top:4px}
.row{display:flex;align-items:center;gap:12px;min-height:66px;padding:8px 4px;border-bottom:1px solid var(--line);width:100%}
.row:last-child{border-bottom:0}
.row .cicon{width:46px;height:46px;border-radius:13px}
.row .cicon .ic{width:28px;height:28px}
.rname{font-weight:800;font-size:16.5px}
.rsub{font-size:13.5px;font-weight:700;color:var(--ink2);display:flex;gap:8px;margin-top:3px;align-items:center;flex-wrap:wrap;line-height:1.3}
.rsub span{display:flex;gap:3px;align-items:center}
.rsub svg.st{width:15px;height:15px}
.turns{margin-left:auto;font-weight:900;font-size:17px;display:flex;align-items:center;gap:4px;color:#fff;flex:none}
.turns small{font-size:13px;color:var(--ink3);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border-radius:12px;padding:6px 10px 6px 7px;font-size:13.5px;font-weight:800;white-space:nowrap}
.chip .ic{width:20px;height:20px}
.chip.w{background:rgba(255,201,60,.15);color:var(--yellow)}
.big{min-height:60px;border-radius:18px;background:var(--yellow);color:var(--yellow-ink);font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 0 #c9951c;width:100%;text-align:center}
.big .ic{width:24px;height:24px}
.ghost{min-height:54px;border-radius:16px;background:rgba(255,255,255,.08);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-align:center}
.qb{min-height:76px;border-radius:18px;background:rgba(255,255,255,.09);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:14.5px;font-weight:800;text-align:center}
.qb .ic{width:28px;height:28px}
.qb small{font-size:12.5px;font-weight:700;color:var(--ink2)}
.btabs{display:flex;gap:6px;padding:8px 10px 34px;background:#0f2030;border-top:1px solid var(--line);flex:none}
.btabs button{flex:1;min-height:60px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:800;color:var(--ink3);text-align:center}
.btabs button .ic{width:26px;height:26px}
.btabs button.on{background:rgba(255,255,255,.1);color:#fff}
.lport{background-size:cover;background-position:center 20%;flex:none}
.quote{font-size:14px;font-style:italic;font-weight:600;color:var(--ink2);line-height:1.4}
.fade-in{animation:rise .38s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes twk{0%,100%{opacity:0}45%{opacity:1}}

/* map backdrop (baked from the approved map) */
.mapbg{position:absolute;left:0;width:393px;height:852px;background-size:393px 852px;background-color:#e4edf4}

/* leader art: portrait, or nation icon on civ colour as a placeholder */
.lp{display:grid;place-items:center;background-size:cover;background-position:center 18%;position:relative;flex:none;overflow:hidden}
.lp.ph::after{content:"";position:absolute;inset:5px;border-radius:inherit;border:2px dashed rgba(255,255,255,.4)}
.lp.ph.dk::after{border-color:rgba(0,0,0,.25)}
.nd{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none}
.nd .ic{width:17px;height:17px}
.phtag{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(16,31,47,.85);color:var(--ink2);font-size:12.5px;font-weight:800;border-radius:9px;padding:4px 9px;white-space:nowrap}

/* overlay + bottom picker */
.dim{position:absolute;inset:0;background:rgba(6,14,22,.55);z-index:7;animation:fadein .2s both}
@keyframes fadein{from{opacity:0}}
.pick{position:absolute;left:0;right:0;bottom:0;z-index:8;background:#122536;border-radius:28px 28px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.4);display:flex;flex-direction:column;max-height:640px;animation:rise .32s cubic-bezier(.16,1,.3,1) both}
.pick .scroll{padding-bottom:14px}
.pickfoot{flex:none;padding:8px 14px 34px}
.opt{width:100%;display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 12px;border-radius:16px;margin-bottom:6px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 2px transparent}
.opt.on{background:rgba(255,201,60,.1);box-shadow:inset 0 0 0 2.5px var(--yellow)}
.opt .ot{font-weight:800;font-size:16.5px}
.opt .os{font-size:13.5px;font-weight:700;color:var(--ink2);margin-top:2px}
.ck{margin-left:auto;width:28px;height:28px;border-radius:50%;background:var(--yellow);color:var(--yellow-ink);display:grid;place-items:center;flex:none}
.ck .ic{width:16px;height:16px}
.opt:disabled{opacity:.45}
.segs{display:flex;gap:6px;flex-wrap:wrap}
.segs{flex-wrap:nowrap}
.segs button{flex:1 1 0;min-width:0;min-height:52px;padding:6px 10px;border-radius:14px;background:rgba(255,255,255,.06);font-weight:800;font-size:15px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center}
.segs button small{font-size:12px;font-weight:700;color:var(--ink3)}
.segs button.on{background:#fff;color:var(--navy)}
.segs button.on small{color:#51667b}
.hs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.hs::-webkit-scrollbar{display:none}
.hs>button{flex:none}
.stepper{display:flex;align-items:center;gap:10px;margin-left:auto;flex:none}
.stepper button{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.1);font-size:26px;font-weight:900;display:grid;place-items:center;text-align:center}
.stepper b{min-width:30px;text-align:center;font-size:20px;font-weight:900}
.tog{margin-left:auto;width:52px;height:32px;border-radius:16px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:background .15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s}
.tog.on{background:var(--food)}
.tog.on::after{transform:translateX(20px)}
.trow{width:100%;display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 4px;border-bottom:1px solid var(--line);font-weight:800;font-size:16px}
.trow .ic{width:24px;height:24px;color:var(--ink2)}

/* ---------- SETUP A: leader card ---------- */
.sa-top{position:absolute;top:0;left:0;right:0;height:470px;overflow:hidden}
.sa-glow{position:absolute;inset:0;opacity:.9}
.sa-glow::after{content:"";position:absolute;left:0;right:0;bottom:0;height:200px;background:linear-gradient(rgba(18,37,54,0),#122536)}
.sa-close{position:absolute;top:52px;left:14px;z-index:5}
.sa-hero{position:absolute;top:66px;left:50%;margin-left:-118px;width:236px;height:236px;border-radius:36px;box-shadow:0 14px 34px rgba(0,0,0,.4),0 0 0 4px rgba(255,255,255,.9);transition:transform .25s cubic-bezier(.16,1,.3,1)}
.sa-arrow{position:absolute;top:156px;width:52px;height:52px;border-radius:50%;background:var(--panel);display:grid;place-items:center;z-index:4}
.sa-arrow .ic{width:24px;height:24px}
.sa-meta{position:absolute;top:318px;left:18px;right:18px;text-align:center}
.sa-name{font-size:27px;font-weight:900;letter-spacing:-.01em}
.sa-civ{display:flex;justify-content:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.sa-ab{margin-top:10px;font-size:14.5px;font-weight:700;line-height:1.35;color:#e7f1fa;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sa-strip{position:absolute;top:484px;left:0;right:0;display:flex;gap:10px;overflow-x:auto;padding:4px 16px 6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.sa-strip::-webkit-scrollbar{display:none}
.sa-strip button{flex:none;width:54px;height:54px;border-radius:50%;scroll-snap-align:center;position:relative}
.sa-strip button .lp{width:54px;height:54px;border-radius:50%}
.sa-strip button .lp.ph::after{inset:3px;border-width:1.5px}
.sa-strip button.on{box-shadow:0 0 0 3px #122536,0 0 0 6px var(--yellow)}
.sa-recipe{position:absolute;left:14px;right:14px;top:558px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rc{min-height:56px;border-radius:16px;background:rgba(255,255,255,.07);display:flex;align-items:center;gap:9px;padding:0 12px;font-weight:800;font-size:15px;text-align:left;white-space:nowrap;overflow:hidden}
.rc .ic,.rc svg.st{width:22px;height:22px;color:var(--ink2)}
.rc span{overflow:hidden;text-overflow:ellipsis}
.rc.more{justify-content:center;color:var(--ink2)}
.sa-go{position:absolute;left:14px;right:14px;bottom:34px}

/* ---------- SETUP B: steps ---------- */
.sb{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:50px}
.sb-head{flex:none;display:flex;align-items:center;gap:12px;padding:4px 16px 10px}
.steps{display:flex;gap:6px;flex:none;padding:0 16px 12px}
.steps i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.14)}
.steps i.on{background:var(--yellow)}
.ngrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;padding:4px 0 8px}
.nb{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--ink2);text-align:center;line-height:1.15;min-height:96px}
.nb .lp{width:66px;height:66px;border-radius:50%}
.nb .lp.ph::after{inset:4px}
.nb.on{color:#fff}
.nb.on .lp{box-shadow:0 0 0 3px #122536,0 0 0 6px var(--yellow)}
.sb-sel{flex:none;display:flex;align-items:center;gap:12px;background:var(--navy2);border-radius:22px 22px 0 0;padding:12px 16px;box-shadow:0 -8px 24px rgba(0,0,0,.3)}
.sb-sel .lp{width:64px;height:64px;border-radius:18px}
.sb-sel .ab{font-size:13.5px;font-weight:700;color:var(--ink2);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.sb-foot{flex:none;display:flex;gap:10px;padding:10px 14px 34px;background:var(--navy2)}
.sb-foot .ghost{width:120px;flex:none;min-height:60px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mtc{border-radius:18px;background:rgba(255,255,255,.05);padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:14.5px;box-shadow:inset 0 0 0 2px transparent;text-align:center}
.mtc svg{width:100%;height:78px;display:block;border-radius:12px;background:#2f7ad6}
.mtc.on{background:rgba(255,201,60,.1);box-shadow:inset 0 0 0 2.5px var(--yellow)}
.dtrack{position:relative;height:64px;margin:4px 6px 0}
.dtrack::before{content:"";position:absolute;left:14px;right:14px;top:22px;height:6px;border-radius:3px;background:rgba(255,255,255,.12)}
.dfill{position:absolute;left:14px;top:22px;height:6px;border-radius:3px;background:var(--yellow)}
.dstop{position:absolute;top:0;width:48px;height:50px;margin-left:-24px;display:grid;place-items:center;text-align:center}
.dstop i{width:16px;height:16px;border-radius:50%;background:#2a4866;box-shadow:0 0 0 3px #122536;display:block;margin-top:-2px}
.dstop.lt i{background:var(--yellow)}
.dstop.on i{width:30px;height:30px;background:#fff;box-shadow:0 3px 0 #b9cadb,0 0 0 4px var(--yellow)}
.dname{display:flex;align-items:baseline;justify-content:space-between;margin-top:2px}
.dname b{font-size:22px;font-weight:900}
.dname span{font-size:13.5px;font-weight:700;color:var(--ink2)}
.vt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.vt button{min-height:72px;border-radius:16px;background:rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:14px;font-weight:800;color:var(--ink3);text-align:center}
.vt button .ic{width:28px;height:28px}
.vt button.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.vt button.on .ic{color:var(--yellow)}
.numrow{display:flex;align-items:center;gap:12px;min-height:64px;border-bottom:1px solid var(--line)}
.numrow .ic{width:26px;height:26px;color:var(--ink2)}

/* ---------- SETUP C: presets + tune ---------- */
.sc{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:50px}
.last{display:flex;align-items:center;gap:12px;background:var(--navy2);border-radius:20px;padding:12px;width:100%}
.last .lp{width:60px;height:60px;border-radius:16px}
.pre{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.prc{border-radius:18px;background:rgba(255,255,255,.05);padding:12px 12px 12px;min-height:104px;display:flex;flex-direction:column;gap:4px;box-shadow:inset 0 0 0 2px transparent;text-align:left}
.prc b{font-size:17px;font-weight:900;display:flex;align-items:center;gap:6px}
.prc b .ic{width:22px;height:22px;color:var(--ink2)}
.prc span{font-size:13.5px;font-weight:700;color:var(--ink2);line-height:1.3}
.prc.on{background:rgba(255,201,60,.1);box-shadow:inset 0 0 0 2.5px var(--yellow)}
.prc.on b .ic{color:var(--yellow)}
.acc{border-radius:18px;background:rgba(255,255,255,.04);margin-bottom:8px;overflow:hidden}
.acch{width:100%;display:flex;align-items:center;gap:12px;min-height:60px;padding:6px 14px}
.acch .ic.lead{width:26px;height:26px;color:var(--ink2)}
.acch .an{font-weight:800;font-size:16.5px}
.acch .av{margin-left:auto;font-weight:800;font-size:14.5px;color:var(--ink2);text-align:right;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acch .chev{width:18px;height:18px;color:var(--ink3);transition:transform .2s}

/* map type thumbnails: procedural land masks on a small hex grid */
function hh(x,y){let h=(x*374761393+y*668265263)^0x5bf03635;h=(h^(h>>>13))*1274126177;return ((h^(h>>>16))>>>0)/4294967295}
function noise(u,v,s){const x=u*s,y=v*s,xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,sm=t=>t*t*(3-2*t);
  const a=hh(xi,yi),b=hh(xi+1,yi),c=hh(xi,yi+1),d=hh(xi+1,yi+1);return (a+(b-a)*sm(fx))+((c+(d-c)*sm(fx))-(a+(b-a)*sm(fx)))*sm(fy)}
const blob=(u,v,cx,cy,rx,ry)=>1-((u-cx)**2/rx**2+(v-cy)**2/ry**2);
const MASK={
  'Pangaea':(u,v)=>blob(u,v,0,0,.78,.72)+(noise(u,v,4)-.5)*.9,
  'Small Continents':(u,v)=>Math.max(blob(u,v,-.5,-.35,.34,.32),blob(u,v,.45,-.4,.3,.3),blob(u,v,-.35,.45,.32,.3),blob(u,v,.5,.4,.3,.34))+(noise(u,v,5)-.5)*.8,
  'Perlin':(u,v)=>(noise(u+3,v,2.6)-.47)*3.2-Math.max(Math.abs(u),Math.abs(v))**4,
  'Fractal':(u,v)=>(noise(u,v+5,3.4)*.6+noise(u,v,7)*.4-.46)*3.4-Math.max(Math.abs(u),Math.abs(v))**4,
  'Continent and Islands':(u,v)=>Math.max(blob(u,v,-.35,0,.5,.75)+(noise(u,v,4)-.5)*.7,(noise(u+9,v,6)-.72)*4),
  'Archipelago':(u,v)=>(noise(u+2,v+2,6)-.66)*4,
  'Two Continents':(u,v)=>Math.max(blob(u,v,-.5,0,.34,.8),blob(u,v,.5,0,.34,.8))+(noise(u,v,4)-.5)*.8,
  'Three Continents':(u,v)=>Math.max(blob(u,v,-.6,0,.26,.8),blob(u,v,0,0,.24,.8),blob(u,v,.6,0,.26,.8))+(noise(u,v,4)-.5)*.7,
  'Inner Sea':(u,v)=>Math.min(blob(u,v,0,0,.9,.85),-blob(u,v,0,0,.48,.42))+(noise(u,v,4)-.5)*.5,
  'Lakes':(u,v)=>blob(u,v,0,0,1.05,1)+(noise(u,v,5)-.62)*1.8,
  'Four Corners':(u,v)=>Math.max(blob(u,v,-.62,-.55,.34,.4),blob(u,v,.62,-.55,.34,.4),blob(u,v,-.62,.55,.34,.4),blob(u,v,.62,.55,.34,.4))+(noise(u,v,4)-.5)*.6,
  'Spiral':(u,v)=>{const r=Math.hypot(u,v*1.2),a=Math.atan2(v*1.2,u);const d=Math.abs(((r*9-a+Math.PI*4)%(Math.PI*2))-Math.PI);return (d<1.2&&r<.95)?.5:-.5},
  'Boreal':(u,v)=>blob(u,v,0,0,.85,.8)+(noise(u,v,4)-.5)*.8,
};
function mtSvg(t){
  const C=15,R=8,Wd=Math.sqrt(3)*5.2,Dy=5.2*1.5*.72;let s='';
  for(let r=0;r<R+3;r++)for(let c=0;c<C;c++){const x=Wd*(c+(r&1?.5:0))-2,y=Dy*r+2;const u=(c/(C-1))*2-1,v=(r/(R+2))*2-1;
    const m=MASK[t](u,v); let col=m>0?(t==='Boreal'?(Math.abs(v)>.55?'#f3f7fa':Math.abs(v)>.25?'#bdb993':'#7cc449'):(Math.abs(v)>.8?'#f3f7fa':hh(c,r)>.8?'#e3ca52':'#88cd50')):(m>-.25?'#3fb5e3':'');
    if(!col)continue; const p=[...Array(6)].map((_,i)=>{const a=(60*i-90)*Math.PI/180;return (x+5.2*Math.cos(a)).toFixed(1)+','+(y+5.2*.72*Math.sin(a)).toFixed(1)}).join(' ');
    s+=`<polygon points="${p}" fill="${col}"/>`;}
  return `<svg viewBox="0 0 ${(C*Wd).toFixed(0)} ${(Dy*(R+2)+4).toFixed(0)}" preserveAspectRatio="xMidYMid slice">${s}</svg>`;
}

/* =====================================================================
   CITY-STATE: Sidon
   Real rules: Friend at 30, Ally at 60 (and highest). Decay 1/turn above resting point 0.
   Gift influence = (gold^1.01 / 9.8) x (1 - 2/3 x turn/400) rounded down to 5: 250 -> 20, 500 -> 45, 1000 -> 95 on turn 58.
   Tribute gold = 50 + 5 x floor(58 / 6.5) = 90, costs 15 influence. Worker costs 50.
   ===================================================================== */
const KAB = {inf:48, gre:35, gold:142};
const QUESTS = [
  {n:'Clear Barbarian Camp', i:'i_Barbarian encampment', r:50, d:'We feel threatened by a Barbarian Camp near our city.', m:'Anyone can claim it', act:'Show camp'},
  {n:'Route', i:'RoadConnection', r:50, d:'Build a road to connect your capital to our city.', m:'Babylon to Sidon', act:'Plan road'},
  {n:'Contest Technologies', i:st('sci'), r:40, d:'Most new technologies researched wins.', m:'You 3 · Greece 2 · 17 turns left', act:'Open tech'},
];
const GIFTS = [[250,20],[500,45],[1000,95]];
const turnsFriend = Math.ceil((KAB.inf-30)/1)+1;

function infMeter(){
  const max=70, pct=v=>Math.min(v,max)/max*100;
  return `<div class="infl"><div class="inum"><b>${KAB.inf}</b><span>influence</span><span class="to">${60-KAB.inf} to Ally</span></div>
    <div class="itrack"><div class="fill" style="width:${pct(KAB.inf)}%"></div>
      <div class="tick" style="left:${pct(30)}%"></div><div class="tl" style="left:${pct(30)}%">Friend 30</div>
      <div class="tick" style="left:${pct(60)}%;background:var(--yellow)"></div><div class="tl" style="left:${pct(60)}%;color:var(--yellow)">Ally 60</div>
      <div class="mk" style="left:${pct(KAB.gre)}%;background:var(--gre)">${ic('n_Greece','color:#fff')}</div>
      <div class="mk lp" style="left:${pct(KAB.inf)}%;background-image:url(${ART.p_Nebuchadnezzar});background-color:var(--bab)"></div></div>
    <div class="idecay"><span class="chip">${ic('Reduce')}&minus;1 per turn</span><span class="chip">Friend for ${turnsFriend} turns</span></div></div>`;
}
function csSheetBody(){
  const t=UI.csTab;
  if(t==='quests') return QUESTS.map(q=>`<div class="row qrow"><div class="cicon">${icx(q.i)}</div><div style="min-width:0"><div class="rname">${q.n}</div><div class="rsub">${q.m}</div></div><span class="rew">+${q.r}</span></div>`).join('');
  if(t==='bonus') return `<div class="bon now"><div class="bt" style="color:#8fd8ff">Friend</div><div class="bd">Provides military units every ≈20 turns</div></div>
      <div class="bon"><div class="bt" style="color:var(--yellow)">Ally</div><div class="bd">Provides military units every ≈17 turns<br>Sidon's resources join your empire</div></div>
      <div class="row">${'<div class="cicon">'+ic('Cataphract')+'</div>'}<div><div class="rname">Cataphract</div><div class="rsub">Sidon's unique gift once you know Horseback Riding</div></div></div>`;
  return `<div class="row">${lp('Greece','','width:46px;height:46px;border-radius:50%')}<div style="min-width:0"><div class="rname">Greece</div><div class="rsub"><span>Influence ${KAB.gre}</span><span>Decays at half speed</span></div></div><span class="rel" style="margin-left:auto">Friend</span></div>
    <div class="row"><div class="cicon">${ic('Capital')}</div><div><div class="rname">Ally</div><div class="rsub">None yet. First to 60 wins it</div></div></div>
    <div class="row"><div class="cicon">${ic('Shield')}</div><div><div class="rname">Protected by</div><div class="rsub">Nobody</div></div></div>`;
}
function csSubSheet(){
  const s=UI.csSheet; if(!s) return '';
  let t,b;
  if(s==='gift'){t='Give a gift'; b=GIFTS.map(([g,inf])=>`<button class="opt" disabled><div class="cicon" style="width:44px;height:44px;border-radius:12px">${st('gold')}</div><div><div class="ot">${g} gold</div><div class="os">+${inf} influence</div></div><span class="rew" style="background:rgba(255,255,255,.08);color:var(--ink2)">Need ${g-KAB.gold}</span></button>`).join('')+`<div class="warn" style="color:var(--ink2);margin-top:6px">${st('gold')}You have ${KAB.gold} gold, +9 per turn</div>`;}
  if(s==='pledge'){t='Pledge to protect'; b=`<div class="bon"><div class="bd">Sidon's influence rests at <b>10</b> instead of 0, so it stops decaying there.<br>You cannot revoke for 10 turns. Revoking costs 20 influence.</div></div><button class="big" style="margin-top:6px" data-close>${ic('Shield')}Pledge to protect Sidon</button>`;}
  if(s==='tribute'){t='Demand tribute'; b=`<div class="mods"><div><span>Base value</span><span>&minus;110</span></div><div><span>Military rank</span><span>+75</span></div><div><span>Military near Sidon</span><span>0</span></div><div><span>Willingness</span><span class="red">&minus;35</span></div></div>
      <div class="warn">${ic('ExclamationMark')}At least 0 to take gold, at least 30 and size 4 city for worker</div>
      <button class="opt" disabled style="margin-top:10px"><div><div class="ot">Take 90 gold</div><div class="os">&minus;15 influence</div></div></button>
      <button class="opt" disabled><div><div class="ot">Take worker</div><div class="os">&minus;50 influence</div></div></button>
      <button class="ghost" style="margin-top:8px;color:#ffb1aa;background:rgba(224,82,74,.16)">Declare war</button>`;}
  return `<div class="dim" data-close></div><div class="pick"><div class="grab"></div><div class="sh-head"><div class="sh-title">${t}</div><button class="x" data-close>${ic('Close')}</button></div><div class="scroll" style="padding-bottom:36px">${b}</div></div>`;
}
const csHead = (decay) => `<div class="sh-head"><div class="csd">${ic('cs_Militaristic')}</div><div><div class="sh-title">Sidon</div><div class="sh-sub"><span>Militaristic</span><span class="rel">Friend</span>${decay?`<span>&minus;1 per turn</span>`:''}</div></div><button class="x">${ic('Close')}</button></div>`;

/* B: race to Ally */
const WAYS = [
  {k:'camp', n:'Clear the camp', s:'Quest · anyone can claim', r:50, i:'i_Barbarian encampment', a:'Show camp on map'},
  {k:'road', n:'Road to Sidon', s:'Quest · Babylon to Sidon', r:50, i:'RoadConnection', a:'Plan the road'},

function csB(){
  const w=WAYS.find(x=>x.k===UI.way), top=100, y=v=>`${(1-Math.min(v,top)/top)*100}%`;

        ${proj?mk(proj,`<div class="d"></div>`,`background-image:url(${ART.p_Nebuchadnezzar});background-color:var(--bab)`,proj,'ghost-mk'):''}
        ${mk(KAB.inf,`<div class="d"></div>`,`background-image:url(${ART.p_Nebuchadnezzar});background-color:var(--bab);${proj?'opacity:.55':''}`,KAB.inf)}

   next:`You hold <b>Babylon</b> · Athens is the only capital you have found`, rival:[['Greece','1 of 4']]},

   pips:[['United Nations',0],['Diplomacy',0]],
   next:`Anyone builds the <b>United Nations</b> (Globalization), then the vote`, rival:[['Greece','0 of 2']]},
];
function vicHeader(){ return `<div class="sh-head"><div><div class="sh-title">Victory</div><div class="sh-sub"><span>Turn 58 of 500</span><span>Prince</span><span>Standard</span></div></div><button class="x">${ic('Close')}</button></div>`; }
function vicCardA(x){
  const open=UI.vOpen===x.v;
  const pip=([n,p])=>`<div class="pip ${p>=1?'done':p>0?'part':''}" style="${p>0&&p<1?`--p:${p*100}%`:''}">${ic(n)}</div>`;
  return `<button class="vcard" data-vopen="${x.v}"><div class="vh"><div class="vi" style="background:${VCOL[x.v]}">${ic('v_'+x.v,'color:#fff')}</div><div class="vn">${x.v}</div><div class="vcount">${x.done}<small> of ${x.total}</small></div></div>
    <div class="pips">${x.pips.map(pip).join('')}</div>
    <div class="vnext">${ic('ArrowRight')}<span>${x.next}</span></div>
    ${open?`<div class="vmore">${x.rival.map(([c,t])=>`<div class="rrow">${lp(c)}${c}<span>${t}</span></div>`).join('')}<div class="rrow">${lp('Random')}2 civilizations not met<span>Unknown</span></div></div>`:''}</button>`;
}
function vicA(){
  if(vstate!=='game') return vicEndA();
  return mapbg(0)+`<div class="scrim-t"></div>${sbar}${stats()}
    <div class="sheet fade-in" style="top:120px"><div class="grab"></div>${vicHeader()}
      <div class="scroll" style="padding-top:4px">
        <div class="scorebar">${ic('Score','width:28px;height:28px;color:#e0524a')}<div><div class="rname">Score 212</div><div class="rsub">2nd of 2 known · Greece 248</div></div><div class="turns">442<small>turns left</small></div></div>
        <div style="height:10px"></div>
        ${VIC.map(vicCardA).join('')}
      </div></div>`;
}
const VSTR = {
  Scientific:"You have achieved victory through mastery of Science! You have conquered the mysteries of nature and led your people on a voyage to a brave new world! Your triumph will be remembered as long as the stars burn in the night sky!",
  defeat:"You have been defeated. Your civilization has been overwhelmed by its many foes. But your people do not despair, for they know that one day you shall return - and lead them forward to victory!",
};
function sparks(n){return `<div class="ws-spark">${[...Array(n)].map((_,i)=>`<i style="left:${(i*37+11)%96}%;top:${(i*53)%44+6}%;animation-delay:${((i*.37)%2.6).toFixed(2)}s;transform:scale(${.6+(i%3)*.25})"></i>`).join('')}</div>`}
function vicEndA(){
  const won=vstate==='won';
  const rays = won ? 'repeating-conic-gradient(from 0deg, rgba(255,217,122,.55) 0 8deg, rgba(255,217,122,0) 8deg 20deg)' : 'repeating-conic-gradient(from 0deg, rgba(224,82,74,.35) 0 8deg, rgba(224,82,74,0) 8deg 20deg)';
  return `<div class="vwin"><div class="vw-bg" style="background-image:url(${MAPBG})"></div>
    <div class="vw-tint" style="background:${won?'linear-gradient(rgba(255,196,90,.35),rgba(18,37,54,.75) 70%)':'linear-gradient(rgba(60,20,30,.55),rgba(12,22,34,.9) 70%)'}"></div>
    <div class="vw-rays" style="background:${rays};-webkit-mask:radial-gradient(circle,#000 20%,transparent 62%);mask:radial-gradient(circle,#000 20%,transparent 62%)"></div>
    ${won?sparks(16):''}
    <div class="vw-port lport" style="--ring:${won?'var(--yellow)':'var(--gre)'};background-image:url(${won?ART.p_Nebuchadnezzar:ART.p_Alexander});background-color:${won?'var(--bab)':'var(--gre)'}"></div>
    <div class="vw-badge" style="background:${won?'var(--yellow)':VCOL.Domination}">${ic(won?'v_Scientific':'v_Domination',`color:${won?'var(--yellow-ink)':'#fff'}`)}</div>
    ${sbar}
    <div class="ws-card"><div class="ws-title ${won?'':'lost'}">${won?'Scientific Victory':'Greece has won'}</div>
      <div class="ws-sub">${won?'Nebuchadnezzar II of Babylon':'Domination Victory · Alexander took every capital'}</div>
      <div class="ws-fx">${won?`<span class="chip w">${ic('Apollo Program')}Apollo Program</span><span class="chip">${ic('SS Booster')}6 of 6 parts</span>`:`<span class="chip">${ic('n_Babylon')}Babylon captured</span>`}</div>
      <div class="quote" style="margin-top:12px">${won?VSTR.Scientific:VSTR.defeat}</div>
      <button class="big" style="margin-top:16px">${ic('New')}Start new game</button><button class="ghost" style="margin-top:8px" data-vstate="game">One more turn...!</button></div></div>`;
}

/* B: standings first */
const RANK = [ // [label, icon, you, Greece] : you and Greece at turn 58
  ['Score',ic('Score','color:#e0524a'),212,248],['Population',img('Population'),11,12],['Technologies',st('sci'),8,7],['Gold',st('gold'),142,96],
  ['Happiness',st('hap'),7,4],['Culture',st('cul'),4,6],['Production',st('prod'),15,17],['Territory',ic('Hexagon'),38,44],['Force',ic('Shield'),61,88],
];
function vicB(){
  if(vstate!=='game') return vicEndB();
  const tab=UI.vbTab;
  const pod=`<div class="pod"><div class="podc">${lp('Greece')}<b>248</b><span>Greece</span><span class="rk">1st</span></div>
    <div class="podc me">${lp('Babylon')}<b>212</b><span>You</span><span class="rk">2nd</span></div>
    <div class="podc unk">${lp('Random')}<b>?</b><span>2 not met</span><span class="rk">&nbsp;</span></div></div>`;
  const ranks = RANK.map(([l,i,a,b])=>`<div class="rkrow">${i}<span class="nm">${l}</span><span class="vals"><span class="vpill me ${a>=b?'win':''}">${a}</span><span class="vpill ${b>a?'win':''}" style="color:#ffb1aa">${b}</span></span></div>`).join('');
  const tiles = `<div class="vgrid">${VIC.map((x,k)=>`<div class="vtile ${k===0?'best':''}"><div class="top">${ic('v_'+x.v,`color:${k===0?'var(--yellow)':'#fff'}`)}${x.v}</div><div class="n">${x.done}<small> of ${x.total}</small></div><div class="s">${x.next.replace(/<[^>]+>/g,'').split(' · ')[0]}</div></div>`).join('')}</div>
     <div class="bon" style="margin-top:10px"><div class="bd"><b style="color:var(--yellow)">Babylon leans Scientific.</b> Ingenuity makes Great Scientists 50% faster.</div></div>`;
  return `<div class="vb">${sbar}${vicHeader()}
    <div class="scroll" style="padding-top:2px">${pod}
      ${tab==='rank'?`<div class="h3"><span>Rankings</span><span style="margin-left:auto;display:flex;gap:6px"><span class="vpill me" style="min-width:52px">You</span><span class="vpill" style="min-width:52px;color:#ffb1aa">Greece</span></span></div>${ranks}`:tiles}
    </div>
    <div style="flex:none;padding:8px 12px 34px;background:#0f2030;border-top:1px solid var(--line)"><div class="segb">
      <button class="${tab==='rank'?'on':''}" data-vbtab="rank">${ic('vs_Rankings')}Rankings</button><button class="${tab==='vic'?'on':''}" data-vbtab="vic">${ic('vs_OurStatus')}Victories</button></div></div></div>`;
}
function chart(){
  const civs=[['Babylon','#2f7fe0',[0,30,70,140,212,300,420,560,700,820]],['Greece','#e0524a',[0,34,80,160,248,330,430,520,610,690]],['Egypt','#e8cf2a',[0,26,60,120,180,250,330,400,470,520]],['Persia','#c24a2a',[0,28,64,118,170,220,260,300,320,330]]];
  const lost=vstate==='lost'; if(lost){civs[1][2]=[0,34,80,160,248,340,470,610,760,905];civs[0][2]=[0,30,70,140,212,280,340,380,300,0];}
  const W=340,H=140,mx=920,px=i=>i/9*W,py=v=>H-v/mx*(H-10);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${[.25,.5,.75].map(f=>`<line x1="0" x2="${W}" y1="${H*f}" y2="${H*f}" stroke="rgba(255,255,255,.08)"/>`).join('')}
    ${civs.map(([n,c,d])=>`<polyline points="${d.map((v,i)=>px(i)+','+py(v)).join(' ')}" fill="none" stroke="${c}" stroke-width="${n==='Babylon'?4:2.5}" stroke-linejoin="round" stroke-linecap="round"/>`).join('')}</svg>
    <div class="legend">${civs.map(([n,c])=>`<span><i style="background:${c}"></i>${n}</span>`).join('')}<span style="margin-left:auto">Score by turn</span></div></div>`;
}
function vicEndB(){
  const won=vstate==='won';
  const rows = won ? [['Babylon',1204,'Scientific'],['Greece',1011,''],['Egypt',772,''],['Persia',498,'']] : [['Greece',1320,'Domination'],['Egypt',702,''],['Persia',455,''],['Babylon',0,'Capital lost']];
  return `<div class="vb">${sbar}
    <div class="fin-head fade-in"><div class="fin-medal" style="background:${won?'var(--yellow)':VCOL.Domination}">${ic(won?'v_Scientific':'v_Domination',`color:${won?'var(--yellow-ink)':'#fff'}`)}</div>
      <div><div class="fin-t" style="color:${won?'#ffd97a':'#fff'}">${won?'You have won a Scientific Victory!':'Greece has won a Domination Victory!'}</div><div class="sh-sub" style="margin-top:4px"><span>Prince</span><span>Standard</span></div></div></div>
    <div class="scroll" style="padding-top:4px">
      <div class="h3" style="margin-top:0">Final standings</div>
      ${rows.map(([c,s,v],k)=>`<div class="frow ${c==='Babylon'?'me':''}"><span class="pos">${k+1}</span>${lp(c)}<div><div class="rname">${c==='Babylon'?'Babylon (you)':c}</div><div class="rsub">${CIV[c].l}${v?` · ${v}`:''}</div></div><span class="fsc">${s}</span></div>`).join('')}
      <div class="h3">Score through the game</div>${chart()}
      <div class="quote" style="margin-top:12px">${won?VSTR.Scientific:VSTR.defeat}</div>
    </div>
    <div style="flex:none;display:flex;gap:8px;padding:10px 14px 34px;background:var(--navy2);border-radius:22px 22px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.3)">
      <button class="ghost" style="min-height:60px" data-vstate="game">One more turn...!</button><button class="big">${ic('New')}New game</button></div></div>`;
}

/* ---------- canvas ---------- */
function screenFor(){
  const k=cs+'-'+dir;
  return ({'setup-A':setupA,'setup-B':setupB,'setup-C':setupC,'cs-A':csA,'cs-B':csB,'vic-A':vicA,'vic-B':vicB})[k]();
}
function draw(keep){
  const sc=document.querySelector('#screen .scroll'), pos=keep&&sc?sc.scrollTop:0;
  const strip=document.getElementById('strip'), spos=strip?strip.scrollLeft:null;
  const ps=document.querySelector('.pick .scroll'), ppos=keep&&ps?ps.scrollTop:0;
  document.getElementById('screen').innerHTML=screenFor();
  document.getElementById('sseg').innerHTML=Object.entries(SCREENS).map(([k,l])=>`<button aria-pressed="${k===cs}" data-scr="${k}">${l}</button>`).join('');
  document.getElementById('dseg').innerHTML=DIRS[cs].map(d=>`<button aria-pressed="${d===dir}" data-dir="${d}">${d}</button>`).join('');
  const vs=document.getElementById('vseg'); vs.style.display=cs==='vic'?'':'none';
  vs.innerHTML=[['game','In game'],['won','Won'],['lost','Lost']].map(([k,l])=>`<button aria-pressed="${k===vstate}" data-vstate="${k}">${l}</button>`).join('');
  document.getElementById('thesis').textContent=THESIS[cs+'-'+dir];
  localStorage.setItem('scv-s',cs); localStorage.setItem('scv-d',dir);
  const nsc=document.querySelector('#screen .scroll'); if(keep&&nsc) nsc.scrollTop=pos;
  const nps=document.querySelector('.pick .scroll'); if(keep&&nps) nps.scrollTop=ppos;
  const ns=document.getElementById('strip'); if(ns){ if(spos!=null&&keep==='strip') ns.scrollLeft=spos; else { const on=ns.querySelector('.on'); if(on) ns.scrollLeft=on.offsetLeft-393/2+27; } }
  fit();
}
function fit(){
  const d=document.getElementById('device'), wrap=document.getElementById('stagewrap');
  const narrow=innerWidth<520; d.classList.toggle('bare',narrow);
  const pad=narrow?0:28; const sc=Math.min((wrap.clientWidth-pad)/393,(wrap.clientHeight-pad)/852,1.25);
  d.style.transform=`scale(${sc})`; d.style.marginTop=narrow?'0':'12px';
}
document.addEventListener('click',e=>{
  const q=s=>e.target.closest(s);
  let b;
  if(b=q('[data-scr]')){cs=b.dataset.scr; if(!DIRS[cs].includes(dir)) dir='A'; UI.pick=null; UI.csSheet=null; return draw();}
  if(b=q('[data-dir]')){dir=b.dataset.dir; UI.pick=null; UI.csSheet=null; return draw();}
  if(b=q('[data-vstate]')){vstate=b.dataset.vstate; return draw();}
  if(q('[data-close]')){UI.pick=null; UI.csSheet=null; return draw(true);}
  if(b=q('[data-pick]')){UI.pick=b.dataset.pick; return draw();}
  if(b=q('[data-set]')){const [k,v]=b.dataset.set.split('|'); G[k]=v; UI.preset=null; return draw(b.closest('#strip')?'strip':true);}
  if(b=q('[data-civstep]')){const i=civList.indexOf(G.civ); G.civ=civList[(i+ +b.dataset.civstep+civList.length)%civList.length]; return draw();}
  if(b=q('[data-step]')){const [k,d,mn,mx]=b.dataset.step.split('|'); const inc=k==='maxTurns'?50:1; G[k]=Math.max(+mn,Math.min(+mx,G[k]+d*inc)); UI.preset=null; return draw(true);}
  if(b=q('[data-vic]')){const v=b.dataset.vic; G.vic[v]=G.vic[v]?0:1; return draw(true);}
  if(b=q('[data-adv]')){const k=b.dataset.adv; G.adv[k]=G.adv[k]?0:1; return draw(true);}
  if(b=q('[data-stepnav]')){UI.step=Math.max(0,Math.min(2,UI.step+ +b.dataset.stepnav)); return draw();}
  if(b=q('[data-preset]')){const p=PRESETS.find(x=>x[0]===b.dataset.preset); Object.assign(G,p[3]); UI.preset=p[0]; return draw(true);}
  if(q('[data-last]')){Object.assign(G,LAST); UI.preset='std'; return draw(true);}
  if(b=q('[data-acc]')){UI.acc=UI.acc===b.dataset.acc?null:b.dataset.acc; return draw(true);}
  if(q('[data-start]')) return;
  if(b=q('[data-cstab]')){UI.csTab=b.dataset.cstab; return draw();}
  if(b=q('[data-cssheet]')){UI.csSheet=b.dataset.cssheet; return draw(true);}
  if(b=q('[data-way]')){UI.way=UI.way===b.dataset.way?null:b.dataset.way; return draw(true);}
  if(b=q('[data-vopen]')){UI.vOpen=UI.vOpen===b.dataset.vopen?null:b.dataset.vopen; return draw(true);}
  if(b=q('[data-vbtab]')){UI.vbTab=b.dataset.vbtab; return draw();}
});
addEventListener('resize',fit);
draw();
</script>
</body>
</html>
