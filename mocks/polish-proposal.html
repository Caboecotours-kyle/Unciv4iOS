<!doctype html>
<!-- Motion set and info sheets. Iterates motion-proposal.html: same palette, hex grammar, sprite recolor and HUD. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unciv portrait: actions and polish</title>
<style>
:root{
  --navy:#132435;--navy2:#1c3249;--navy3:#29465d;--panel:rgba(16,31,47,.92);--sheet:rgba(16,31,47,.97);--line:rgba(255,255,255,.12);
  --ink:#fff;--ink2:#b7cde0;--yellow:#ffc93c;--yellow-ink:#3a2a00;--lock:#ffe28b;
  --gre:#418dfe;--mon:#ff7800;--bar:#c8261f;--food:#6fd05a;--prod:#f08a2c;--gold:#ffc93c;
  --r:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0b1622;color:var(--ink);font-family:var(--r);-webkit-font-smoothing:antialiased}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;overflow:hidden}
button,select{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:none}
button:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.chrome{width:100%;display:flex;align-items:center;justify-content:center;gap:8px 14px;flex-wrap:wrap;padding:12px 14px 8px;flex:none;z-index:2}
.scenes{display:flex;max-width:100%;overflow-x:auto;scrollbar-width:none;background:#16283a;border-radius:14px;padding:3px}
.scenes::-webkit-scrollbar{display:none}
.scenes button{color:var(--ink2);min-height:42px;padding:8px 12px;border-radius:11px;font-size:14px;font-weight:900;white-space:nowrap}
.scenes button[aria-selected=true]{background:#fff;color:var(--navy)}
.scenes .sep{width:1px;background:#33495e;margin:8px 4px;flex:none}
.tools{display:flex;align-items:center;gap:8px}
.tool,.variant{height:42px;background:#1c3249;color:#fff;border-radius:12px;padding:0 13px;font-size:13.5px;font-weight:800}
.tool{display:flex;align-items:center;gap:7px}
.tool svg{width:18px;height:18px}
.variant[hidden]{display:none}
.motion-switch{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:800;color:var(--ink2);cursor:pointer;white-space:nowrap}
.motion-switch input{appearance:none;width:38px;height:24px;background:#496077;border-radius:12px;position:relative;margin:0;cursor:pointer}
.motion-switch input::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .18s}
.motion-switch input:checked{background:var(--yellow)}
.motion-switch input:checked::after{transform:translateX(14px)}
.caption{width:100%;text-align:center;min-height:18px;color:var(--ink2);font-size:13px;font-weight:700}
.workspace{width:100%;flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center;padding:8px 12px 24px;overflow:hidden}
.viewport{position:relative;flex:none;width:calc(393px * var(--scale,1));height:calc(852px * var(--scale,1))}
.phone{position:absolute;top:0;left:0;width:393px;height:852px;overflow:hidden;border-radius:54px;background:#e4edf4;transform:scale(var(--scale,1));transform-origin:top left;box-shadow:0 0 0 10px #05090e,0 0 0 11px #2a3b4d,0 30px 60px rgba(0,0,0,.5)}
.phone.bare{border-radius:0;box-shadow:none}
.screen{position:absolute;inset:0;overflow:hidden}
.world{position:absolute;inset:0;width:393px;height:852px}
.world text{font-family:var(--r)}
.world .selected{fill:none;stroke:#fff;stroke-width:3.5;stroke-linejoin:round;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.world .border{stroke:var(--gre);stroke-width:4;stroke-linecap:round;fill:none}
.top-shade{position:absolute;top:0;left:0;right:0;height:130px;background:linear-gradient(rgba(10,22,34,.6),transparent);pointer-events:none}
.bottom-shade{position:absolute;left:0;right:0;bottom:0;height:330px;background:linear-gradient(transparent,rgba(10,22,34,.5) 55%,rgba(10,22,34,.85));pointer-events:none}
.status-bar{position:absolute;top:0;left:0;right:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:7px 34px 0 42px;font-size:16px;font-weight:800;z-index:9}
.signal{display:flex;gap:3px;align-items:end}.signal i{width:4px;background:#fff;border-radius:2px}
.signal i:nth-child(1){height:6px}.signal i:nth-child(2){height:9px}.signal i:nth-child(3){height:12px}
.status-right{display:flex;align-items:center;gap:9px}
.battery{width:26px;height:12px;border:1.5px solid #fff;border-radius:4px;position:relative}
.battery::before{content:"";position:absolute;left:2px;top:2px;bottom:2px;right:5px;border-radius:1px;background:#fff}
.stats{position:absolute;z-index:4;top:54px;left:10px;right:10px;height:50px;background:var(--panel);border-radius:16px;display:flex;align-items:center;gap:13px;padding:0 13px;box-shadow:0 4px 14px rgba(0,0,0,.22);white-space:nowrap}
.stat{display:flex;align-items:center;gap:5px;font-size:17px;font-weight:900}
.stat small{font-size:12px;color:var(--ink2);font-weight:700}
.stat svg{width:19px;height:19px}
.stats .turn{margin-left:auto;background:rgba(255,255,255,.1);height:38px;border-radius:12px;padding:0 10px;display:grid;place-items:center;font-size:14px;font-weight:900}
.unit-head{position:absolute;z-index:4;left:10px;right:10px;top:112px;background:var(--panel);border-radius:18px;display:flex;align-items:center;gap:12px;padding:10px;min-height:72px;box-shadow:0 6px 18px rgba(0,0,0,.25);text-align:left}
.avatar{width:49px;height:49px;border-radius:50%;background:var(--gre);display:grid;place-items:center;flex:none;overflow:hidden;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.avatar img{width:47px;height:47px;object-fit:contain;transform:translateY(5px)}
.unit-head strong{display:block;font-size:19px;font-weight:900;line-height:1.1}
.sub{color:var(--ink2);font-size:14px;font-weight:800;margin-top:3px}
.head-right{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:900;color:#aaf19d}
.head-right svg{width:18px;height:18px;stroke:var(--ink2);stroke-width:2.5;fill:none;stroke-linecap:round}
/* Unit dock: the approved arc from Skip. */
.dock{position:absolute;left:0;right:0;bottom:0;height:235px;z-index:5}
.action{position:absolute;width:54px;height:54px;border-radius:50%;background:#eef5fb;color:var(--navy);display:grid;place-items:center;box-shadow:0 4px 0 #b9cadb,0 8px 17px rgba(0,0,0,.24)}
.action svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.action.a1{right:149px;bottom:55px}.action.a2{right:131px;bottom:117px}.action.a3{right:80px;bottom:157px}.action.a4{right:16px;bottom:163px}
.action.active{box-shadow:0 0 0 3px var(--yellow),0 4px 0 #b9cadb,0 8px 17px rgba(0,0,0,.24)}
.big{position:absolute;right:18px;bottom:34px;width:96px;height:96px;border-radius:50%;background:var(--yellow);color:var(--yellow-ink);box-shadow:0 5px 0 #c9951c,0 10px 20px rgba(0,0,0,.27);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:15px;font-weight:900;transition:background .25s,color .25s,box-shadow .25s}
.big svg{width:32px;height:32px;stroke:currentColor;stroke-width:2.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.big .badge{position:absolute;top:-3px;right:-3px;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:14px;border:2px solid #0b1622}
/* Waiting: the Next disc becomes a quiet navy clock ring while others move. */
.big.waiting{background:#1c3249;color:#dce9f4;box-shadow:0 5px 0 #0c1824,0 10px 20px rgba(0,0,0,.27);cursor:default}
.big .ring{position:absolute;inset:-6px;width:108px;height:108px;overflow:visible;opacity:0;transition:opacity .2s}
.big.waiting .ring{opacity:1}
.big .ring circle{fill:none;stroke:var(--mon);stroke-width:5;stroke-linecap:round;stroke-dasharray:70 270;transform-origin:54px 54px}
.big .pulse{position:absolute;inset:0;border-radius:50%;border:4px solid var(--yellow);opacity:0}
.left-disc{position:absolute;bottom:40px;width:66px;height:66px;border-radius:50%;background:var(--navy2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#dce9f4;box-shadow:0 6px 14px rgba(0,0,0,.25)}
.left-disc svg{width:26px;height:26px;stroke:#dce9f4;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* Turn strip: only while other civs move. */
.turn-strip{opacity:0;position:absolute;z-index:6;top:112px;left:50%;height:52px;border-radius:26px;background:var(--panel);display:flex;align-items:center;gap:10px;padding:0 16px 0 8px;box-shadow:0 6px 18px rgba(0,0,0,.25);transform:translate(-50%,-90px);white-space:nowrap}
.turn-strip .civs{display:flex;gap:6px}
.turn-strip .civ{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:3px solid transparent;transition:transform .25s,opacity .25s,border-color .25s}
.turn-strip .civ svg{width:18px;height:18px}
.turn-strip .civ.done{opacity:.4}
.turn-strip .civ.now{border-color:#fff;transform:scale(1.12)}
.turn-strip strong{font-size:16px;font-weight:900}
.toast{opacity:0;position:absolute;z-index:7;left:50%;top:120px;height:56px;padding:0 24px;border-radius:28px;background:var(--yellow);color:var(--yellow-ink);display:flex;align-items:center;gap:10px;font-size:19px;font-weight:900;transform:translate(-50%,-110px);box-shadow:0 6px 0 #c9951c,0 12px 24px rgba(0,0,0,.3);white-space:nowrap}
.toast small{font-size:14px;opacity:.7}
.map-chip{position:absolute;z-index:3;height:30px;padding:0 12px;border-radius:15px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:900;white-space:nowrap;transform:translate(-50%,0);box-shadow:0 4px 10px rgba(0,0,0,.25);opacity:0}
.city-banner{position:absolute;z-index:3;height:28px;border-radius:14px;background:#fff;color:var(--navy);display:flex;align-items:center;gap:6px;padding:0 10px 0 3px;font-size:15px;font-weight:900;transform:translate(-50%,0);box-shadow:0 3px 8px rgba(0,0,0,.25);white-space:nowrap}
.city-banner span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--gre);color:#fff;font-size:13px}
/* Info sheets. */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:8;background:var(--sheet);border-radius:28px 28px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.32);padding:0 16px 30px;transition:transform .42s cubic-bezier(.16,1,.3,1)}
.sheet.closed{transform:translateY(105%)}
.grab{width:44px;height:5px;background:rgba(255,255,255,.34);border-radius:4px;margin:9px auto 12px}
.sheet-head{display:flex;align-items:center;gap:13px}
.sheet-head strong{display:block;font-size:22px;font-weight:900;line-height:1.1}
.close{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;margin-left:auto;flex:none}
.close svg{width:20px;height:20px;stroke:#fff;stroke-width:2.6;stroke-linecap:round}
.hex-thumb{width:64px;height:56px;flex:none;overflow:visible}
.yields{display:flex;gap:8px;margin:14px 0 6px}
.yield{height:44px;min-width:70px;padding:0 14px;border-radius:14px;background:var(--navy2);display:flex;align-items:center;gap:8px;font-size:20px;font-weight:900}
.yield svg{width:22px;height:22px}
.rows{margin-top:4px}
.row{width:100%;min-height:56px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);text-align:left;font-size:17px;font-weight:850}
.row:last-child{border-bottom:0}
.row .ico{width:40px;height:40px;border-radius:12px;background:var(--navy2);display:grid;place-items:center;flex:none;overflow:hidden}
.row .ico img{width:36px;height:36px;object-fit:contain}
.row .ico.round{border-radius:50%;background:var(--gre)}
.row .ico.round img{transform:translateY(4px)}
.row .ico svg{width:22px;height:22px;stroke:#dce9f4;stroke-width:2.3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.row .meta{display:block;color:var(--ink2);font-size:13px;font-weight:800;margin-top:2px}
.row .end{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:14px;font-weight:900;white-space:nowrap}
.row .chev{width:16px;height:16px;stroke:#6f89a0;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pill{height:30px;padding:0 10px;border-radius:10px;display:flex;align-items:center;gap:5px;font-size:13px;font-weight:900}
.pill.lock{background:rgba(255,201,60,.16);color:var(--lock)}
.pill.lock svg{width:14px;height:14px;stroke:var(--lock);stroke-width:2.4;fill:none}
.pill.good{background:rgba(111,208,90,.15);color:#aff2a5}
.pill.plain{background:rgba(255,255,255,.1);color:#fff}
.hp{width:84px;height:8px;border-radius:4px;background:#0c1824;overflow:hidden}
.hp i{display:block;height:100%;background:#6fd05a;border-radius:4px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 8px}
.stat-box{background:var(--navy2);border-radius:15px;padding:10px 12px;min-height:68px}
.stat-box b{display:block;font-size:22px;font-weight:900}
.stat-box span{color:var(--ink2);font-size:13px;font-weight:800}
.hpbar{height:12px;border-radius:6px;background:#0c1824;overflow:hidden;margin-top:12px}
.hpbar i{display:block;height:100%;width:74%;background:linear-gradient(90deg,#6fd05a,#a6ea6b);border-radius:6px}
.hp-caption{display:flex;justify-content:space-between;margin-top:6px;color:var(--ink2);font-size:13px;font-weight:800}
.primary{width:100%;height:56px;border-radius:18px;background:var(--yellow);color:var(--yellow-ink);font-size:18px;font-weight:900;margin-top:12px;box-shadow:0 4px 0 #c9951c}
/* City sheet, matched to the shipped 4.23.0 layout. */
.city-sheet{position:absolute;left:0;right:0;bottom:0;top:250px;z-index:8;background:var(--sheet);border-radius:28px 28px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.32);overflow:hidden}
.city-top{padding:0 16px}
.city-title{display:flex;align-items:center;gap:12px}
.pop{width:52px;height:52px;border-radius:50%;background:var(--gre);display:grid;place-items:center;font-size:22px;font-weight:900;flex:none}
.city-title strong{font-size:24px;font-weight:900;display:block;line-height:1.1}
.city-yields{display:grid;grid-template-columns:repeat(6,1fr);text-align:center;padding:12px 0 10px;border-bottom:1px solid var(--line);font-size:16px;font-weight:900}
.city-yields svg{width:22px;height:22px;display:block;margin:0 auto 3px}
.city-body{padding:12px 16px 0}
.back{height:44px;border-radius:12px;background:rgba(255,255,255,.07);display:flex;align-items:center;gap:6px;padding:0 12px;font-size:15px;font-weight:900;color:var(--ink2);width:auto}
.back svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
.tile-hero{display:flex;align-items:center;gap:13px;margin-top:8px}
.tile-hero strong{font-size:21px;font-weight:900;display:block}
.tabbar{position:absolute;left:10px;right:10px;bottom:14px;height:76px;border-radius:22px;background:#1a2e42;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;text-align:center;font-size:12px;font-weight:800;color:var(--ink2)}
.tabbar span{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:16px;margin:0 3px}
.tabbar span.on{background:var(--navy3);color:#fff}
.tabbar svg{width:24px;height:24px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* Button styles under review. "now" reproduces the shipped offset shadow. */
.screen.bs-now .action{box-shadow:0 4px 0 #b9cadb}
.screen.bs-now .big{box-shadow:0 5px 0 #c9951c}
.screen.bs-now .left-disc{box-shadow:0 5px 0 #0b1826}
.screen.bs-a .action,.screen.bs-a .big,.screen.bs-a .left-disc{box-shadow:0 2px 10px rgba(7,17,28,.28)}
.screen.bs-b .action{box-shadow:inset 0 0 0 2.5px #c7d6e4,0 1px 3px rgba(7,17,28,.2)}
.screen.bs-b .big{box-shadow:inset 0 0 0 3px #e3a91d,0 1px 3px rgba(7,17,28,.2)}
.screen.bs-b .left-disc{box-shadow:inset 0 0 0 2.5px #2c4862,0 1px 3px rgba(7,17,28,.2)}
.screen.bs-c .action{background:radial-gradient(circle at 36% 30%,#fff 0,#eef5fb 42%,#cfdce8 100%);box-shadow:0 3px 9px rgba(7,17,28,.26)}
.screen.bs-c .big{background:radial-gradient(circle at 36% 30%,#ffe58f 0,#ffc93c 45%,#e8a916 100%);box-shadow:0 4px 12px rgba(7,17,28,.3)}
.screen.bs-c .left-disc{background:radial-gradient(circle at 36% 30%,#2d4a66 0,#1c3249 50%,#132435 100%);box-shadow:0 3px 9px rgba(7,17,28,.26)}
.screen[class*="bs-"] .action:active,.screen[class*="bs-"] .big:active{transform:scale(.94)}
.home-ind{position:absolute;left:50%;bottom:8px;width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.85);transform:translateX(-50%);z-index:20}
.city-sheet.before{bottom:34px;border-radius:28px}
.city-sheet.before .tabbar{bottom:10px}
.city-sheet.after{bottom:0;border-radius:28px 28px 0 0}
.city-sheet.after .tabbar{bottom:34px}
.gap-callout{position:absolute;left:12px;right:12px;bottom:4px;height:28px;border:2px dashed #ff6b5e;border-radius:10px;z-index:21;pointer-events:none}
.progress-badge{position:absolute;z-index:3;width:34px;height:34px;transform:translate(-50%,-50%)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media (max-width:680px){.chrome{padding-top:8px;gap:6px 8px}.tools{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="chrome">
  <div class="scenes" role="tablist" aria-label="Proposal scenes">
    <button type="button" role="tab" data-scene="buttons">Buttons</button>
    <button type="button" role="tab" data-scene="drawers">Drawers</button>
    <button type="button" role="tab" data-scene="theirturn">Their turn HUD</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" role="tab" data-scene="actions">Unit actions</button>
  </div>
  <div class="tools">
    <button type="button" class="tool" id="replay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5"/></svg>Replay</button>
    <select class="variant" id="variant" aria-label="Variant" hidden></select>
    <label class="motion-switch"><input type="checkbox" id="reduce">Reduce motion</label>
  </div>
  <div class="caption" id="caption" aria-live="polite"></div>
</div>
<main class="workspace"><div class="viewport" id="viewport"><div class="phone" id="phone"><div class="screen" id="screen"></div></div></div></main>
<div id="announce" class="sr" aria-live="polite"></div>
<script>
const CAPTION={
  buttons:'Every round button loses the offset circle that made it read as an oval. Pick a style; Now is the shipped look for comparison.',
  drawers:'Every sheet runs to the bottom edge: square bottom, background behind the home bar, 28pt top corners, grab handle, swipe down.',
  theirturn:'While other civs move, the unit card and action buttons step aside and the turn strip takes the card slot.',
  actions:'Each unit action gets a short whole-sprite reaction, plus a build progress ring on the tile while a worker works.'
};
const VARIANTS={buttons:[['a','A  Flat, soft shadow'],['b','B  Flat, rim'],['c','C  Soft sphere'],['now','Now (shipped)']],
  drawers:[['after','After'],['before','Before (shipped)']],
  theirturn:[['after','After'],['before','Before (shipped)']],
  actions:[['build','Build improvement'],['fortify','Fortify'],['sleep','Sleep'],['heal','Heal'],['pillage','Pillage'],['promote','Promote'],['upgrade','Upgrade'],['disband','Disband'],['great','Great person']]};
const ICON={
  move:'<path d="M4 12h15m-6-6 6 6-6 6"/>',
  attack:'<path d="M12 3v5m0 8v5M3 12h5m8 0h5"/><circle cx="12" cy="12" r="3"/>',
  fortify:'<path d="M12 3 20 6v6c0 5-3.5 7.7-8 9-4.5-1.3-8-4-8-9V6z"/>',
  more:'<circle cx="5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.5" fill="currentColor" stroke="none"/>',
  skip:'<path d="M4.5 12a7.5 7.5 0 0 1 12.8-5.3L20 9.4M20 4v5.4h-5.4"/><path d="M19.5 12a7.5 7.5 0 0 1-12.8 5.3L4 14.6M4 20v-5.4h5.4"/>',
  next:'<path d="M8 5v14l11-7z" fill="currentColor"/>',
  close:'<path d="M5 5l14 14M19 5 5 19"/>',
  flag:'<path d="M6 21V4m0 1h11l-2 4 2 4H6"/>',
  sleep:'<path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z"/>',
  chev:'<path d="M9 5l7 7-7 7"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',

const CIV={gre:[65,141,254],mon:[255,120,0],bar:[200,38,31]};
const CIVHEX={gre:'#418dfe',mon:'#ff7800',bar:'#c8261f',bab:'#1b353f',egy:'#5300d0'};

const screen=document.getElementById('screen');
const R=50,SQ=.6,W=Math.sqrt(3)*R,DY=45,X0=-25,Y0=122;
const TERRA={grass:['#88cd50','#7dc248','#5f9a36'],plains:['#e3ca52','#d9be47','#b39532'],coast:['#3fb5e3','#37a8d7','#2d8daf'],ocean:['#2f7ad6','#2a6fc6','#215a9c'],desert:['#eba45b','#e0974d','#b8763a'],mountain:['#a3acb6','#959ea9','#737c87']};
const key=(c,r)=>`${c},${r}`;
const center=(c,r)=>[X0+W*(c+(r&1?.5:0)),Y0+DY*r];
const corners=(x,y,s=1)=>Array.from({length:6},(_,i)=>{const a=(60*i-90)*Math.PI/180;return [x+R*s*Math.cos(a),y+R*SQ*s*Math.sin(a)]});
const pts=a=>a.map(([x,y])=>`${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
const cube=(c,r)=>[c-(r-(r&1))/2,r];
const dist=(a,b)=>{const [q,r]=cube(...a),[s,t]=cube(...b);return Math.max(Math.abs(q-s),Math.abs(r-t),Math.abs(q-s+r-t))};
const DIRS=[[1,-1],[1,0],[0,1],[-1,1],[-1,0],[0,-1]];
const nbr=(c,r,i)=>{const [q,rr]=cube(c,r),[dq,dr]=DIRS[i];const nr=rr+dr;return [q+dq+(nr-(nr&1))/2,nr]};
function terrain(c,r){
  if(r>=12&&c<=4)return 'ocean';
  if(r>=9&&c<=2||r>=11)return 'coast';
  if(c===5&&r===2||c===-1&&r===5)return 'mountain';
  if(c===2&&r===3||c===3&&r===4)return 'desert';
  if((c+r*2)%7===1||c===4&&r===5)return 'plains';
  if(c>=5&&r<=5)return 'desert';
  return 'grass';
}
function slab(c,r){
  const [x,y]=center(c,r),cs=corners(x,y),[lit,shade,side]=TERRA[terrain(c,r)],low=p=>[p[0],p[1]+4];
  return `<polygon points="${pts([cs[2],cs[3],low(cs[3]),low(cs[2])])}" fill="${side}"/><polygon points="${pts([cs[3],cs[4],low(cs[4]),low(cs[3])])}" fill="${side}"/><polygon points="${pts(cs)}" fill="${shade}" stroke="rgba(15,44,41,.12)" stroke-width="1.2"/><polygon points="${pts([[x,y-2],cs[4],cs[5],cs[0]])}" fill="${lit}" opacity=".78"/>`;
}
const art=(h,x,y,w,hh)=>`<image href="art/${h}.png" x="${x}" y="${y}" width="${w}" height="${hh}" preserveAspectRatio="xMidYMid meet"/>`;
const DECO={'3,5':['f_forest1',-23,-34,46,46],'5,7':['f_forest2',-20,-31,42,42],'0,6':['f_forest1',-23,-34,46,46],'4,9':['f_forest2',-20,-31,42,42],'1,5':['f_hill1',-24,-26,48,40],'2,3':['f_hill1',-24,-26,48,40],'5,2':['f_mountain1',-25,-34,50,50],'-1,5':['f_mountain1',-25,-34,50,50],'4,4':['f_forest2',-20,-31,42,42]};
const RES={'3,5':['r_Deer',4,-14,24,24],'2,3':['r_Sheep',6,-12,24,24]};
function tileArt(c,r,hide){
  const k=key(c,r);if(hide&&hide.includes(k))return '';
  const [x,y]=center(c,r);let s='';
  if(DECO[k]){const [h,dx,dy,w,hh]=DECO[k];s+=art(h,x+dx,y+dy,w,hh)}
  if(RES[k]){const [h,dx,dy,w,hh]=RES[k];s+=art(h,x+dx,y+dy,w,hh)}
  return s;
}
function world(extra='',hide=[]){
  const t=[],d=[];
  for(let r=-1;r<=16;r++)for(let c=-1;c<=6;c++){const [x,y]=center(c,r);if(x<-70||x>455||y<-65||y>900)continue;t.push(slab(c,r));d.push(tileArt(c,r,hide))}
  return `<svg class="world" viewBox="0 0 393 852"><g id="cam"><rect x="-200" y="-200" width="800" height="1250" fill="#e4edf4"/>${t.join('')}${d.join('')}${extra}<g id="units"></g><g id="fx"></g></g></svg>`;
}
function borderPath(cc,cr,rad=1){
  const own=(c,r)=>dist([c,r],[cc,cr])<=rad,out=[];
  for(let r=cr-rad-1;r<=cr+rad+1;r++)for(let c=cc-rad-1;c<=cc+rad+1;c++){
    if(!own(c,r))continue;const cs=corners(...center(c,r),.99);
    DIRS.forEach((_,i)=>{if(!own(...nbr(c,r,i)))out.push(`M${cs[i][0].toFixed(1)} ${cs[i][1].toFixed(1)}L${cs[(i+1)%6][0].toFixed(1)} ${cs[(i+1)%6][1].toFixed(1)}`)});
  }
  return out.join('');
}
function tint(cc,cr,rad=1){let s='';for(let r=cr-rad;r<=cr+rad;r++)for(let c=cc-rad-1;c<=cc+rad+1;c++)if(dist([c,r],[cc,cr])<=rad)s+=`<polygon points="${pts(corners(...center(c,r),.97))}" fill="rgba(65,141,254,.13)"/>`;return s}

/* Sprites: key green recolored per civ, plus a white flash copy. */
const sprites={};
const loadImage=src=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=src});
async function prep(name){
  const im=await loadImage(`art/${name}.png`),cv=document.createElement('canvas');cv.width=im.width;cv.height=im.height;
  const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0);const raw=ctx.getImageData(0,0,cv.width,cv.height).data;
  let x0=cv.width,y0=cv.height,x1=0,y1=0;
  for(let y=0;y<cv.height;y++)for(let x=0;x<cv.width;x++)if(raw[(y*cv.width+x)*4+3]>24){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}
  const w=x1-x0+1,h=y1-y0+1;sprites[name]={ratio:w/h};
  for(const [civ,col] of [...Object.entries(CIV),['white',null]]){
    const out=ctx.createImageData(w,h),d=out.data;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const s=((y+y0)*cv.width+x+x0)*4,o=(y*w+x)*4;let r=raw[s],g=raw[s+1],b=raw[s+2];
      if(!col){r=g=b=255}else if(g>60&&g>r*1.45&&g>b*1.45){const f=Math.min(1.15,g/255*1.08);r=col[0]*f;g=col[1]*f;b=col[2]*f}
      d[o]=r;d[o+1]=g;d[o+2]=b;d[o+3]=raw[s+3];
    }
    const c2=document.createElement('canvas');c2.width=w;c2.height=h;c2.getContext('2d').putImageData(out,0,0);sprites[name][civ]=c2.toDataURL();
  }
}
const spr=(n,civ='gre')=>sprites[n]?.[civ]||`art/${n}.png`;

/* Unit actors drawn into #units and posed every frame. */
let units={};
function addUnit(id,name,civ,c,r,opts={}){
  const [x,y]=center(c,r),h=opts.h||50,w=Math.round(h*(sprites[name]?.ratio||1));
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.innerHTML=`<ellipse class="shadow" cx="0" cy="2" rx="14" ry="5" fill="rgba(0,0,0,.25)"/><ellipse cx="0" cy="1" rx="13" ry="4.8" fill="none" stroke="${CIVHEX[civ]}" stroke-width="2.6"/><g class="body"><image class="sprite" href="${spr(name,civ)}" x="${-w/2}" y="${-h}" width="${w}" height="${h}"/><image class="flash" href="${spr(name,'white')}" x="${-w/2}" y="${-h}" width="${w}" height="${h}" opacity="0"/></g>`;
  document.getElementById('units').appendChild(g);
  units[id]={g,name,civ,x,y,bx:x,by:y,sx:1,sy:1,lean:0,op:1,flip:opts.flip?-1:1,rot:0,h,w};
  return units[id];
}
function setSprite(u,name){const w=Math.round(u.h*(sprites[name]?.ratio||1));u.name=name;u.w=w;const [a,b]=u.g.querySelectorAll('image');for(const [im,civ] of [[a,u.civ],[b,'white']]){im.setAttribute('href',spr(name,civ));im.setAttribute('x',-w/2);im.setAttribute('width',w)}}
function pose(u){
  u.g.setAttribute('transform',`translate(${u.x.toFixed(2)} ${u.y.toFixed(2)}) rotate(${u.rot.toFixed(2)}) scale(${(u.sx*u.flip).toFixed(3)} ${u.sy.toFixed(3)})`);
  u.g.querySelector('.body').setAttribute('transform',`skewX(${u.lean.toFixed(2)})`);u.g.setAttribute('opacity',u.op.toFixed(3));
}
const ease=p=>1-Math.pow(1-p,3),clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,p)=>a+(b-a)*p;
/* One hop: crouch, airborne arc with lean, squash landing. Returns the pose for progress q. */
function hop(q,from,to,lift=20){
  const dir=to[0]>=from[0]?-1:1;
  if(q<.14){const k=q/.14;return {x:from[0],y:from[1],sx:1+.08*k,sy:1-.14*k,lean:0}}
  if(q<.86){const k=(q-.14)/.72;return {x:lerp(from[0],to[0],ease(k)),y:lerp(from[1],to[1],ease(k))-Math.sin(Math.PI*k)*lift,sx:.95,sy:1.07,lean:6*dir}}
  const k=(q-.86)/.14;return {x:to[0],y:to[1],sx:1+.1*Math.sin(k*Math.PI),sy:1-.16*Math.sin(k*Math.PI),lean:0};
}
function path(u,tiles,t,start,per){
  const hops=tiles.length-1;if(t<start)return false;const i=Math.min(hops-1,Math.floor((t-start)/per)),q=clamp((t-start-i*per)/per);
  if(t>=start+hops*per){const [x,y]=center(...tiles[hops]);Object.assign(u,{x,y,sx:1,sy:1,lean:0});return true}
  Object.assign(u,hop(q,center(...tiles[i]),center(...tiles[i+1])));return false;
}
function breathe(u,t){if(state.reduce)return;const b=Math.sin(t/420);u.sx*=1-b*.012;u.sy*=1+b*.022}

/* Effects. */
let fx=[];
function effect(markup,start,dur,step){const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.innerHTML=markup;g.setAttribute('opacity','0');document.getElementById('fx').appendChild(g);fx.push({g,start,dur,step})}
function dust(x,y,at){for(const dir of [-1,1])effect('<circle r="4" fill="#efe6cf"/><circle cx="5" cy="-2" r="3" fill="#e2d6b8"/>',at,420,(g,p)=>{g.setAttribute('transform',`translate(${x+dir*(7+15*ease(p))} ${y-3*p}) scale(${(.6+.8*p).toFixed(2)})`);g.setAttribute('opacity',1-p)})}
function ringFx(x,y,at,color='#fff',dur=620){effect(`<ellipse rx="20" ry="8" fill="none" stroke="${color}" stroke-width="3"/>`,at,dur,(g,p)=>{g.setAttribute('transform',`translate(${x} ${y}) scale(${(1+1.6*ease(p)).toFixed(2)})`);g.setAttribute('opacity',1-p)})}
function splash(x,y,at){for(let i=0;i<5;i++){const a=-Math.PI*(.15+.7*i/4);effect('<circle r="3.2" fill="#e8f7ff"/>',at,480,(g,p)=>{g.setAttribute('transform',`translate(${x+Math.cos(a)*22*ease(p)} ${y+Math.sin(a)*26*p+30*p*p})`);g.setAttribute('opacity',1-p)})}ringFx(x,y,at,'#e8f7ff',700);ringFx(x,y,at+160,'#bfeaff',700)}
function damage(x,y,at,n){effect(`<text text-anchor="middle" font-size="19" font-weight="900" fill="#fff" stroke="#a8322c" stroke-width="4" paint-order="stroke">−${n}</text>`,at,1000,(g,p)=>{const pop=p<.18?.4+p/.18:p<.3?1.4-.4*(p-.18)/.12:1;g.setAttribute('transform',`translate(${x} ${y-54-20*ease(p)}) scale(${pop})`);g.setAttribute('opacity',p<.7?1:1-(p-.7)/.3)})}
function slash(x,y,at){effect('<path d="M-8 -18Q 9 -26 18 -10" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>',at,260,(g,p)=>{g.setAttribute('transform',`translate(${x} ${y})`);g.setAttribute('opacity',1-p)})}
function puff(x,y,at){for(let i=0;i<7;i++){const a=Math.PI*2*i/7;effect(`<circle r="${5+i%3}" fill="#f2f2ee"/>`,at,560,(g,p)=>{g.setAttribute('transform',`translate(${x+Math.cos(a)*20*ease(p)} ${y-18+Math.sin(a)*12*ease(p)-10*p}) scale(${(1.2-.6*p).toFixed(2)})`);g.setAttribute('opacity',1-p)})}}
function flash(u,t,at){const im=u.g.querySelector('.flash');const h=(t-at)/460;im.setAttribute('opacity',h<0||h>1?0:String(Math.max(0,1-h*1.6)));return h}

    <div class="tabbar">${tabs.map(([i,l])=>`<span class="${l==='Tiles'?'on':''}">${icon(i)}${l}</span>`).join('')}</div></div>`;
}

      else if(v==='promote'){breathe(u,t);flash(u,t,300);if(t>=300&&!state.done.r){state.done.r=1;ringFx(x,y,t,'#ffc93c',800);ringFx(x,y,t+150,'#fff2b5',800);
        effect('<path d="M0-9 2.6-2.8 9.5-2.8 4-1.2 6 6 0 2.2-6 6-4-1.2-9.5-2.8-2.6-2.8z" fill="#ffc93c" stroke="#8c650d" stroke-width="1.2"/>',t,1200,(g,q)=>{g.setAttribute('transform',`translate(${x} ${y-56-16*ease(q)}) scale(${q<.25?.5+2*q:1})`);g.setAttribute('opacity',q<.75?1:1-(q-.75)/.25)})}}
      else if(v==='upgrade'){const h=flash(u,t,400);if(t>=520&&u.name!=='k_swordsman'){setSprite(u,'k_swordsman');ringFx(x,y,t,'#fff',600)}if(h>=0&&h<=1){const s=1+.12*Math.sin(Math.min(1,h)*Math.PI);u.sx=s;u.sy=s}else breathe(u,t)}

  move:{

  embark:{

  combat:{

  }
};
function render(){
  const S=SCENES[state.scene];units={};fx=[];state.done={};state.sheetOpen=true;
  const vs=VARIANTS[state.scene],sel=document.getElementById('variant');sel.hidden=!vs;
  if(vs){if(!vs.some(v=>v[0]===state.variant))state.variant=vs[0][0];sel.innerHTML=vs.map(([v,l])=>`<option value="${v}" ${v===state.variant?'selected':''}>${l}</option>`).join('')}else state.variant='';
  screen.className='screen';state.last=-1;
  screen.innerHTML=S.html();S.setup();
  document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.scene===state.scene)));
  document.getElementById('caption').textContent=CAPTION[state.scene];
  state.start=performance.now();
  if(state.reduce&&S.final){S.frame(1e5);S.final();fx.forEach(f=>f.g.remove());fx=[]}
  for(const u of Object.values(units))pose(u);
  history.replaceState(null,'',`?scene=${state.scene}${state.variant?'&v='+state.variant:''}`);
}
function tick(now){
  const S=SCENES[state.scene],t=FREEZE??now-state.start;if(FREEZE!=null)now=state.start+FREEZE;
  if(!state.reduce||S.still){for(const u of Object.values(units)){u.sx=1;u.sy=1;u.lean=0}S.frame(t)}
  for(const u of Object.values(units))pose(u);
  fx=fx.filter(f=>{const p=(now-state.start-(f.start>1e6?f.start-state.start:f.start))/f.dur;if(!f.g.isConnected)return false;if(p<0)return true;if(p>=1){f.g.remove();return false}f.step(f.g,p);return true});
  requestAnimationFrame(tick);
}
function fit(){
  const ch=document.querySelector('.chrome'),ws=document.querySelector('.workspace');
  const h=Math.max(400,innerHeight-ch.getBoundingClientRect().height-34),w=ws.clientWidth-28;
  const s=Math.min(1,h/852,w/393);document.getElementById('viewport').style.setProperty('--scale',s.toFixed(4));
  document.getElementById('phone').classList.toggle('bare',s>.99&&innerWidth<450);
}
document.querySelector('.scenes').addEventListener('click',e=>{const b=e.target.closest('[data-scene]');if(!b)return;state.scene=b.dataset.scene;render()});
document.getElementById('replay').addEventListener('click',render);
document.getElementById('variant').addEventListener('change',e=>{state.variant=e.target.value;render()});
document.getElementById('reduce').addEventListener('change',e=>{state.reduce=e.target.checked;render()});
screen.addEventListener('click',e=>{
  if(e.target.closest('#close-sheet')){state.sheetOpen=false;document.getElementById('sheet').classList.add('closed');return}
  if(e.target.closest('#open-unit')&&document.getElementById('sheet')){state.sheetOpen=true;document.getElementById('sheet').classList.remove('closed')}
});
addEventListener('resize',fit);
const q=new URLSearchParams(location.search);const FREEZE=q.get('t')?+q.get('t'):null;if(SCENES[q.get('scene')])state.scene=q.get('scene');if(q.get('v'))state.variant=q.get('v');
document.getElementById('reduce').checked=state.reduce;
Promise.allSettled(['k_warrior','k_horseman','k_hoplite','k_hoplite_attack','k_archer','k_settler','k_embarkedunit-military','c_Ancient_medium','k_worker','k_swordsman','k_great general'].map(prep)).then(rs=>{
  rs.forEach((r,i)=>{if(r.status==='rejected')console.warn('sprite missing',i,r.reason)});render();fit();requestAnimationFrame(tick);
});
</script>
