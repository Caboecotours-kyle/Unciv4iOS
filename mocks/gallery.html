<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unciv Portrait: art gallery</title>
<style>
body{margin:0;background:#0b1622;color:#fff;font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;padding:16px 14px 60px}
h1{font-size:26px;margin:4px 0 14px}
h2{font-size:18px;margin:28px 0 10px;color:#b7cde0}
.comps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.comps figure{margin:0}
.comps img{width:100%;border-radius:14px;display:block}
.comps figcaption{font-weight:800;font-size:15px;margin-top:6px}
.comps figcaption small{display:block;font-weight:600;font-size:13px;color:#b7cde0;margin-top:2px}
.sheet{width:100%;border-radius:14px;display:block}
@media (max-width:600px){.comps{grid-template-columns:1fr}}
</style></head><body>
<h1>Art gallery</h1>
<h2>New terrain, direction A</h2><img class="sheet" src="art/preview-map.png" alt="" style="max-width:420px">
<h2>Terrain features (24)</h2><img class="sheet" src="art/contact-features.png" alt="">
<h2>Terrain directions (A chosen)</h2>
<div class="comps">
 <figure><img src="art/tc_A.png" alt="Direction A"><figcaption>A. Flat and crisp<small>Thin slabs, one clean color per terrain, closest to Polytopia</small></figcaption></figure>
 <figure><img src="art/tc_B.png" alt="Direction B"><figcaption>B. Diorama<small>Thick layered earth sides, small ground details, surf on shores</small></figcaption></figure>
 <figure><img src="art/tc_C.png" alt="Direction C"><figcaption>C. Soft and warm<small>Tiles blend, gentle light, sparkling water</small></figcaption></figure>
</div>
<h2>Resources (35)</h2><img class="sheet" src="art/contact-res.png" alt="">
<h2>Improvements (24)</h2><img class="sheet" src="art/contact-imp.png" alt="">
<h2>Natural wonders (14)</h2><img class="sheet" src="art/contact-nw.png" alt="">
<h2>Units</h2><img class="sheet" src="art/contact-units.png" alt="">
<h2>Wonder completed</h2><img class="sheet" src="art/preview-wonder-complete.png" alt="" style="max-width:420px">
<h2>Leaders</h2><img class="sheet" src="art/contact-portraits.png" alt="" style="max-width:620px">
</body></html>
