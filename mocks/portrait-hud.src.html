<!doctype html>
<!--
THESIS: Civ 5 depth played one-handed in portrait. The map owns the screen; every per-turn action lives in the bottom third.
OWN-WORLD: Polytopia grammar: faceted low-poly hex slabs with dirt sides, cloud fog, chunky tribe-colored figures, navy translucent panels, round white action discs, yellow primary, bold rounded type.
STORY: Kyle sees his empire, taps a unit or city, acts with his thumb, ends the turn. Depth (city, tech) rises as sheets over the map.
FIRST VIEWPORT: stat strip under the Dynamic Island, full-bleed map, zoom rail on the left edge, Civ and Tech discs bottom-left, yellow decision button bottom-right.
FORM: chosen direction C Thumb arc, with B's decision queue folded into the corner button and quick-pick cards. Tech tree: Civ 5's real branching tree, eras top to bottom, era tabs in thumb reach.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unciv Portrait: thumb arc</title>
<style>
:root{
  --navy:#132435; --navy2:#1c3249; --panel:rgba(16,31,47,.9); --line:rgba(255,255,255,.12);
  --ink:#fff; --ink2:#b7cde0; --ink3:#7f9ab2;
  --yellow:#ffc93c; --yellow-ink:#3a2a00;
  --bab:#2f7fe0; --gre:#e0524a; --kab:#9a5bd6;
  --food:#6fd05a; --prod:#ff9a3c; --gold:#ffc93c; --sci:#5cc8ff; --cul:#d38bff; --fai:#f3ecd2; --hap:#b8e35a;
  --r:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b1622;color:var(--ink);font-family:var(--r);-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;align-items:center;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* canvas chrome */
.chrome{width:100%;display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;align-items:center;padding:10px 10px 8px;flex:none}
.seg{display:flex;background:#16283a;border-radius:14px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{min-height:40px;padding:8px 13px;border-radius:11px;font-weight:800;font-size:15px;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed=true]{background:#fff;color:var(--navy)}
.thesis{width:100%;text-align:center;font-size:13px;color:var(--ink2);font-weight:600;min-height:18px;padding:0 8px}
.stagewrap{flex:1;width:100%;display:flex;align-items:flex-start;justify-content:center;min-height:0;overflow:hidden}
.device{width:393px;height:852px;position:relative;transform-origin:top center;border-radius:54px;overflow:hidden;flex:none;
  box-shadow:0 0 0 10px #05090e,0 0 0 11px #2a3b4d,0 30px 60px rgba(0,0,0,.5);background:#e4edf4}
.device.bare{border-radius:0;box-shadow:none}

/* phone content */
.screen{position:absolute;inset:0;overflow:hidden}
.map{position:absolute;inset:0;transform-origin:0 0;transition:transform .12s ease-out;touch-action:none;--inv:1;--lab:1}
.map.dragging{transition:none}
.ustrat,.rpin{display:none}
.ustrat,.rpin,.cban{transform-box:fill-box;transform-origin:center}
.map[data-lod=far] .deco,.map[data-lod=far] .kunit,.map[data-lod=far] .rprop,.map[data-lod=far] .pulse{display:none}
.map[data-lod=far] .ustrat,.map[data-lod=far] .rpin{display:inline;transform:scale(var(--inv))}
.cban{transform:scale(var(--lab))}
.map[data-lod=far] .border{stroke-width:5}
.map svg{position:absolute;left:-260px;top:-320px;display:block}
.sbar{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 42px;font-weight:700;font-size:16px;z-index:5}
.sbar .bat{width:26px;height:12px;border:1.5px solid #fff;border-radius:4px;position:relative}
.sbar .bat::after{content:"";position:absolute;inset:1.5px;right:5px;background:#fff;border-radius:1.5px}
.scrim-t{position:absolute;top:0;left:0;right:0;height:130px;background:linear-gradient(rgba(10,22,34,.62),rgba(10,22,34,0));z-index:3;pointer-events:none}
.scrim-b{position:absolute;bottom:0;left:0;right:0;height:250px;background:linear-gradient(to top,rgba(10,22,34,.66),rgba(10,22,34,0));z-index:3;pointer-events:none}

/* icons */
.ic{display:inline-block;width:22px;height:22px;background:currentColor;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;flex:none}
svg.st{width:18px;height:18px;flex:none}

/* stat strip */
.stats{position:absolute;top:54px;left:10px;right:10px;height:50px;background:var(--panel);border-radius:16px;display:flex;align-items:center;padding:0 5px 0 8px;z-index:4;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;font-size:16.5px;padding:0 5px;height:44px;white-space:nowrap}
.stat small{font-size:12.5px;font-weight:700;color:var(--ink2)}
.stats .turn{margin-left:auto;height:40px;background:rgba(255,255,255,.1);border-radius:12px;padding:0 10px;font-size:15px;font-weight:900;display:flex;align-items:center;gap:6px}
.stats .turn .ic{width:16px;height:16px;color:var(--ink2)}

/* discs */
.disc{width:66px;height:66px;border-radius:50%;background:#eef5fb;color:var(--navy);display:grid;place-items:center;box-shadow:0 5px 0 #b9cadb,0 9px 18px rgba(0,0,0,.25);position:relative;flex:none}
.disc .ic{width:32px;height:32px}
.disc.y{background:var(--yellow);color:var(--yellow-ink);box-shadow:0 5px 0 #c9951c,0 9px 18px rgba(0,0,0,.25)}
.disc.navy{background:var(--navy2);color:#fff;box-shadow:0 5px 0 #0b1826,0 9px 18px rgba(0,0,0,.3)}
.lbl{font-size:13.5px;font-weight:800;text-align:center;margin-top:9px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap}
.badge{position:absolute;top:-5px;right:-5px;min-width:24px;height:24px;border-radius:12px;background:var(--gre);color:#fff;font-size:13px;font-weight:900;display:grid;place-items:center;padding:0 6px;box-shadow:0 0 0 2.5px var(--navy)}
.col{display:flex;flex-direction:column;align-items:center}

/* zoom rail */
.zoom{position:absolute;left:10px;z-index:5;width:56px;background:var(--panel);border-radius:28px;display:flex;flex-direction:column;align-items:center;padding:4px 0;box-shadow:0 6px 18px rgba(0,0,0,.3);touch-action:none;user-select:none;-webkit-user-select:none}
.zb{width:48px;height:48px;border-radius:50%;font-size:28px;font-weight:900;line-height:1;display:grid;place-items:center;color:#fff}
.zb:active{background:rgba(255,255,255,.12)}
.ztrack{position:relative;width:48px;height:150px;cursor:grab}
.ztrack::before{content:"";position:absolute;left:50%;top:10px;bottom:10px;width:6px;margin-left:-3px;border-radius:3px;background:rgba(255,255,255,.14)}
.zfill{position:absolute;left:50%;bottom:10px;width:6px;margin-left:-3px;border-radius:3px;background:var(--sci)}
.zknob{position:absolute;left:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:#fff;box-shadow:0 3px 0 #b9cadb,0 4px 10px rgba(0,0,0,.35)}
.zval{font-size:12px;font-weight:900;color:var(--ink2);padding:2px 0 4px}
.zrail{display:flex;flex-direction:column;align-items:center;animation:zin .22s cubic-bezier(.16,1,.3,1)}
@keyframes zin{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.ztoggle{width:56px;height:56px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#fff;font-size:11.5px;font-weight:900}
.ztoggle .ic{width:22px;height:22px}
.zoom:not(.open) .zrail,.zoom.open .ztoggle{display:none}
.zoom:not(.open){padding:0}

/* dock A */
.dock{position:absolute;left:0;right:0;bottom:0;padding:0 14px 40px;display:flex;align-items:flex-end;gap:14px;z-index:4}
.turnbtn{margin-left:auto;height:74px;padding:0 18px 0 24px;border-radius:37px;background:var(--yellow);color:var(--yellow-ink);display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;white-space:nowrap;box-shadow:0 5px 0 #c9951c,0 10px 20px rgba(0,0,0,.3);margin-bottom:24px}
.turnbtn .n{background:var(--yellow-ink);color:var(--yellow);border-radius:12px;font-size:15px;padding:3px 9px}
.notes{position:absolute;right:14px;display:flex;flex-direction:column;gap:12px;z-index:4}
.note{position:relative;width:54px;height:54px;border-radius:50%;background:var(--panel);display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.note .ic{width:26px;height:26px}

/* panels & sheets */
.panel{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-radius:26px 26px 0 0;z-index:6;box-shadow:0 -8px 24px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.grab{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:8px auto 0;flex:none}
.unithead{display:flex;align-items:center;gap:14px;padding:16px 18px 0}
.uport{width:58px;height:58px;border-radius:50%;background:var(--bab);display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);flex:none}
.uport .ic{width:34px;height:34px;color:#fff}
.uname{font-size:21px;font-weight:900}
.uline{display:flex;gap:12px;margin-top:4px;font-size:15px;font-weight:800;color:var(--ink2)}
.uline span{display:flex;align-items:center;gap:4px}
.hp{margin-left:auto;align-self:flex-start;font-size:14px;font-weight:900;background:rgba(111,208,90,.18);color:#9ff08a;border-radius:9px;padding:5px 9px}
.actions{display:flex;justify-content:space-between;padding:18px 12px 40px}
.act{display:flex;flex-direction:column;align-items:center;width:72px}
.act .lbl{text-shadow:none;color:var(--ink2);font-weight:800}
.act.primary .lbl{color:#fff}

.sheet{position:absolute;left:0;right:0;bottom:0;background:#122536;border-radius:28px 28px 0 0;z-index:6;box-shadow:0 -10px 30px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden}
.sh-head{display:flex;align-items:center;gap:12px;padding:10px 16px 6px;flex:none}
.pop{width:48px;height:48px;border-radius:50%;background:var(--bab);display:grid;place-items:center;font-weight:900;font-size:21px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);flex:none}
.sh-title{font-size:23px;font-weight:900;display:flex;align-items:center;gap:6px}
.sh-sub{font-size:14px;font-weight:700;color:var(--ink2);margin-top:1px}
.x{margin-left:auto;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.09);display:grid;place-items:center;flex:none}
.x .ic{width:18px;height:18px;color:var(--ink2)}
.yields{display:flex;justify-content:space-between;padding:8px 16px 12px;flex:none}
.y1{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;font-size:16px;min-width:48px;min-height:48px;justify-content:center}
.y1 svg.st{width:22px;height:22px}
.tabs{display:flex;padding:0 8px;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;min-height:52px;font-weight:800;font-size:16px;color:var(--ink3);position:relative}
.tabs button.on{color:#fff}
.tabs button.on::after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:3px;border-radius:2px;background:var(--yellow)}
.scroll{flex:1;overflow:auto;padding:12px 14px 40px;scrollbar-width:none;min-height:0}
.scroll::-webkit-scrollbar{display:none}
.curbuild{background:var(--navy2);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center}
.cicon{width:52px;height:52px;border-radius:15px;background:#2a4866;display:grid;place-items:center;flex:none}
.cicon .ic{width:32px;height:32px;color:#fff}
.cname{font-weight:900;font-size:18px}
.bar{height:9px;border-radius:5px;background:rgba(255,255,255,.1);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--prod);border-radius:5px}
.buy{margin-left:auto;min-height:48px;background:var(--yellow);color:var(--yellow-ink);border-radius:14px;padding:0 12px;font-weight:900;font-size:16px;display:flex;align-items:center;gap:5px;box-shadow:0 3px 0 #c9951c;flex:none}
.h3{font-size:14px;font-weight:800;color:var(--ink3);margin:18px 2px 6px}
.row{display:flex;align-items:center;gap:12px;min-height:66px;padding:8px 4px;border-bottom:1px solid var(--line)}
.row .cicon{width:46px;height:46px;border-radius:13px}
.row .cicon .ic{width:28px;height:28px}
.rname{font-weight:800;font-size:16.5px}
.rsub{font-size:13.5px;font-weight:700;color:var(--ink2);display:flex;gap:8px;margin-top:3px;align-items:center;flex-wrap:wrap}
.rsub span{display:flex;gap:3px;align-items:center}
.rsub svg.st{width:15px;height:15px}
.turns{margin-left:auto;font-weight:900;font-size:17px;display:flex;align-items:center;gap:4px;color:#fff;flex:none}
.turns small{font-size:13px;color:var(--ink3);font-weight:700}
.wonder .cicon{background:#5a3f13}
.wonder .cicon .ic{color:var(--yellow)}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border-radius:12px;padding:6px 10px 6px 7px;font-size:13.5px;font-weight:800;white-space:nowrap}
.chip .ic{width:20px;height:20px}
.chip.w{background:rgba(255,201,60,.15);color:var(--yellow)}
.big{min-height:60px;border-radius:18px;background:var(--yellow);color:var(--yellow-ink);font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 0 #c9951c;width:100%}
.ghost{min-height:54px;border-radius:16px;background:rgba(255,255,255,.08);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}

/* tech tree */
.tt{position:relative;flex:1;min-height:0}
.ttscroll{position:absolute;inset:0;overflow:auto;scrollbar-width:none;overscroll-behavior:contain}
.ttscroll::-webkit-scrollbar{display:none}
.canvas{position:relative;width:393px;margin:0 auto}
.band{position:relative;border-top:1px solid rgba(255,255,255,.06)}
.band.odd{background:rgba(255,255,255,.028)}
.band h4{position:sticky;left:0;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;font-size:15px;font-weight:900;color:var(--ink2);white-space:nowrap}
.band h4 small{font-size:12.5px;color:var(--ink3);font-weight:800}
.links{position:absolute;left:0;top:0;pointer-events:none}
.tn{position:absolute;width:92px;margin-left:-46px;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.tn .d{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;position:relative;transition:box-shadow .15s}
.tn .d .ic{width:38px;height:38px}
.tn .nm{font-size:13px;font-weight:800;line-height:1.15;max-width:92px;text-shadow:0 0 3px #122536,0 0 3px #122536,0 0 6px #122536}
.tn.done .d{background:var(--bab);color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2)}
.tn.done .nm{color:var(--ink2)}
.tn.now .d{background:#fff;color:var(--navy);box-shadow:0 0 0 5px var(--yellow)}
.tn.av .d{background:#eef5fb;color:var(--navy);box-shadow:inset 0 -5px 0 #b9cadb}
.tn.lock .d{background:#1f3850;color:#6f8ba4}
.tn.lock .nm{color:var(--ink3)}
.tn.onpath .d{box-shadow:0 0 0 4px var(--yellow)}
.tn.onpath .nm{color:#fff}
.tn.sel .d{box-shadow:0 0 0 5px #fff,0 0 0 11px rgba(255,201,60,.55)}
.tn .t{position:absolute;bottom:-5px;right:-8px;background:var(--navy);color:#fff;font-size:12px;font-weight:900;border-radius:9px;padding:2px 7px;box-shadow:0 0 0 2px #122536}
.tn .q{position:absolute;top:-6px;left:-6px;width:26px;height:26px;border-radius:50%;background:var(--yellow);color:var(--yellow-ink);font-size:13.5px;font-weight:900;display:grid;place-items:center;box-shadow:0 0 0 2.5px #122536}
.tfoot{flex:none;background:var(--navy2);border-radius:22px 22px 0 0;padding:12px 16px 14px;display:flex;flex-direction:column;gap:11px;box-shadow:0 -8px 24px rgba(0,0,0,.3);position:relative;z-index:2}
.tf1{display:flex;align-items:center;gap:12px}
.tf1 .d{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;flex:none}
.tf1 .d .ic{width:32px;height:32px}
.hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.hscroll::-webkit-scrollbar{display:none}
.pathline{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:800;color:var(--ink2)}
.pathline .pi{display:flex;align-items:center;gap:5px;color:#fff;white-space:nowrap}
.pathline .pi i.n{width:22px;height:22px;border-radius:50%;background:var(--yellow);color:var(--yellow-ink);font-style:normal;font-size:12px;display:grid;place-items:center}
.pathline .arrow{color:var(--ink3)}

/* B: decision queue */
.queue{position:absolute;left:10px;right:10px;bottom:30px;background:var(--panel);border-radius:28px;z-index:6;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.qtop{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--ink2);padding:0 4px 10px}
.dots{display:flex;gap:6px;margin-left:auto}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2)}
.dots i.on{background:var(--yellow);width:20px;border-radius:4px}
.qhead{display:flex;align-items:center;gap:12px;padding:0 4px}
.qbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:14px}
.qb{min-height:76px;border-radius:18px;background:rgba(255,255,255,.09);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:14.5px;font-weight:800}
.qb .ic{width:28px;height:28px}
.qb.p{grid-column:1/-1;flex-direction:row;min-height:64px;background:var(--yellow);color:var(--yellow-ink);font-size:19px;gap:10px;box-shadow:0 4px 0 #c9951c}
.qb.alt{grid-column:1/-1;flex-direction:row;min-height:56px;font-size:16px}
.qcorner{position:absolute;right:14px;z-index:5;display:flex;gap:12px}
.odds{display:flex;gap:9px;margin-top:12px;padding:0 4px}
.odds div{flex:1;background:rgba(255,255,255,.06);border-radius:14px;padding:9px 12px;font-size:13.5px;font-weight:700;color:var(--ink2)}
.odds b{display:block;font-size:19px;color:#fff;font-weight:900}
.odds .good b{color:#9ff08a}

/* C: thumb arc */
.arcwrap{position:absolute;right:0;bottom:0;width:393px;height:440px;z-index:5;pointer-events:none}
.arcwrap>*{pointer-events:auto}
.anchor{position:absolute;right:20px;bottom:40px;width:96px;height:96px;border-radius:50%;background:var(--yellow);color:var(--yellow-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:15px;box-shadow:0 5px 0 #c9951c,0 12px 24px rgba(0,0,0,.35);gap:2px}
.anchor .ic{width:34px;height:34px}
.arcbtn{position:absolute;transform:translate(-33px,-33px)}
.arcbtn .lbl{margin:0;position:absolute;right:76px;top:50%;transform:translateY(-50%);background:var(--panel);padding:6px 11px;border-radius:11px;text-shadow:none;font-size:14.5px;line-height:1.2}
.arcbtn.below .lbl{right:auto;left:50%;top:auto;bottom:-40px;transform:translateX(-50%)}
.arcbtn .lbl b{display:block}
.civdisc{position:absolute;left:18px;bottom:46px;z-index:5}
.utag{position:absolute;left:10px;right:10px;top:112px;background:var(--panel);border-radius:18px;padding:10px 14px 10px 10px;display:flex;align-items:center;gap:12px;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.utag .uport{width:46px;height:46px}
.utag .uport .ic{width:28px;height:28px}
.utag .uname{font-size:18px}
.utag .uline{font-size:14px;gap:10px;margin-top:1px}
.pager{position:absolute;right:128px;bottom:66px;z-index:5;background:var(--panel);border-radius:26px;height:52px;display:flex;align-items:center;gap:8px;padding:0 16px 0 8px;font-weight:900;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.pager .mini{width:38px;height:38px;border-radius:50%;background:var(--bab);display:grid;place-items:center}
.pager .mini .ic{width:24px;height:24px;color:#fff}
.btabs{display:flex;gap:6px;padding:8px 10px 36px;background:#0f2030;border-top:1px solid var(--line);flex:none}
.btabs button{flex:1;min-height:60px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:800;color:var(--ink3)}
.btabs button .ic{width:26px;height:26px}

/* ---------- units: generated low-poly sprites, recolored per civ, animated as whole sprites ---------- */

const UNITART = /*UNITART*/{};

const KIND_SPR={bow:'k_bowman',war:'k_warrior',hop:'k_hoplite',set:'k_settler',wrk:'k_worker'};

    const d=cx.getImageData(0,0,W0,H0).data;

    for(let y=0;y<H0;y++) for(let x=0;x<W0;x++) if(d[(y*W0+x)*4+3]>24){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
    const w=x1-x0+1, h=y1-y0+1; SPR[name]={w,h};

// Feet sit at (0,0). Height is in map units; the base ring keeps the owner readable at a glance.

function labTick(t){

        if(p<.32){ const q=p/.32; x-=dir*5*q; lean=-dir*10*q; sy=1-.06*q; }
        else if(p<.46){ const q=(p-.32)/.14; x+=dir*(-5+24*ease(q)); lean=dir*14*q; pose=a.pose; sy=1.04; if(q>.6&&!a.hit){a.hit=1;a.onHit&&a.onHit();} }
        else { const q=(p-.46)/.54; x+=dir*19*(1-ease(q)); lean=dir*14*(1-ease(q)); if(q<.5) pose=a.pose; } }
      if(a.kind==='hit'){ const dir=a.dir||1; x+=dir*8*Math.pow(1-p,2)+Math.sin(p*40)*2.5*(1-p); flash=Math.max(0,1-p*1.6); sy=1-.08*(1-p); }

/* ---------- tech: "Next up" decision view + portrait "Full tree" ---------- */
const SCI=18;
const DONE=new Set(['Agriculture','Pottery','Animal Husbandry','Archery','Mining','Sailing','Calendar','Bronze Working']);
const NOW='Writing', NOW_LEFT=40;
const TBY=Object.fromEntries(TECHS.map(t=>[t[0],{name:t[0],col:t[1],row:t[2],era:t[3].replace(' era',''),cost:t[4],pre:t[5],unl:t[6],abil:t[7],quote:t[8],next:[]}]));
Object.values(TBY).forEach(t=>t.pre.forEach(p=>TBY[p].next.push(t.name)));
const UNL_KIND={w:'Wonders',n:'National wonders',b:'Buildings',u:'Units',i:'Improvements',r:'Reveals'};
const ERAS=[...new Set(TECHS.map(t=>t[3].replace(' era','')))];
const state=n=>DONE.has(n)?'done':n===NOW?'now':TBY[n].pre.every(p=>DONE.has(p))?'av':'lock';
const turnsFor=n=>Math.ceil((n===NOW?NOW_LEFT:TBY[n].cost)/SCI);
function pathTo(n){ // unresearched prerequisites in research order, current research first
  const out=[], seen=new Set();
  (function walk(x){ if(seen.has(x)||DONE.has(x)) return; seen.add(x); TBY[x].pre.forEach(walk); out.push(x); })(n);
  return out.sort((a,b)=>(a===NOW?-1:b===NOW?1:TBY[a].col-TBY[b].col));
}
const pathTurns=n=>pathTo(n).reduce((a,x)=>a+turnsFor(x),0);
const KIND={w:'Wonders',u:'Units',b:'Buildings'};
let PICK=null, GOALTAB='w', TSEL=null;

const tdisc=(n,size=56)=>`<div class="tn ${state(n)}" style="position:static;width:auto;margin:0"><div class="d" style="width:${size}px;height:${size}px">${ic('t_'+n,`width:${size*.58}px;height:${size*.58}px`)}</div></div>`;
const chips=(t,max=4)=>t.unl.slice(0,max).map(u=>`<span class="chip ${u[1]==='w'?'w':''}">${ic('u_'+u[0])}${u[0]}</span>`).join('');
const pathChips=path=>`<div class="pathline hscroll">${path.map((n,i)=>`${i?'<span class="arrow">&rarr;</span>':''}<span class="pi"><i class="n">${i+1}</i>${n}</span>`).join('')}</div>`;
const techHead=mode=>`<div class="sh-head"><div><div class="sh-title">Technology</div><div class="sh-sub">+${SCI} science per turn</div></div><button class="x">${ic('Close')}</button></div>
  <div class="tabs tmode"><button data-s="Tech" class="${mode==='Tech'?'on':''}">Next up</button><button data-s="Tree" class="${mode==='Tree'?'on':''}">Full tree</button></div>`;

/* A: what can I do now, and where do I want to go */
function goalsFor(kind){
  const g=[];
  for(const t of Object.values(TBY)){ if(DONE.has(t.name)) continue;
    for(const u of t.unl){ if((u[1]==='n'?'b':u[1])!==kind) continue; g.push({u:u[0],k:u[1],tech:t.name,turns:pathTurns(t.name),steps:pathTo(t.name).length}); } }
  return g.sort((a,b)=>a.turns-b.turns).slice(0,8);
}
function techPick(){
  const now=TBY[NOW], avail=Object.values(TBY).filter(t=>state(t.name)==='av').sort((a,b)=>turnsFor(a.name)-turnsFor(b.name));
  const pct=Math.round((1-NOW_LEFT/now.cost)*100);
  let bar;
  if(!PICK) bar=`<button class="ghost" data-s="Tree">${ic('t_Philosophy','width:20px;height:20px')}See the full tree</button>`;
  else if(PICK.kind==='tech') bar=`<button class="big">Research ${PICK.tech} next, ${turnsFor(PICK.tech)} turns</button>`;
  else { const p=pathTo(PICK.tech); bar=`<div class="tbarhead">${ic('u_'+PICK.u,'width:22px;height:22px;color:var(--yellow)')}<b>${PICK.u}</b><span>${p.length} ${p.length>1?'techs':'tech'}, ${pathTurns(PICK.tech)} turns</span></div>${pathChips(p)}<button class="big">Queue the path</button>`; }
  return `<div class="scroll tpick">
    <div class="nowcard">${tdisc(NOW,60)}<div style="flex:1;min-width:0"><div class="rsub" style="margin:0 0 2px">Researching</div><div class="cname">${NOW}</div><div class="bar"><i style="width:${pct}%;background:var(--sci)"></i></div></div><div class="turns">${turnsFor(NOW)}<small>turns</small></div></div>
    <div class="hscroll" style="margin-top:10px">${chips(now)}</div>
    <div class="h3">Pick next</div>
    ${avail.map(t=>`<button class="tcard ${PICK&&PICK.kind==='tech'&&PICK.tech===t.name?'on':''}" data-pick="tech|${t.name}">${tdisc(t.name,50)}<div class="tc-mid"><div class="rname">${t.name}</div><div class="unl">${t.unl.slice(0,3).map(u=>`<span class="mini ${u[1]==='w'?'w':''}">${ic('u_'+u[0])}${u[0]}</span>`).join('')||'<span class="mini">Opens later techs</span>'}</div></div><div class="turns">${turnsFor(t.name)}<small>turns</small></div></button>`).join('')}
    <div class="h3">Goals</div>
    <div class="gtabs">${Object.entries(KIND).map(([k,l])=>`<button data-gtab="${k}" class="${GOALTAB===k?'on':''}">${l}</button>`).join('')}</div>
    ${goalsFor(GOALTAB).map(g=>`<button class="grow ${PICK&&PICK.kind==='goal'&&PICK.u===g.u?'on':''} ${g.k==='w'?'wonder':''}" data-pick="goal|${g.tech}|${g.u}"><div class="cicon">${ic('u_'+g.u)}</div><div class="tc-mid"><div class="rname">${g.u}</div><div class="rsub"><span>via ${g.tech}</span><span>${g.steps} ${g.steps>1?'techs':'tech'}</span></div></div><div class="turns">${g.turns}<small>turns</small></div></button>`).join('')}
  </div><div class="tbar">${bar}</div>`;
}

/* B: Civ's tree re-laid into four lanes so it only scrolls vertically */
const LX=[62,154,246,338], RH=150, BANDH=42, NODE_BOTTOM=80;
const TREE=(()=>{
  const pos={}, bands=[]; let y=0;
  for(const era of ERAS){
    const top=y; y+=BANDH;
    const cols=[...new Set(TECHS.filter(t=>t[3].replace(' era','')===era).map(t=>t[1]))];
    for(const c of cols){
      const ts=TECHS.filter(t=>t[1]===c).map(t=>t[0]);
      const bary=n=>{const p=TBY[n].pre.filter(x=>pos[x]);return p.length?p.reduce((a,x)=>a+pos[x][0],0)/p.length:196};
      ts.sort((a,b)=>bary(a)-bary(b));
      const rows=ts.length<=4?[ts]:[ts.filter((_,i)=>i%2===0),ts.filter((_,i)=>i%2===1)];
      for(const row of rows){
        // pick the lanes that keep each tech closest to its parents, preserving left-to-right order
        let best=null;
        (function choose(start,picked){ if(picked.length===row.length){const cost=picked.reduce((a,l,i)=>a+Math.abs(LX[l]-bary(row[i])),0);if(!best||cost<best.cost)best={cost,picked:[...picked]};return}
          for(let l=start;l<=4-(row.length-picked.length);l++){picked.push(l);choose(l+1,picked);picked.pop()} })(0,[]);
        row.forEach((n,i)=>pos[n]=[LX[best.picked[i]], y+40]);
        y+=RH;
      }
    }
    bands.push({era,top,h:y-top});
  }
  return {pos,bands,H:y+30};
})();
const nodeBottom=n=>n.length>12?NODE_BOTTOM+22:NODE_BOTTOM;
function unlockRow(t){
  const items=t.unl.slice(0,t.abil.length?3:4), more=t.unl.length-items.length;
  return `<div class="urow">${items.map(u=>`<i class="ic i-${slug('u_'+u[0])} k-${u[1]}"></i>`).join('')}${t.abil.length?`<i class="ic i-Star k-a"></i>`:''}${more>0?`<b>+${more}</b>`:''}</div>`;
}
function techTree(){
  const path=TSEL?pathTo(TSEL):[], onpath=new Set(path), {pos,bands,H}=TREE;
  // every line is solid; a dark casing separates crossings, state picks the color
  const casing=[], lines=[], hotLines=[];
  for(const t of Object.values(TBY)) for(const p of t.pre){
    const[x1,y1]=pos[p],[x2,y2]=pos[t.name]; const a=y1+nodeBottom(p), b=y2-36, m=(a+b)/2;
    const d=`M${x1} ${a}C${x1} ${m} ${x2} ${m} ${x2} ${b}`;
    const onSel=onpath.has(t.name)&&(onpath.has(p)||DONE.has(p)), out=TSEL&&p===TSEL;
    const col=onSel?'#ffc93c':out?'#ffffff':DONE.has(t.name)?'#3f8ff0':DONE.has(p)?'#9cc0e2':'#56779a';
    const w=onSel||out?4.5:3;
    casing.push(`<path d="${d}" stroke="#122536" stroke-width="${w+5}" fill="none" stroke-linecap="round"/>`);
    (onSel||out?hotLines:lines).push(`<path d="${d}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round" ${out?'stroke-dasharray="7 6"':''}/>`);
  }
  const links=casing.join('')+lines.join('')+hotLines.join('');
  const nodes=Object.values(TBY).map(t=>{const[x,y]=pos[t.name]; const s=state(t.name); const q=path.indexOf(t.name);
    return `<button class="tn ${s} ${onpath.has(t.name)?'onpath':''} ${t.name===TSEL?'sel':''}" data-tech="${t.name}" style="left:${x}px;top:${y-33}px"><div class="d">${ic('t_'+t.name)}${q>=0?`<span class="q">${q+1}</span>`:''}${s!=='done'?`<span class="t">${turnsFor(t.name)}</span>`:''}</div><div class="nm">${t.name}</div>${unlockRow(t)}</button>`}).join('');
  const bandHtml=bands.map((b,i)=>{const inEra=TECHS.filter(t=>t[3].replace(' era','')===b.era),got=inEra.filter(t=>DONE.has(t[0])).length;
    return `<div class="band ${i%2?'odd':''}" style="position:absolute;left:0;right:0;top:${b.top}px;height:${b.h}px"></div><h4 class="eralbl" style="top:${b.top+6}px">${b.era}<small>${got} of ${inEra.length}</small></h4>`}).join('');
  let card='';
  if(TSEL){ const t=TBY[TSEL], s=state(TSEL), total=pathTurns(TSEL);
    const groups=Object.entries(UNL_KIND).map(([k,l])=>[l,t.unl.filter(u=>u[1]===k)]).filter(g=>g[1].length);
    const techChips=list=>list.map(n=>`<button class="chip tchip ${state(n)}" data-tech="${n}">${ic('t_'+n)}${n}</button>`).join('');
    card=`<div class="tdetail fade-in"><div class="tf1">${tdisc(TSEL,52)}<div style="min-width:0;flex:1"><div class="cname">${TSEL}</div><div class="rsub"><span>${st('sci')}${t.cost}</span><span>${turnsFor(TSEL)} turns</span><span>${t.era} era</span></div></div><button class="x" data-tclose>${ic('Close')}</button></div>
      <div class="tinfo">
        ${groups.map(([l,us])=>`<div class="ti"><div class="til">${l}</div><div class="tiw">${us.map(u=>`<span class="chip k-${u[1]}">${ic('u_'+u[0])}${u[0]}</span>`).join('')}</div></div>`).join('')}
        ${t.abil.length?`<div class="ti"><div class="til">Abilities</div>${t.abil.map(a=>`<div class="abil">${ic('Star')}${a}</div>`).join('')}</div>`:''}
        ${t.pre.length?`<div class="ti"><div class="til">Requires</div><div class="tiw">${techChips(t.pre)}</div></div>`:''}
        ${t.next.length?`<div class="ti"><div class="til">Leads to</div><div class="tiw">${techChips(t.next)}</div></div>`:''}
        ${t.quote?`<div class="quote">${t.quote}</div>`:''}
      </div>
      ${path.length>1?pathChips(path):''}
      ${s==='done'?`<button class="ghost">Already researched</button>`:s==='now'?`<button class="ghost">Researching now, ${turnsFor(TSEL)} turns left</button>`:`<button class="big">${path.length>1?`Queue ${path.length} techs, ${total} turns`:`Research next, ${total} turns`}</button>`}</div>`; }
  return `<div class="tt"><div class="ttscroll"><div class="canvas" style="height:${H}px;zoom:${ZOOM.tech.v}">${bands.map((b,i)=>`<div class="band ${i%2?'odd':''}" style="position:absolute;left:0;right:0;top:${b.top}px;height:${b.h}px"></div>`).join('')}<svg class="links" width="393" height="${H}">${links}</svg>${bandHtml.replace(/<div class="band[^>]*><\/div>/g,'')}${nodes}</div></div></div>${card}
  <div class="erabar">${zoomRail('tech','')}<div class="eras">${ERAS.map(e=>`<button data-era="${e}">${e==='Renaissance'?'Renaiss.':e==='Information'?'Info':e}</button>`).join('')}</div></div>`;
}
function techSheet(mode){
  return `<div class="sheet fade-in" style="top:56px"><div class="grab"></div>${techHead(mode)}${mode==='Tech'?techPick():techTree()}</div>`;
}
function initTree(){
  const sc=document.querySelector('.ttscroll'); if(!sc) return;
  if(window._ttScroll){sc.scrollTop=_ttScroll[1];} else sc.scrollTop=Math.max(0,(TREE.pos[NOW][1]-150)*ZOOM.tech.v);

  sc.addEventListener('scroll',sync,{passive:true}); sync();
}

    <div class="dgrid"><button class="qb">${ic('Present','width:26px;height:26px')}Trade</button><button class="qb">${ic('Diplomacy','width:26px;height:26px')}Friendship</button><button class="qb">${ic('Espionage','width:26px;height:26px')}Denounce</button><button class="qb war">${ic('Hoplite','width:30px;height:30px')}Declare war</button></div>
    <div class="h3">Everyone you have met</div>
    <div class="row"><div class="lmini" style="background-image:url(${ART.p_Nebuchadnezzar})"></div><div><div class="rname">Nebuchadnezzar II</div><div class="rsub"><span>Babylon, you</span><span>Score 212</span></div></div></div>
    <div class="row"><div class="lmini" style="background-image:url(${ART.p_Alexander})"></div><div><div class="rname">Alexander</div><div class="rsub"><span>Greece</span><span>Score 248</span></div></div><div class="turns" style="color:var(--gold)">Competitor</div></div>
    <div class="row"><div class="cicon" style="background:var(--kab)">${ic('CityState')}</div><div><div class="rname">Sidon</div><div class="rsub"><span>Militaristic city-state</span><span>Influence 48, Ally at 60</span></div></div><div class="turns" style="color:var(--hap)">Friend</div></div>
   </div></div>`;
}

/* ---------- canvas ---------- */
let cs=localStorage.getItem('ps2')||'Map'; if(!S.includes(cs))cs='Map';
function draw(keepTech){
  const sc=document.querySelector('.ttscroll'), tp=document.querySelector('.tpick'); window._ttScroll=keepTech&&sc?[sc.scrollLeft,sc.scrollTop]:null; const keepPick=keepTech&&tp?tp.scrollTop:null;
  document.getElementById('screen').innerHTML=screenFor(cs);
  document.getElementById('sseg').innerHTML=S.map(s=>`<button aria-pressed="${s===cs}" data-s="${s}">${s}</button>`).join('');
  document.getElementById('thesis').textContent=THESIS[cs];
  localStorage.setItem('ps2',cs);
  fit(); applyZoom('map'); applyZoom('tech'); initTree(); initLab(); if(keepPick!=null) document.querySelector('.tpick').scrollTop=keepPick;
}
function fit(){
  const d=document.getElementById('device'), wrap=document.getElementById('stagewrap');
  const narrow=innerWidth<520; d.classList.toggle('bare',narrow);
  const pad=narrow?0:28; const sc=Math.min((wrap.clientWidth-pad)/393,(wrap.clientHeight-pad)/852,1.25);
  d.style.transform=`scale(${sc})`; d.style.marginTop=narrow?'0':'12px';
}
document.addEventListener('click',e=>{
  const zt=e.target.closest('[data-ztoggle]'); if(zt){touchZoom(zt.closest('.zoom'));return}
  const z=e.target.closest('[data-zstep]'); if(z){const k=z.closest('.zoom').dataset.zoom;touchZoom(z.closest('.zoom'));setZoom(k,ZOOM[k].v+z.dataset.zstep*.15);return}
  if(!e.target.closest('.zoom')) document.querySelectorAll('.zoom.open').forEach(el=>el.classList.remove('open'));
  const lb=e.target.closest('[data-lab]'); if(lb){labAction(lb.dataset.lab);return}
  const t=e.target.closest('[data-tech]'); if(t){TSEL=t.dataset.tech;draw(true);return}
  if(e.target.closest('[data-tclose]')){TSEL=null;draw(true);return}
  const pk=e.target.closest('[data-pick]'); if(pk){const[kind,tech,u]=pk.dataset.pick.split('|');PICK=PICK&&PICK.tech===tech&&PICK.u===u?null:{kind,tech,u};draw(true);return}
  const gt=e.target.closest('[data-gtab]'); if(gt){GOALTAB=gt.dataset.gtab;PICK=null;draw(true);return}
  const er=e.target.closest('button[data-era]'); if(er){const b=TREE.bands.find(b=>b.era===er.dataset.era);document.querySelector('.ttscroll').scrollTo({top:b.top*ZOOM.tech.v,behavior:'smooth'});return}
  const b=e.target.closest('button[data-s]');if(!b)return;cs=b.dataset.s;draw()});
document.addEventListener('keydown',e=>{const i=S.indexOf(cs);if(e.key==='ArrowRight'){cs=S[(i+1)%S.length];draw()}if(e.key==='ArrowLeft'){cs=S[(i+S.length-1)%S.length];draw()}});
addEventListener('resize',fit);
prepSprites().then(draw);
</script>
</body>
